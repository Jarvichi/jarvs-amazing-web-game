<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarv's Amazing Web Game</title>
  <!-- Rollbar is initialised via src/rollbar.ts (imported in main.tsx) -->
</head>
<body>
<!-- SVG filter defs — referenced by CSS filter: url(#...) in 8-bit mode -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Pixelation filter: samples the source on an 8×8 grid and dilates each
      sample to fill its cell, giving chunky low-res pixel blocks.
      Cell = 8×8px. Sample = 2×2 at (3,3). Dilate radius 3 → exact 8×8 fill.
    -->
    <filter id="filter-pixelate-bg" x="0%" y="0%" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <!-- 2×2 white dot at (3,3) within the tile -->
      <feFlood flood-color="white" flood-opacity="1" x="3" y="3" height="2" width="2" result="dot"/>
      <!-- Clip to 8×8 tile region — operator=in with same src is a transparent pass-through clipped to subregion -->
      <feComposite in="dot" in2="dot" operator="in" x="0" y="0" width="8" height="8" result="tile"/>
      <!-- Tile across entire filter area -->
      <feTile in="tile" result="grid"/>
      <!-- Sample SourceGraphic only at grid-opaque positions -->
      <feComposite in="SourceGraphic" in2="grid" operator="in" result="sampled"/>
      <!-- Dilate each 2×2 sample by 3px → fills the 8×8 block -->
      <feMorphology in="sampled" operator="dilate" radius="3"/>
    </filter>
  </defs>
</svg>
<div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
