<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="filter: brightness(1.4)">
  <rect width="400" height="240" fill="#070502"/>

  <linearGradient id="vault-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#080602"/>
    <stop offset="50%" stop-color="#100a04"/>
    <stop offset="100%" stop-color="#180e06"/>
  </linearGradient>
  <rect width="400" height="240" fill="url(#vault-sky)"/>

  <!-- Warm brass glow pulse -->
  <radialGradient id="vault-glow" cx="50%" cy="70%" r="55%">
    <stop offset="0%" stop-color="#583010">
      <animate attributeName="stop-opacity" values="0.4;0.65;0.4" dur="4s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#583010" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="240" fill="url(#vault-glow)"/>

  <!-- STONE CEILING -->
  <polygon points="0,0 400,0 400,50 370,38 335,52 300,36 265,52 230,34 200,50 170,34 135,50 100,36 65,52 30,38 0,50" fill="#0a0806"/>
  <g fill="#0e0c08" opacity="0.5">
    <polygon points="0,50 30,38 25,55"/>
    <polygon points="65,52 100,36 90,55"/>
    <polygon points="135,50 170,34 160,55"/>
    <polygon points="230,34 265,52 255,55"/>
    <polygon points="300,36 335,52 330,56"/>
    <polygon points="370,38 400,50 400,55"/>
  </g>

  <!-- VAULT WALLS -->
  <g fill="#0a0806" stroke="#141008" stroke-width="1">
    <rect x="0"   y="50" width="65"  height="190"/>
    <rect x="335" y="50" width="65"  height="190"/>
  </g>
  <!-- Wall gear cutouts -->
  <g fill="#060402" stroke="#0e0a06" stroke-width="0.8">
    <circle cx="32"  cy="95"  r="18"/>
    <circle cx="32"  cy="145" r="18"/>
    <circle cx="32"  cy="195" r="18"/>
    <circle cx="368" cy="95"  r="18"/>
    <circle cx="368" cy="145" r="18"/>
    <circle cx="368" cy="195" r="18"/>
  </g>
  <!-- Wall gear teeth -->
  <g fill="#0e0a04" opacity="0.7">
    <circle cx="32"  cy="75"  r="3"/>
    <circle cx="50"  cy="79"  r="3"/>
    <circle cx="14"  cy="79"  r="3"/>
    <circle cx="32"  cy="115" r="3"/>
    <circle cx="50"  cy="111" r="3"/>
    <circle cx="14"  cy="111" r="3"/>
    <circle cx="368" cy="75"  r="3"/>
    <circle cx="386" cy="79"  r="3"/>
    <circle cx="350" cy="79"  r="3"/>
    <circle cx="368" cy="115" r="3"/>
    <circle cx="386" cy="111" r="3"/>
    <circle cx="350" cy="111" r="3"/>
  </g>
  <!-- Wall gear hub glows — staggered pulse -->
  <circle cx="32"  cy="95"  r="6" fill="#804010">
    <animate attributeName="opacity" values="0.4;0.72;0.4" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32"  cy="145" r="6" fill="#804010">
    <animate attributeName="opacity" values="0.4;0.72;0.4" dur="3s" begin="0.75s" repeatCount="indefinite"/>
  </circle>
  <circle cx="368" cy="95"  r="6" fill="#804010">
    <animate attributeName="opacity" values="0.4;0.72;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="368" cy="145" r="6" fill="#804010">
    <animate attributeName="opacity" values="0.4;0.72;0.4" dur="3s" begin="2.25s" repeatCount="indefinite"/>
  </circle>

  <!-- GREAT GEAR COLUMNS — rotating -->
  <!-- Left top gear — clockwise, with teeth -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 110 90" to="360 110 90" dur="30s" repeatCount="indefinite"/>
    <circle cx="110" cy="90"  r="35" fill="#0c0a04" stroke="#181008" stroke-width="1.5"/>
    <circle cx="110" cy="90"  r="22" fill="#181008" opacity="0.5"/>
    <g fill="#160e04" stroke="#201408" stroke-width="0.8" opacity="0.7">
      <circle cx="110" cy="55"  r="4"/>
      <circle cx="130" cy="60"  r="4"/>
      <circle cx="143" cy="72"  r="4"/>
      <circle cx="145" cy="90"  r="4"/>
      <circle cx="143" cy="108" r="4"/>
      <circle cx="130" cy="120" r="4"/>
      <circle cx="110" cy="125" r="4"/>
      <circle cx="90"  cy="120" r="4"/>
      <circle cx="77"  cy="108" r="4"/>
      <circle cx="75"  cy="90"  r="4"/>
      <circle cx="77"  cy="72"  r="4"/>
      <circle cx="90"  cy="60"  r="4"/>
    </g>
    <circle cx="110" cy="90" r="8" fill="#804010">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Left bottom gear — counter-clockwise -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 110 175" to="-360 110 175" dur="24s" repeatCount="indefinite"/>
    <circle cx="110" cy="175" r="40" fill="#0c0a04" stroke="#181008" stroke-width="1.5"/>
    <circle cx="110" cy="175" r="26" fill="#181008" opacity="0.5"/>
    <circle cx="110" cy="175" r="9"  fill="#804010">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Right top gear — clockwise -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 88" to="360 290 88" dur="30s" repeatCount="indefinite"/>
    <circle cx="290" cy="88"  r="35" fill="#0c0a04" stroke="#181008" stroke-width="1.5"/>
    <circle cx="290" cy="88"  r="22" fill="#181008" opacity="0.5"/>
    <circle cx="290" cy="88"  r="8"  fill="#804010">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Right bottom gear — counter-clockwise -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 175" to="-360 290 175" dur="24s" repeatCount="indefinite"/>
    <circle cx="290" cy="175" r="40" fill="#0c0a04" stroke="#181008" stroke-width="1.5"/>
    <circle cx="290" cy="175" r="26" fill="#181008" opacity="0.5"/>
    <circle cx="290" cy="175" r="9"  fill="#804010">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Centre shaft -->
  <line x1="200" y1="50" x2="200" y2="240" stroke="#241408" stroke-width="6"/>
  <!-- Ley coil — marching-ant flow -->
  <path d="M196,55 Q190,65 196,75 Q202,85 196,95 Q190,105 196,115 Q202,125 196,135 Q190,145 196,155 Q202,165 196,175 Q190,185 196,195 Q202,205 196,215" stroke="#e08020" stroke-width="1" fill="none" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.65;0.4" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M204,60 Q210,70 204,80 Q198,90 204,100 Q210,110 204,120 Q198,130 204,140 Q210,150 204,160 Q198,170 204,180 Q210,190 204,200" stroke="#e08020" stroke-width="1" fill="none" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.65;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </path>
  <!-- Shaft hub glow pulse -->
  <circle cx="200" cy="145" r="12" fill="#804010">
    <animate attributeName="r" values="12;14;12" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="145" r="6" fill="#c06018">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Floor grating -->
  <rect x="65" y="220" width="270" height="20" fill="#0c0a04" opacity="0.8"/>
  <g stroke="#1a1006" stroke-width="1" fill="none" opacity="0.4">
    <line x1="65"  y1="220" x2="335" y2="220"/>
    <line x1="65"  y1="228" x2="335" y2="228"/>
    <line x1="100" y1="220" x2="100" y2="240"/>
    <line x1="140" y1="220" x2="140" y2="240"/>
    <line x1="180" y1="220" x2="180" y2="240"/>
    <line x1="220" y1="220" x2="220" y2="240"/>
    <line x1="260" y1="220" x2="260" y2="240"/>
    <line x1="300" y1="220" x2="300" y2="240"/>
  </g>
  <!-- Floor glow pulse -->
  <rect x="65" y="224" width="270" height="6" fill="#804010">
    <animate attributeName="opacity" values="0.2;0.38;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Label -->
  <text x="200" y="232" font-family="monospace" font-size="9" fill="#3a1a08" text-anchor="middle" letter-spacing="3">THE CLOCKWORK VAULTS</text>
</svg>
