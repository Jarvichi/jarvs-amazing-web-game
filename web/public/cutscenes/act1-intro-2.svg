<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="filter: brightness(1.4)">
  <rect width="400" height="240" fill="#0a0a0a"/>

  <!-- Sky drift group -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -10 0; 0 0" dur="120s" repeatCount="indefinite"/>

    <!-- Stars -->
    <g fill="#ffffff">
      <circle cx="40" cy="30" r="1">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="55" r="0.8">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="20" r="1">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="35" r="1">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="80" r="0.6">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Shooting star -->
    <line x1="-50" y1="40" x2="-10" y2="60"
          stroke="#ffffff" stroke-width="1" opacity="0">
      <animate attributeName="opacity"
               values="0;1;0"
               dur="2s"
               begin="12s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 480 120"
        dur="2s"
        begin="12s"
        repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Horizon ground -->
  <rect x="0" y="185" width="400" height="55" fill="#0e0e0e"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Distant shard walls -->
  <g opacity="0.7">
    <rect x="30" y="140" width="18" height="45" fill="#111"/>
    <rect x="55" y="125" width="12" height="60" fill="#111"/>
    <rect x="320" y="135" width="20" height="50" fill="#111"/>
    <rect x="350" y="118" width="14" height="67" fill="#111"/>
  </g>

  <!-- Wanderer -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0.6 0; 0 0" dur="6s" repeatCount="indefinite"/>

    <!-- Legs -->
    <line x1="197" y1="175" x2="193" y2="185" stroke="#3a8a4a" stroke-width="2.5"/>
    <line x1="203" y1="175" x2="207" y2="185" stroke="#3a8a4a" stroke-width="2.5"/>

    <!-- Body -->
    <line x1="200" y1="155" x2="200" y2="175" stroke="#3a8a4a" stroke-width="3"/>

    <!-- Arms -->
    <line x1="200" y1="162" x2="188" y2="170" stroke="#3a8a4a" stroke-width="2.5"/>
    <line x1="200" y1="162" x2="212" y2="168" stroke="#3a8a4a" stroke-width="2.5"/>

    <!-- Head -->
    <circle cx="200" cy="149" r="6" fill="#3a8a4a"/>

    <!-- Cloak (wind) -->
    <polygon points="188,175 200,158 212,175 206,185 194,185"
             fill="none" stroke="#2a6a3a" stroke-width="1" opacity="0.6">
      <animateTransform attributeName="transform" type="skewX"
        values="0; -6; 0" dur="3.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Cards (wind + pulse) -->
    <g transform="translate(212,168) rotate(-20)">
      <animateTransform attributeName="transform" type="rotate"
        values="-20 -212 -168; -25 -212 -168; -20 -212 -168"
        dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      <rect x="-1" y="-7" width="7" height="10" rx="1" fill="#1a3a2a" stroke="#40a060" stroke-width="0.8"/>
      <rect x="3" y="-8" width="7" height="10" rx="1" fill="#1a2a3a" stroke="#4060a0" stroke-width="0.8"/>
      <rect x="7" y="-7" width="7" height="10" rx="1" fill="#2a1a1a" stroke="#a04040" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Ambient glow -->
  <radialGradient id="jarv-glow" cx="50%" cy="80%" r="30%">
    <stop offset="0%" stop-color="#2a6a3a" stop-opacity="0.1">
      <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="240" fill="url(#jarv-glow)"/>

  <!-- Label -->
  <text x="200" y="228" font-family="monospace" font-size="9"
        fill="#2a6a3a" text-anchor="middle" letter-spacing="3">
    THE WANDERER
    <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>