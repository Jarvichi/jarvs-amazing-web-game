    <stop offset="0%" stop-color="#1c2138"/>
    <stop offset="100%" stop-color="#565e80"/>
  </linearGradient>
  <rect width="400" height="200" fill="url(#c2a3o2-sky)"/>
  <rect y="176" width="400" height="64" fill="#4a4634"/>
  <!-- The Sheaf of Names, held up and glowing -->
