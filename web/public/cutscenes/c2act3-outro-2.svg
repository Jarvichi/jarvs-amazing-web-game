    <rect x="-2" y="0" width="4" height="46" rx="2" fill="#8A6F4D"/>
    <path d="M-14,-6 Q0,-30 14,-6 Q6,4 0,10 Q-6,4 -14,-6 Z" fill="#D9C27E"/>
    <path d="M-8,-4 Q0,-20 8,-4 Q4,2 0,6 Q-4,2 -8,-4 Z" fill="#E8DCA8"/>
