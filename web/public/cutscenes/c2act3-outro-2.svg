  </g>
  <!-- Glow -->
  <circle cx="200" cy="110" r="60" fill="#D9C27E" opacity="0.16"/>
  <circle cx="200" cy="110" r="30" fill="#FFE08A" opacity="0.18"/>
  <!-- Mist -->
