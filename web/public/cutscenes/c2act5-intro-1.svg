<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0a0c14"/>
  <linearGradient id="c2a5i1-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#171b28"/>
    <stop offset="100%" stop-color="#3a4160"/>
  </linearGradient>
  <rect width="400" height="176" fill="url(#c2a5i1-sky)"/>
  <!-- Archive threshold behind, dressed stone giving way to city cobbles -->
  <rect y="176" width="180" height="64" fill="#2b3149"/>
  <rect x="180" y="176" width="220" height="64" fill="#3a3626"/>
  <rect x="150" y="90" width="30" height="90" fill="#12141f"/>
  <!-- Jarv silhouette carrying the Index of the Lost, walking toward the city glow -->
  <g fill="#11141f">
    <circle cx="200" cy="150" r="10"/>
    <rect x="189" y="160" width="22" height="34" rx="4"/>
  </g>
  <rect x="184" y="166" width="10" height="8" rx="1" fill="#F2E9D8"/>
  <circle cx="189" cy="170" r="1.6" fill="#E8B94A"/>
  <!-- Distant candle-gold skyline glow -->
  <g fill="#3a4160">
    <rect x="220" y="110" width="14" height="66"/>
    <rect x="240" y="96" width="14" height="80"/>
    <rect x="262" y="118" width="14" height="58"/>
    <rect x="290" y="88" width="16" height="88"/>
    <rect x="316" y="112" width="14" height="64"/>
    <rect x="340" y="98" width="16" height="78"/>
  </g>
  <g fill="#FFB347" opacity="0.85">
    <circle cx="226" cy="122" r="1.3"/>
    <circle cx="246" cy="108" r="1.3"/>
    <circle cx="268" cy="130" r="1.3"/>
    <circle cx="298" cy="100" r="1.5"/>
    <circle cx="322" cy="124" r="1.3"/>
    <circle cx="348" cy="110" r="1.5"/>
  </g>
  <ellipse cx="290" cy="140" rx="120" ry="26" fill="#FFB347" opacity="0.1"/>
  <!-- Mist bands -->
  <ellipse cx="200" cy="180" rx="220" ry="18" fill="#ced3e6" opacity="0.3"/>
  <!-- Caption -->
  <rect y="206" width="400" height="34" fill="#080a12"/>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#C9CBDA">THE ARCHIVE ENDS. THE FLAMES BEGIN.</text>
