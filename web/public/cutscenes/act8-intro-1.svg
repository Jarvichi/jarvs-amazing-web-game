<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="filter: brightness(1.4)">
  <rect width="400" height="240" fill="#030206"/>

  <linearGradient id="deep-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#040208"/>
    <stop offset="50%" stop-color="#06030e"/>
    <stop offset="100%" stop-color="#080414"/>
  </linearGradient>
  <rect width="400" height="240" fill="url(#deep-sky)"/>

  <!-- Bioluminescent spore atmosphere — pulsing -->
  <radialGradient id="spore-atm" cx="50%" cy="60%" r="55%">
    <stop offset="0%" stop-color="#400880" stop-opacity="0.25">
      <animate attributeName="stop-opacity" values="0.25;0.45;0.25" dur="7s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#400880" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="240" fill="url(#spore-atm)"/>

  <!-- Cave ceiling — jagged, dripping stalactites -->
  <polygon points="0,0 400,0 400,50 375,38 350,55 315,35 280,52 245,30 210,48 175,28 140,50 105,33 70,52 35,34 0,48" fill="#050208"/>
  <!-- Stalactites more detailed -->
  <g fill="#060309" stroke="#0a0412" stroke-width="0.5">
    <polygon points="28,48  36,48  32,72"/>
    <polygon points="72,52  82,52  77,78"/>
    <polygon points="138,50 150,50 144,80"/>
    <polygon points="213,48 223,48 218,76"/>
    <polygon points="283,52 293,52 288,78"/>
    <polygon points="352,55 362,55 357,82"/>
  </g>
  <!-- Mycelium hanging from ceiling -->
  <g stroke="#301848" stroke-width="0.6" fill="none" opacity="0.5">
    <path d="M32,72 Q30,85 28,100 Q31,112 29,125"/>
    <path d="M77,78 Q75,92 78,108 Q76,118 74,130"/>
    <path d="M144,80 Q142,95 145,112 Q143,125 141,138"/>
    <path d="M288,78 Q290,93 287,110 Q289,124 291,140"/>
    <path d="M357,82 Q359,96 356,110 Q358,125 360,140"/>
  </g>

  <!-- Cave floor -->
  <polygon points="0,200 400,200 400,240 0,240" fill="#050208"/>
  <polygon points="0,195 400,188 400,205 0,210" fill="#07030c" stroke="#0e0618" stroke-width="1"/>
  <!-- Mycelium mat on floor -->
  <g stroke="#281240" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M0,200 Q50,195 100,200 Q150,205 200,200 Q250,195 300,200 Q350,205 400,200"/>
    <path d="M20,202 Q70,197 120,202 Q170,207 220,202"/>
    <path d="M200,200 Q240,195 280,200 Q320,205 380,200"/>
  </g>

  <!-- MUSHROOMS — large glowing clusters -->
  <!-- Left large cluster -->
  <g>
    <!-- Stems -->
    <line x1="60" y1="200" x2="58" y2="165" stroke="#1a0c28" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="200" x2="82" y2="158" stroke="#1a0c28" stroke-width="5" stroke-linecap="round"/>
    <line x1="45" y1="200" x2="42" y2="172" stroke="#1a0c28" stroke-width="3" stroke-linecap="round"/>
    <!-- Caps -->
    <ellipse cx="58" cy="163" rx="20" ry="9" fill="#1a0830" stroke="#301050" stroke-width="1"/>
    <ellipse cx="82" cy="155" rx="26" ry="11" fill="#200a38" stroke="#381260" stroke-width="1"/>
    <ellipse cx="42" cy="170" rx="16" ry="7" fill="#18082c" stroke="#280e48" stroke-width="1"/>
    <!-- Bioluminescent glow under caps — pulsing -->
    <radialGradient id="mush-l-glow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#8020e0" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8020e0" stop-opacity="0"/>
    </radialGradient>
    <ellipse cx="82" cy="155" rx="26" ry="11" fill="url(#mush-l-glow)"/>
    <ellipse cx="58" cy="163" rx="20" ry="9" fill="url(#mush-l-glow)" opacity="0.6"/>
  </g>

  <!-- Right large cluster -->
  <g>
    <line x1="330" y1="200" x2="328" y2="160" stroke="#1a0c28" stroke-width="5" stroke-linecap="round"/>
    <line x1="350" y1="200" x2="355" y2="168" stroke="#1a0c28" stroke-width="4" stroke-linecap="round"/>
    <line x1="315" y1="200" x2="310" y2="172" stroke="#1a0c28" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="328" cy="157" rx="25" ry="10" fill="#200a38" stroke="#381260" stroke-width="1"/>
    <ellipse cx="355" cy="165" rx="20" ry="8" fill="#1a0830" stroke="#301050" stroke-width="1"/>
    <ellipse cx="310" cy="169" rx="16" ry="7" fill="#18082c" stroke="#280e48" stroke-width="1"/>
    <!-- Right cluster glow — offset pulse -->
    <radialGradient id="mush-r-glow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#8020e0" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.8;0.4" dur="4s" begin="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8020e0" stop-opacity="0"/>
    </radialGradient>
    <ellipse cx="328" cy="157" rx="25" ry="10" fill="url(#mush-r-glow)"/>
  </g>

  <!-- Centre — ley line descending — pulsing -->
  <linearGradient id="ley-down" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8040e0" stop-opacity="0.1">
      <animate attributeName="stop-opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="60%" stop-color="#6030c0" stop-opacity="0.6">
      <animate attributeName="stop-opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#4020a0" stop-opacity="0.9">
      <animate attributeName="stop-opacity" values="0.9;0.5;0.9" dur="6s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <rect x="196" y="0" width="8" height="200" fill="url(#ley-down)"/>
  <rect x="198" y="0" width="4" height="200" fill="#c080ff">
    <animate attributeName="opacity" values="0.3;0.6;0.1;0.4;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <!-- Ley line vanishing into floor crack -->
  <g stroke="#8040e0" stroke-width="1" fill="none" opacity="0.5">
    <path d="M196,200 Q198,205 200,210"/>
    <path d="M204,200 Q202,205 200,210"/>
  </g>

  <!-- Floating spores — drifting upward -->
  <g fill="#a040f0">
    <circle cx="120" cy="120" r="1.5" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -40; -2 -80" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="95"  r="1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -30; 3 -60" dur="10s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="10s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="110" r="1.5" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -35; -2 -70" dur="11s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="11s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="85"  r="1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -25; 2 -50" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="140" r="1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -3 -45; -3 -90" dur="14s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="14s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="130" r="1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -40; 3 -80" dur="13s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="13s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="75"  r="0.8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -1 -20; -1 -40" dur="8s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="8s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="105" r="1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -30; 2 -60" dur="10s" begin="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="10s" begin="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90"  cy="100" r="0.8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -25; -2 -50" dur="11s" begin="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="11s" begin="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#40c0a0">
    <circle cx="150" cy="60"  r="1" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -20; 2 -40" dur="9s" begin="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.35;0" dur="9s" begin="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="70"  r="1" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -18; -2 -36" dur="8s" begin="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.35;0" dur="8s" begin="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="90"  r="0.8" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -22; 3 -44" dur="10s" begin="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.35;0" dur="10s" begin="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50"  cy="80"  r="0.8" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -15; -2 -30" dur="7s" begin="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.35;0" dur="7s" begin="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Label -->
  <text x="200" y="232" font-family="monospace" font-size="9" fill="#2a1040" text-anchor="middle" letter-spacing="3">THE FUNGAL DEEP
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
