<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0a0c14"/>
  <linearGradient id="c2a3i2-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a4160"/>
    <stop offset="70%" stop-color="#6b7294"/>
    <stop offset="100%" stop-color="#8e94b4"/>
  </linearGradient>
  <rect width="400" height="180" fill="url(#c2a3i2-sky)"/>
  <!-- Fields of pale memory-wheat, rows receding -->
  <rect y="150" width="400" height="90" fill="#4a5170"/>
  <g stroke="#D9C27E" stroke-width="1.2" opacity="0.75">
    <line x1="10" y1="240" x2="50" y2="160"/>
    <line x1="60" y1="240" x2="90" y2="160"/>
    <line x1="110" y1="240" x2="132" y2="160"/>
    <line x1="170" y1="240" x2="182" y2="160"/>
    <line x1="230" y1="240" x2="232" y2="160"/>
    <line x1="290" y1="240" x2="282" y2="160"/>
    <line x1="345" y1="240" x2="328" y2="160"/>
    <line x1="390" y1="240" x2="368" y2="160"/>
  </g>
  <g fill="#E8DCA8" opacity="0.7">
    <ellipse cx="50" cy="158" rx="6" ry="3"/>
    <ellipse cx="132" cy="158" rx="6" ry="3"/>
    <ellipse cx="232" cy="158" rx="6" ry="3"/>
    <ellipse cx="328" cy="158" rx="6" ry="3"/>
  </g>
  <!-- Faint memory-gold glow drifting over the grain -->
  <ellipse cx="200" cy="150" rx="180" ry="14" fill="#FFB347" opacity="0.12"/>
  <!-- Mist bands -->
  <ellipse cx="200" cy="160" rx="220" ry="18" fill="#ced3e6" opacity="0.35"/>
  <!-- Caption -->
  <rect y="206" width="400" height="34" fill="#080a12"/>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#C9CBDA">GRAIN THAT REMEMBERS BEING PLANTED</text>
</svg>
