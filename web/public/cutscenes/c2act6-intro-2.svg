<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0a1218"/>
  <linearGradient id="c2a6i2-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#132028"/>
    <stop offset="100%" stop-color="#1c3038"/>
  </linearGradient>
  <rect width="400" height="150" fill="url(#c2a6i2-sky)"/>
  <!-- Flooded coastline, drowned towers standing in misaligned tide -->
  <rect y="150" width="400" height="90" fill="#0f2229"/>
  <g fill="#2e4550">
    <rect x="30" y="90" width="16" height="90"/>
    <rect x="70" y="60" width="18" height="120"/>
    <rect x="120" y="100" width="16" height="80"/>
    <rect x="250" y="70" width="18" height="110"/>
    <rect x="300" y="95" width="16" height="85"/>
    <rect x="350" y="55" width="18" height="125"/>
  </g>
  <!-- Waterline overlay -->
  <rect y="150" width="400" height="6" fill="#6FD3D9" opacity="0.4"/>
  <ellipse cx="200" cy="160" rx="220" ry="14" fill="#B8E3E6" opacity="0.2"/>
  <ellipse cx="120" cy="200" rx="90" ry="10" fill="#6FD3D9" opacity="0.15"/>
  <ellipse cx="290" cy="205" rx="100" ry="10" fill="#6FD3D9" opacity="0.15"/>
  <!-- Caption -->
  <rect y="206" width="400" height="34" fill="#080a12"/>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#C9CBDA">A SHORELINE TWENTY MILES OUT OF PLACE.</text>
</svg>
