  <!-- Banner text strip -->
  <rect y="196" width="400" height="44" fill="#080a12"/>
  <text x="200" y="223" text-anchor="middle" font-family="monospace" font-size="13" fill="#C9CBDA">THE FRACTURE IS SEALED · THE DOMINION IS WHOLE</text>
</svg>
