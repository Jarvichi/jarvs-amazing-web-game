<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="filter: brightness(1.4)">
  <rect width="400" height="240" fill="#030206"/>

  <linearGradient id="under-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#040208"/>
    <stop offset="100%" stop-color="#0a0418"/>
  </linearGradient>
  <rect width="400" height="240" fill="url(#under-sky)"/>

  <!-- Enclosed warmth — soft purple ambient glow, pulsing -->
  <radialGradient id="warm-cave" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#380870" stop-opacity="0.3">
      <animate attributeName="stop-opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#380870" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="240" fill="url(#warm-cave)"/>

  <!-- Cave walls — closing in -->
  <polygon points="0,0 0,240 70,240 55,200 50,160 60,120 45,80 55,40 40,0" fill="#060309"/>
  <polygon points="400,0 400,240 330,240 345,200 350,160 340,120 355,80 345,40 360,0" fill="#060309"/>
  <!-- Wall texture — mycelium veins -->
  <g stroke="#1a0830" stroke-width="0.8" fill="none" opacity="0.5">
    <path d="M50,40 Q40,60 45,80 Q55,100 48,120 Q40,140 50,160"/>
    <path d="M55,60 Q48,80 52,100"/>
    <path d="M350,40 Q360,60 355,80 Q345,100 352,120 Q360,140 350,160"/>
    <path d="M345,60 Q352,80 348,100"/>
  </g>
  <!-- Bioluminescent patches on wall — staggered pulse -->
  <ellipse cx="40"  cy="80"  rx="12" ry="6" fill="#6020a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="52"  cy="140" rx="10" ry="5" fill="#6020a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="360" cy="90"  rx="12" ry="6" fill="#6020a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="348" cy="145" rx="10" ry="5" fill="#6020a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" begin="2.3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- TUNNEL PERSPECTIVE — corridor stretching ahead -->
  <!-- Tunnel rings — staggered slow pulse, outer to inner -->
  <g stroke="#180630" stroke-width="1" fill="none">
    <ellipse cx="200" cy="120" rx="130" ry="90" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="120" rx="105" ry="72" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" begin="0.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="120" rx="80"  ry="55" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" begin="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="120" rx="55"  ry="38" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="120" rx="32"  ry="22" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" begin="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="120" rx="14"  ry="10" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" begin="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- Tunnel depth glow — something glowing ahead, pulsing -->
  <radialGradient id="depth-glow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#8030d0" stop-opacity="0.5">
      <animate attributeName="stop-opacity" values="0.5;0.8;0.5" dur="5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="60%" stop-color="#5020a0" stop-opacity="0.15">
      <animate attributeName="stop-opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#5020a0" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="200" cy="120" rx="130" ry="90" fill="url(#depth-glow)"/>

  <!-- Mycelium covering tunnel walls -->
  <g stroke="#280c48" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M70,120 Q90,110 100,90 Q110,70 130,65"/>
    <path d="M70,120 Q85,130 95,150 Q105,165 125,170"/>
    <path d="M330,120 Q310,110 300,90 Q290,70 270,65"/>
    <path d="M330,120 Q315,130 305,150 Q295,165 275,170"/>
    <path d="M140,30 Q145,50 142,70"/>
    <path d="M200,30 Q200,55 200,75"/>
    <path d="M260,30 Q255,50 258,70"/>
  </g>

  <!-- Mushroom silhouettes in mid-ground -->
  <g fill="#100828" opacity="0.7">
    <ellipse cx="95"  cy="175" rx="18" ry="7"/>
    <line x1="95"  y1="182" x2="95"  y2="200" stroke="#100828" stroke-width="4"/>
    <ellipse cx="115" cy="180" rx="14" ry="6"/>
    <line x1="115" y1="186" x2="115" y2="200" stroke="#100828" stroke-width="3"/>
    <ellipse cx="305" cy="175" rx="18" ry="7"/>
    <line x1="305" y1="182" x2="305" y2="200" stroke="#100828" stroke-width="4"/>
    <ellipse cx="285" cy="180" rx="14" ry="6"/>
    <line x1="285" y1="186" x2="285" y2="200" stroke="#100828" stroke-width="3"/>
  </g>
  <!-- Glow under mushroom caps — slow pulse -->
  <ellipse cx="95"  cy="178" rx="18" ry="5" fill="#6018a0" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="305" cy="178" rx="18" ry="5" fill="#6018a0" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating spores — drifting upward and fading -->
  <g fill="#9030e0">
    <circle cx="90"  cy="60"  r="1.2" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -40; -2 -80" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="45"  r="1"   opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -30; 3 -60" dur="10s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="10s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="35"  r="1.2" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -1 -35; -1 -70" dur="11s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="11s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="40"  r="1"   opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -25; 2 -50" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="50"  r="1.2" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -35; -2 -70" dur="13s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="13s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="38"  r="1"   opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -22; 3 -44" dur="10s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="10s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="90"  r="0.8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -30; -2 -60" dur="11s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="11s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="88"  r="0.8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -28; 2 -56" dur="12s" begin="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="12s" begin="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80"  r="1"   opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -3 -40; -3 -80" dur="14s" begin="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="14s" begin="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="75"  r="1"   opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -38; 3 -76" dur="13s" begin="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.5;0" dur="13s" begin="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#30c0a0">
    <circle cx="160" cy="55"  r="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -20; 2 -40" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="60"  r="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -18; -2 -36" dur="8s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="8s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80"  cy="110" r="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -25; -2 -50" dur="10s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="10s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="108" r="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -22; 2 -44" dur="11s" begin="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="11s" begin="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Something watching — two faint eyes in the deep, slow eerie pulse -->
  <circle cx="194" cy="120" r="2.5" fill="#c050ff" opacity="0.4">
    <animate attributeName="r"       values="2.5;3.5;2.5;3.5;2.5" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.1;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="206" cy="120" r="2.5" fill="#c050ff" opacity="0.4">
    <animate attributeName="r"       values="2.5;3.5;2.5;3.5;2.5" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.1;0.8;0.4" dur="5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="200" y="232" font-family="monospace" font-size="9" fill="#2a1040" text-anchor="middle" letter-spacing="3">GOING UNDER
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
