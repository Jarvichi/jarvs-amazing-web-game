<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="filter: brightness(1.4)">
  <rect width="400" height="240" fill="#030802"/>

  <linearGradient id="canopy-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#040a02"/>
    <stop offset="50%" stop-color="#060e04"/>
    <stop offset="100%" stop-color="#081206"/>
  </linearGradient>
  <rect width="400" height="240" fill="url(#canopy-sky)"/>

  <!-- Forest bioluminescent ambient — slow breathe -->
  <radialGradient id="canopy-glow" cx="50%" cy="30%" r="55%">
    <stop offset="0%" stop-color="#102808" stop-opacity="0.4">
      <animate attributeName="stop-opacity" values="0.4;0.65;0.4" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#102808" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="240" fill="url(#canopy-glow)"/>

  <!-- HIGH CANOPY -->
  <g fill="#050c02" stroke="#081202" stroke-width="0.5">
    <polygon points="0,0 400,0 400,70 360,60 320,75 280,55 240,72 200,48 160,70 120,52 80,68 40,50 0,65"/>
  </g>
  <g fill="#060e03" opacity="0.8">
    <polygon points="0,65 0,0 35,0 30,50"/>
    <polygon points="400,65 400,0 365,0 368,52"/>
    <ellipse cx="80"  cy="40" rx="55" ry="22"/>
    <ellipse cx="200" cy="32" rx="65" ry="25"/>
    <ellipse cx="320" cy="38" rx="55" ry="22"/>
  </g>
  <!-- Ley lines threading through canopy roots — flowing -->
  <g stroke="#20a040" stroke-width="1.2" fill="none" opacity="0.5" stroke-dasharray="12,6">
    <path d="M0,68 Q50,60 100,68 Q150,76 200,65 Q250,54 300,65 Q350,76 400,68">
      <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,78 Q80,70 160,80 Q240,90 320,78 Q360,72 400,78">
      <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- TREE TRUNKS -->
  <!-- Left trunk -->
  <rect x="30" y="65" width="45" height="180" fill="#050c02" stroke="#0a1604" stroke-width="1"/>
  <!-- Left trunk ley seam — pulse -->
  <line x1="52" y1="65"  x2="50" y2="245" stroke="#18a030" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
  </line>
  <line x1="53" y1="65"  x2="51" y2="245" stroke="#40e060" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
  </line>
  <!-- Root buttresses left -->
  <g fill="#040a02" stroke="#081404" stroke-width="0.8">
    <polygon points="30,200 15,240 30,240"/>
    <polygon points="75,200 90,240 75,240"/>
    <polygon points="52,195 42,240 62,240"/>
  </g>

  <!-- Centre trunk — massive -->
  <rect x="172" y="48" width="56" height="197" fill="#050c02" stroke="#0a1604" stroke-width="1"/>
  <!-- Centre ley seam — brightest, pulse -->
  <line x1="199" y1="48"  x2="199" y2="245" stroke="#20c040" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="48"  x2="200" y2="245" stroke="#60ff80" stroke-width="0.8" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.2;0.6;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  <!-- Root buttresses centre -->
  <g fill="#040a02" stroke="#081404" stroke-width="0.8">
    <polygon points="172,195 155,240 172,240"/>
    <polygon points="228,195 245,240 228,240"/>
    <polygon points="200,192 185,240 215,240"/>
  </g>

  <!-- Right trunk -->
  <rect x="325" y="60" width="45" height="185" fill="#050c02" stroke="#0a1604" stroke-width="1"/>
  <line x1="347" y1="60"  x2="347" y2="245" stroke="#18a030" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" begin="1s" repeatCount="indefinite"/>
  </line>
  <g fill="#040a02" stroke="#081404" stroke-width="0.8">
    <polygon points="325,200 310,240 325,240"/>
    <polygon points="370,200 385,240 370,240"/>
  </g>

  <!-- Forest floor -->
  <rect x="0" y="210" width="400" height="30" fill="#040802"/>
  <g stroke="#0a1604" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M52,245 Q80,230 110,240 Q140,250 160,235"/>
    <path d="M200,245 Q230,228 260,238 Q290,248 320,232"/>
  </g>

  <!-- Bioluminescent moss on trunks — staggered pulse -->
  <circle cx="45"  cy="130" r="3"   fill="#20c040" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65"  cy="155" r="2.5" fill="#20c040" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="120" r="3"   fill="#20c040" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="215" cy="145" r="2.5" fill="#20c040" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="335" cy="135" r="3"   fill="#20c040" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="160" r="2"   fill="#20c040" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating spores — drifting upward -->
  <g fill="#40c060">
    <circle cx="100" cy="110" r="1.2" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -40; -2 -80" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="90"  r="1"   opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -30; 3 -60" dur="10s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="10s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="95"  r="1.2" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 -35; -2 -70" dur="11s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="11s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="112" r="1"   opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 -25; 2 -50" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="140" r="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; -3 -45; -3 -90" dur="14s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="14s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="135" r="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -40; 3 -80" dur="13s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.3;0" dur="13s" begin="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Label -->
  <text x="200" y="232" font-family="monospace" font-size="9" fill="#183010" text-anchor="middle" letter-spacing="3">THE VERDANT CANOPY
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
