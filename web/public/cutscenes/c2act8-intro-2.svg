    <rect x="159" y="126" width="22" height="44" rx="4"/>
    <circle cx="240" cy="118" r="10"/>
    <rect x="230" y="128" width="20" height="42" rx="4"/>
    <circle cx="310" cy="115" r="11"/>
    <rect x="299" y="126" width="22" height="44" rx="4"/>
  </g>
  <g fill="#D4D4DC" opacity="0.85">
    <circle cx="100" cy="120" r="7"/>
    <circle cx="170" cy="115" r="8"/>
    <circle cx="240" cy="118" r="7"/>
    <circle cx="310" cy="115" r="8"/>
  </g>
  <ellipse cx="200" cy="185" rx="180" ry="16" fill="#7A4A6B" opacity="0.2"/>
