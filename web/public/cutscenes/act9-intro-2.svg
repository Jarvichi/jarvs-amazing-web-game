<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" style="filter: brightness(1.4)">
  <rect width="400" height="240" fill="#030810"/>

  <linearGradient id="eng-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#040c18"/>
    <stop offset="100%" stop-color="#0a1828"/>
  </linearGradient>
  <rect width="400" height="240" fill="url(#eng-sky)"/>

  <!-- Cold pale atmospheric glow — pulsing like the Engine breathes -->
  <radialGradient id="engine-atm" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#203850" stop-opacity="0.3">
      <animate attributeName="stop-opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#203850" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="240" fill="url(#engine-atm)"/>

  <!-- Ice floor -->
  <rect x="0" y="195" width="400" height="45" fill="#060e18"/>
  <line x1="0" y1="195" x2="400" y2="195" stroke="#0e2030" stroke-width="1"/>
  <!-- Ley lines through floor — pulsing orange -->
  <rect x="0" y="198" width="400" height="3" fill="#e05010" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.3;0.6;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="199" width="400" height="1" fill="#ff8030" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.2;0.5;0.3" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Shadow -->
  <ellipse cx="200" cy="205" rx="55" ry="9" fill="#030608" opacity="0.8"/>

  <!-- THE PALE ENGINE -->
  <!-- Base plinth -->
  <rect x="145" y="180" width="110" height="20" rx="2" fill="#0e1a28" stroke="#182838" stroke-width="1.5"/>
  <g fill="#182838" opacity="0.7">
    <circle cx="155" cy="190" r="2"/>
    <circle cx="245" cy="190" r="2"/>
    <circle cx="165" cy="190" r="2"/>
    <circle cx="235" cy="190" r="2"/>
    <circle cx="200" cy="190" r="2"/>
  </g>

  <!-- Main body -->
  <rect x="163" y="120" width="74" height="62" fill="#0c1824" stroke="#182838" stroke-width="1.5"/>
  <line x1="163" y1="140" x2="237" y2="140" stroke="#182838" stroke-width="1"/>
  <line x1="163" y1="158" x2="237" y2="158" stroke="#182838" stroke-width="1"/>
  <!-- Intake vents — dark frames -->
  <g fill="#080e18" stroke="#101820" stroke-width="0.5">
    <rect x="170" y="125" width="18" height="10" rx="1"/>
    <rect x="212" y="125" width="18" height="10" rx="1"/>
    <rect x="170" y="143" width="18" height="10" rx="1"/>
    <rect x="212" y="143" width="18" height="10" rx="1"/>
  </g>
  <!-- Vent glow — staggered processing flicker -->
  <rect x="170" y="125" width="18" height="10" rx="1" fill="#2060a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.2;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="212" y="125" width="18" height="10" rx="1" fill="#2060a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.2;0.6;0.3" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="170" y="143" width="18" height="10" rx="1" fill="#2060a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.2;0.6;0.3" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="212" y="143" width="18" height="10" rx="1" fill="#2060a0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.2;0.6;0.3" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Upper section -->
  <rect x="172" y="80" width="56" height="42" fill="#0e1c2c" stroke="#182838" stroke-width="1.5"/>
  <!-- Eye frames -->
  <rect x="178" y="86" width="16" height="12" rx="1" fill="#081420" stroke="#182838" stroke-width="0.8"/>
  <rect x="206" y="86" width="16" height="12" rx="1" fill="#081420" stroke="#182838" stroke-width="0.8"/>
  <!-- Eyes — scanning, offset pulse -->
  <rect x="179" y="87" width="14" height="10" rx="1" fill="#1040a0" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.3;0.9;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="207" y="87" width="14" height="10" rx="1" fill="#1040a0" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.3;0.9;0.7" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Scanning beam — active processing flicker -->
  <line x1="186" y1="92" x2="214" y2="92" stroke="#4080e0" stroke-width="0.8" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0;0.8;0;0.5" dur="2s" repeatCount="indefinite"/>
  </line>
  <!-- Lower face data grid -->
  <g stroke="#182838" stroke-width="0.6" fill="none" opacity="0.5">
    <line x1="178" y1="102" x2="222" y2="102"/>
    <line x1="178" y1="107" x2="222" y2="107"/>
    <line x1="186" y1="100" x2="186" y2="110"/>
    <line x1="194" y1="100" x2="194" y2="110"/>
    <line x1="202" y1="100" x2="202" y2="110"/>
    <line x1="210" y1="100" x2="210" y2="110"/>
    <line x1="218" y1="100" x2="218" y2="110"/>
  </g>

  <!-- Crown antenna array -->
  <g stroke="#182030" stroke-width="1">
    <line x1="185" y1="80" x2="182" y2="55" stroke="#182030" stroke-width="2"/>
    <line x1="195" y1="80" x2="193" y2="48" stroke="#182030" stroke-width="2.5"/>
    <line x1="205" y1="80" x2="207" y2="48" stroke="#182030" stroke-width="2.5"/>
    <line x1="215" y1="80" x2="218" y2="55" stroke="#182030" stroke-width="2"/>
  </g>
  <!-- Antenna tips — staggered transmit pulse -->
  <circle cx="182" cy="54" r="2.5" fill="#3060c0" opacity="0.6">
    <animate attributeName="r"       values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6"   dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="193" cy="47" r="3" fill="#4070d0" opacity="0.7">
    <animate attributeName="r"       values="3;4;3"       dur="4s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7"   dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="207" cy="47" r="3" fill="#4070d0" opacity="0.7">
    <animate attributeName="r"       values="3;4;3"       dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7"   dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="218" cy="54" r="2.5" fill="#3060c0" opacity="0.6">
    <animate attributeName="r"       values="2.5;3.5;2.5" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6"   dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Side arms -->
  <line x1="163" y1="135" x2="130" y2="145" stroke="#0e1824" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="145" x2="108" y2="160" stroke="#0e1824" stroke-width="4" stroke-linecap="round"/>
  <rect x="96" y="152" width="20" height="14" rx="2" fill="#0c1620" stroke="#182030" stroke-width="0.8"/>
  <line x1="237" y1="135" x2="270" y2="145" stroke="#0e1824" stroke-width="6" stroke-linecap="round"/>
  <line x1="270" y1="145" x2="292" y2="160" stroke="#0e1824" stroke-width="4" stroke-linecap="round"/>
  <rect x="284" y="152" width="20" height="14" rx="2" fill="#0c1620" stroke="#182030" stroke-width="0.8"/>

  <!-- Ley line feed — flowing into the Engine -->
  <path d="M0,198 Q80,192 145,188 Q165,185 200,182" stroke="#e05010" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M400,198 Q320,192 255,188 Q235,185 200,182" stroke="#e05010" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Ley energy entering base -->
  <rect x="190" y="182" width="20" height="2" fill="#ff7020" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.3;0.8;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Ice crystals around base -->
  <g fill="#0a1828" stroke="#142238" stroke-width="0.8" opacity="0.7">
    <polygon points="148,193 152,180 156,193"/>
    <polygon points="244,193 248,180 252,193"/>
    <polygon points="138,200 142,188 146,200"/>
    <polygon points="254,200 258,188 262,200"/>
  </g>

  <!-- Stars — twinkling -->
  <circle cx="40"  cy="22" r="1"   fill="#a0c0e0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.8;0.1;0.6;0.35" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="15" r="1.2" fill="#a0c0e0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.9;0.2;0.7;0.35" dur="8s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="18" r="1"   fill="#a0c0e0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.7;0.1;0.8;0.35" dur="5s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="25" r="1.2" fill="#a0c0e0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;1;0.2;0.6;0.35" dur="7s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="200" y="232" font-family="monospace" font-size="9" fill="#1a3050" text-anchor="middle" letter-spacing="3">THE PALE ENGINE
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
