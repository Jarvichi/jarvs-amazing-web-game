<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0a0c14"/>
  <linearGradient id="c2a3o3-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#242b48"/>
    <stop offset="100%" stop-color="#4a5170"/>
  </linearGradient>
  <rect width="400" height="200" fill="url(#c2a3o3-sky)"/>
  <!-- Fields giving way to the Archive's shelving silhouette -->
  <rect y="176" width="400" height="64" fill="#3a3f52"/>
  <g stroke="#D9C27E" stroke-width="1" opacity="0.4">
    <line x1="20" y1="240" x2="50" y2="180"/>
    <line x1="70" y1="240" x2="90" y2="180"/>
    <line x1="120" y1="240" x2="130" y2="180"/>
  </g>
  <!-- Towering shelving hall on the horizon -->
  <g fill="#2b3149">
    <rect x="180" y="70" width="12" height="106"/>
    <rect x="200" y="60" width="12" height="116"/>
    <rect x="220" y="66" width="12" height="110"/>
    <rect x="240" y="54" width="12" height="122"/>
    <rect x="260" y="68" width="12" height="108"/>
    <rect x="280" y="76" width="12" height="100"/>
  </g>
  <g fill="#E8B94A" opacity="0.7">
    <rect x="184" y="86" width="4" height="4"/>
    <rect x="204" y="76" width="4" height="4"/>
    <rect x="224" y="94" width="4" height="4"/>
    <rect x="244" y="70" width="4" height="4"/>
    <rect x="264" y="98" width="4" height="4"/>
    <rect x="284" y="90" width="4" height="4"/>
  </g>
  <!-- Mist bands -->
  <ellipse cx="200" cy="180" rx="220" ry="18" fill="#ced3e6" opacity="0.35"/>
  <!-- Caption -->
  <rect y="206" width="400" height="34" fill="#080a12"/>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#C9CBDA">SOMEWHERE AHEAD, EVERY ERASED NAME IS SHELVED</text>
</svg>
