  <ellipse cx="21" cy="27" rx="1" ry="0.6" fill="#aabb77" opacity="0.35" transform="rotate(15,21,27)"/>
  <ellipse cx="23" cy="27" rx="1" ry="0.6" fill="#aabb77" opacity="0.35" transform="rotate(15,23,27)"/>
