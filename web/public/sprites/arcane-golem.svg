<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Crystal head -->
  <rect x="9" y="1" width="14" height="12" rx="2" fill="#5588bb"/>
  <rect x="9" y="1" width="14" height="5" rx="2" fill="#88bbdd"/>
  <!-- Crystal cracks -->
  <line x1="13" y1="2" x2="14" y2="7" stroke="#3366aa" stroke-width="0.8"/>
  <line x1="19" y1="3" x2="18" y2="8" stroke="#3366aa" stroke-width="0.8"/>
  <!-- Glowing arcane eyes -->
  <rect x="11" y="5" width="4" height="3" rx="1" fill="#00ccff"/>
  <rect x="17" y="5" width="4" height="3" rx="1" fill="#00ccff"/>
  <rect x="12" y="5.5" width="2.5" height="2" rx="0.5" fill="#aaeeff"/>
  <rect x="18" y="5.5" width="2.5" height="2" rx="0.5" fill="#aaeeff"/>
  <!-- Crystal torso -->
  <rect x="7" y="13" width="18" height="12" rx="2" fill="#5588bb"/>
  <!-- Arcane rune on chest -->
  <text x="16" y="22" text-anchor="middle" font-size="7" fill="#00ccff" font-family="monospace">⬡</text>
  <!-- Arms -->
  <rect x="0" y="13" width="7" height="11" rx="2" fill="#5588bb"/>
  <rect x="25" y="13" width="7" height="11" rx="2" fill="#5588bb"/>
  <!-- Fists -->
  <rect x="0" y="22" width="8" height="6" rx="2" fill="#3366aa"/>
  <rect x="24" y="22" width="8" height="6" rx="2" fill="#3366aa"/>
  <!-- Legs -->
  <rect x="9" y="25" width="6" height="7" rx="1" fill="#3366aa"/>
  <rect x="17" y="25" width="6" height="7" rx="1" fill="#3366aa"/>
</svg>
