<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Kragg: iron-grey heavy armour, red visor, massive -->
  <!-- Body (wide) -->
  <rect x="8" y="13" width="16" height="12" rx="1" fill="#6d7f8c"/>
  <!-- Pauldrons (oversized) -->
  <rect x="4" y="12" width="6" height="7" rx="1" fill="#4a5a64"/>
  <rect x="22" y="12" width="6" height="7" rx="1" fill="#4a5a64"/>
  <!-- Helm -->
  <rect x="10" y="5" width="12" height="9" rx="2" fill="#4a5a64"/>
  <!-- Visor -->
  <rect x="11" y="9" width="10" height="3" rx="1" fill="#1a1a1a"/>
  <rect x="12" y="9" width="8" height="2" fill="#cc2200"/>
  <!-- Chest plate -->
  <rect x="10" y="15" width="12" height="6" rx="1" fill="#5a6b77"/>
  <!-- Belt -->
  <rect x="8" y="22" width="16" height="2" fill="#3a4a54"/>
  <!-- Legs -->
  <rect x="9" y="25" width="5" height="5" rx="1" fill="#5a6b77"/>
  <rect x="18" y="25" width="5" height="5" rx="1" fill="#5a6b77"/>
  <!-- Arms -->
  <rect x="4" y="19" width="4" height="8" rx="1" fill="#6d7f8c"/>
  <rect x="24" y="19" width="4" height="8" rx="1" fill="#6d7f8c"/>
  <!-- Sword -->
  <rect x="28" y="10" width="3" height="18" rx="1" fill="#c0cdd4"/>
  <rect x="26" y="18" width="7" height="2" rx="1" fill="#8a9ba8"/>
</svg>