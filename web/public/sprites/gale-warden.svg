<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wind-swept hood -->
  <path d="M11,8 Q16,2 21,8" fill="#5B9BD5"/>
  <path d="M21,8 Q26,6 25,10" fill="#87CEEB" opacity="0.7"/>
  <!-- Head -->
  <ellipse cx="16" cy="10" rx="5" ry="5" fill="#d4a870"/>
  <circle cx="14" cy="9.5" r="0.8" fill="#333"/>
  <circle cx="18" cy="9.5" r="0.8" fill="#333"/>
  <!-- Wind-coloured robes -->
  <path d="M10,15 L10,22 L22,22 L22,15 Q16,18 10,15 Z" fill="#5B9BD5"/>
  <!-- Wind swirl pattern -->
  <path d="M12,17 Q14,15 16,17 Q18,19 20,17" stroke="#87CEEB" stroke-width="0.8" fill="none"/>
  <!-- Belt -->
  <rect x="10" y="20" width="12" height="2" fill="#2A5A8C"/>
  <!-- Wind staff -->
  <line x1="7" y1="4" x2="7" y2="28" stroke="#B0C4DE" stroke-width="2"/>
  <!-- Swirling wind at staff top -->
  <path d="M5,4 Q7,1 9,4 Q10,6 7,7 Q4,6 5,4" fill="#87CEEB" opacity="0.9"/>
  <circle cx="7" cy="4" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Arm holding staff -->
  <line x1="10" y1="17" x2="7" y2="16" stroke="#5B9BD5" stroke-width="3"/>
  <!-- Wind trail from cloak -->
  <path d="M22,16 Q26,14 27,18" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M22,19 Q25,18 26,21" stroke="#87CEEB" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Legs -->
  <rect x="11" y="22" width="5" height="8" rx="1" fill="#2A5A8C"/>
  <rect x="17" y="22" width="5" height="8" rx="1" fill="#2A5A8C"/>
  <rect x="10" y="28" width="7" height="3" rx="1" fill="#1A3A5C"/>
  <rect x="16" y="28" width="7" height="3" rx="1" fill="#1A3A5C"/>
</svg>
