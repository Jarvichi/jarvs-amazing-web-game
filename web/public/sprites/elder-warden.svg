<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Antler crown -->
  <path d="M13,7 L11,3 L13,5 L12,1 L15,5" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M19,7 L21,3 L19,5 L20,1 L17,5" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Head — aged, wise -->
  <ellipse cx="16" cy="9" rx="5.5" ry="5.5" fill="#b8845a"/>
  <!-- White beard -->
  <path d="M12,12 Q13,16 16,17 Q19,16 20,12" fill="#E8E8E0"/>
  <!-- Eyes — glowing green (nature magic) -->
  <circle cx="14" cy="9" r="1.2" fill="#228B22"/>
  <circle cx="18" cy="9" r="1.2" fill="#228B22"/>
  <circle cx="14" cy="9" r="0.6" fill="#90EE90"/>
  <circle cx="18" cy="9" r="0.6" fill="#90EE90"/>
  <!-- Robes — deep forest green -->
  <path d="M10,14 Q9,22 10,30 L22,30 Q23,22 22,14 Q16,17 10,14 Z" fill="#1E5A1E"/>
  <!-- Robe trim -->
  <path d="M10,14 Q16,11 22,14" stroke="#8B5A2B" stroke-width="1"/>
  <path d="M10,22 Q16,20 22,22" stroke="#8B5A2B" stroke-width="0.8" fill="none"/>
  <!-- Belt with nature emblem -->
  <rect x="10" y="20" width="12" height="2" fill="#5C3A10"/>
  <circle cx="16" cy="21" r="1.5" fill="#228B22"/>
  <path d="M16,19.5 Q15,21 16,22.5 Q17,21 16,19.5" fill="#90EE90"/>
  <!-- Staff left hand -->
  <line x1="8" y1="6" x2="8" y2="30" stroke="#8B5A2B" stroke-width="2"/>
  <circle cx="8" cy="6" r="2" fill="#228B22"/>
  <circle cx="8" cy="6" r="1" fill="#90EE90"/>
  <!-- Right arm holding staff -->
  <line x1="10" y1="17" x2="8" y2="17" stroke="#1E5A1E" stroke-width="3"/>
</svg>
