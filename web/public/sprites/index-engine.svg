<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ground -->
  <ellipse cx="16" cy="29.5" rx="10" ry="2" fill="#7E8299" opacity="0.5"/>
  <!-- Standing bookwheel, a rotating reading device, not a cabinet -->
  <circle cx="16" cy="17" r="11" fill="none" stroke="#454E6B" stroke-width="1.6"/>
  <line x1="16" y1="6" x2="16" y2="28" stroke="#7E8299" stroke-width="1"/>
  <line x1="5" y1="17" x2="27" y2="17" stroke="#7E8299" stroke-width="1"/>
  <line x1="8.8" y1="9.2" x2="23.2" y2="24.8" stroke="#7E8299" stroke-width="1"/>
  <line x1="23.2" y1="9.2" x2="8.8" y2="24.8" stroke="#7E8299" stroke-width="1"/>
  <!-- Book lecterns radiating from the wheel's rim -->
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#F2E9D8" transform="rotate(0 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#F2E9D8" transform="rotate(90 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#E3D9CF" transform="rotate(180 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#F2E9D8" transform="rotate(270 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#E3D9CF" transform="rotate(45 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#F2E9D8" transform="rotate(135 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#E3D9CF" transform="rotate(225 16 17)"/>
  <rect x="14" y="4.4" width="4" height="3" rx="0.5" fill="#F2E9D8" transform="rotate(315 16 17)"/>
  <!-- Hub -->
  <circle cx="16" cy="17" r="2.6" fill="#E8B94A"/>
  <circle cx="16" cy="17" r="1.2" fill="#FFE08A"/>
  <!-- Stand -->
  <rect x="14.8" y="27" width="2.4" height="2.5" fill="#3A3F55"/>
  <path d="M11,29.5 L21,29.5 L19.5,27 L12.5,27 Z" fill="#454E6B"/>
  <!-- Glow -->
  <circle cx="16" cy="17" r="7" fill="#E8B94A" opacity="0.1"/>
</svg>
