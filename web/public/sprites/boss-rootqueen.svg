<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Root Queen: deep purple robes, mushroom crown, spore staff -->
  <!-- Robes -->
  <rect x="9" y="13" width="14" height="15" rx="2" fill="#4a2a6b"/>
  <!-- Shoulder fungi -->
  <rect x="6" y="13" width="5" height="5" rx="2" fill="#7a3a9b"/>
  <rect x="21" y="13" width="5" height="5" rx="2" fill="#7a3a9b"/>
  <!-- Head -->
  <rect x="11" y="6" width="10" height="8" rx="2" fill="#3a1a5c"/>
  <!-- Mushroom crown -->
  <rect x="9" y="3" width="14" height="5" rx="3" fill="#8b1a8b"/>
  <rect x="11" y="5" width="10" height="3" rx="1" fill="#cc33cc"/>
  <!-- Spore eyes -->
  <rect x="13" y="9" width="2" height="2" fill="#dd88ff"/>
  <rect x="17" y="9" width="2" height="2" fill="#dd88ff"/>
  <!-- Spore staff -->
  <rect x="25" y="11" width="2" height="17" rx="1" fill="#5a3a7a"/>
  <rect x="22" y="9" width="8" height="5" rx="3" fill="#8b1a8b"/>
  <rect x="24" y="10" width="4" height="3" rx="2" fill="#cc33cc"/>
</svg>