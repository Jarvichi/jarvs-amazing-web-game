<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wall-sconce bracket the archer sights from -->
  <rect x="1.5" y="8" width="3" height="17" rx="0.8" fill="#454E6B"/>
  <rect x="2.2" y="5" width="1.6" height="3.4" rx="0.6" fill="#F2E9D8"/>
  <circle cx="3" cy="4.6" r="1.2" fill="#FFE08A"/>
  <!-- Crouched body -->
  <path d="M9,15 Q13,12 18,14 L19,22 L9,22 Z" fill="#A6A9C0"/>
  <rect x="9.5" y="18" width="9" height="1.2" fill="#5E6A8C"/>
  <!-- Pointed hood, head forward -->
  <circle cx="15" cy="10.5" r="3.6" fill="#E3D9CF"/>
  <path d="M10.6,11 L14,3.5 L19.6,10 L19,11 Q15,8 11.2,12 Z" fill="#5E6A8C"/>
  <circle cx="17.2" cy="10.8" r="0.7" fill="#2B2F3E"/>
  <!-- Drawn bow, held out right -->
  <rect x="17" y="14" width="8" height="2.2" rx="1" fill="#A6A9C0"/>
  <path d="M26,8 Q31.5,15 26,22" stroke="#454E6B" stroke-width="1.6" fill="none"/>
  <path d="M26,8 L19.6,15 L26,22" stroke="#C9CBDA" stroke-width="0.7" fill="none"/>
  <rect x="19.6" y="14.6" width="8" height="0.8" fill="#E8B94A"/>
  <path d="M27.6,15 L30,15 L27.6,13.8 Z" fill="#F2E9D8"/>
  <!-- Wax-stick quiver at hip -->
  <rect x="7.5" y="15" width="3" height="7" rx="0.8" fill="#2B2F3E"/>
  <rect x="8.3" y="13" width="1.4" height="2.4" rx="0.5" fill="#F2E9D8"/>
  <rect x="11" y="22" width="3.6" height="4" rx="1" fill="#454E6B"/>
  <rect x="11.6" y="25.4" width="6.6" height="3" rx="1" fill="#454E6B"/>
  <rect x="15.5" y="22" width="3.6" height="8" rx="1" fill="#454E6B"/>
  <rect x="14.6" y="28" width="5.6" height="3" rx="1" fill="#3A3F55"/>
  <rect x="9.6" y="27.6" width="5.6" height="2.8" rx="1" fill="#3A3F55"/>
</svg>
