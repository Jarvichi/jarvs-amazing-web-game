<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Open-faced warden's sallet, lantern-crested -->
  <circle cx="16" cy="10" r="5" fill="#9FA3BC"/>
  <path d="M11.5,10 Q16,4 20.5,10 L20.5,11.5 L11.5,11.5 Z" fill="#7E8299"/>
  <rect x="15.2" y="3" width="1.6" height="2.6" rx="0.5" fill="#5E6A8C"/>
  <path d="M14.8,2.4 L17.2,2.4 L16.6,4.4 L15.4,4.4 Z" fill="#FFB347" opacity="0.85"/>
  <circle cx="14.2" cy="10.5" r="0.6" fill="#3A3F55"/>
  <circle cx="17.8" cy="10.5" r="0.6" fill="#3A3F55"/>
  <!-- Lean plate body, road-worn -->
  <path d="M11,14.5 L11,24.5 L21,24.5 L21,14.5 Q16,16.7 11,14.5 Z" fill="#9FA3BC"/>
  <rect x="11" y="17.5" width="10" height="1.1" fill="#7E8299"/>
  <circle cx="16" cy="19.5" r="1.4" fill="#FFB347" opacity="0.85"/>
  <!-- Ledger satchel slung on the back, no shield -->
  <path d="M6,15 L10,16 L9,23 L5,22 Z" fill="#8A6F4D"/>
  <rect x="6.2" y="16.5" width="2.4" height="0.5" fill="#C9CBDA"/>
  <rect x="6.2" y="18.5" width="2.4" height="0.5" fill="#C9CBDA"/>
  <!-- Poleaxe, held upright instead of a shield+sword pair -->
  <rect x="23.2" y="5" width="1.6" height="24" rx="0.8" fill="#8A6F4D"/>
  <path d="M24.8,5 L29,7 L27.5,10.5 L24.8,9.5 Z" fill="#C9CBDA"/>
  <path d="M24.8,9.5 L22,10.5 L22.8,12 L24.8,11.4 Z" fill="#7E8299"/>
  <!-- Legs stride A: left forward and down, right lifted -->
  <rect x="10.5" y="25" width="3.6" height="6" rx="1" fill="#454E6B"/>
  <rect x="18" y="25" width="3.6" height="4.8" rx="1" fill="#454E6B"/>
  <rect x="9.5" y="29.5" width="5.6" height="2.3" rx="1" fill="#3A3F55"/>
  <rect x="18" y="28.3" width="5.6" height="2.3" rx="1" fill="#3A3F55"/>
</svg>
