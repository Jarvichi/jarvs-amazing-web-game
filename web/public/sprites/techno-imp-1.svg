<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Walk frame 1: small mechanical flying imp -->
  <!-- Mechanical wings frame A -->
  <ellipse cx="10" cy="14" rx="5" ry="2.5" fill="#4488cc" opacity="0.8" transform="rotate(15,10,14)"/>
  <ellipse cx="22" cy="14" rx="5" ry="2.5" fill="#4488cc" opacity="0.8" transform="rotate(-15,22,14)"/>
  <!-- Body -->
  <ellipse cx="16" cy="18" rx="4" ry="5" fill="#2244aa"/>
  <!-- Metal panel lines -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#5588dd" stroke-width="0.8"/>
  <line x1="14" y1="19" x2="18" y2="19" stroke="#5588dd" stroke-width="0.8"/>
  <!-- Head — mechanical with antennae -->
  <circle cx="16" cy="11" r="4" fill="#3366bb"/>
  <!-- Antennae -->
  <line x1="14" y1="8" x2="12" y2="5" stroke="#88aadd" stroke-width="1.2"/>
  <circle cx="12" cy="4" r="1" fill="#ff4400"/>
  <line x1="18" y1="8" x2="20" y2="5" stroke="#88aadd" stroke-width="1.2"/>
  <circle cx="20" cy="4" r="1" fill="#ff4400"/>
  <!-- Visor eyes -->
  <rect x="12.5" y="10" width="7" height="2.5" rx="1" fill="#00ffcc"/>
  <!-- Tiny legs hanging -->
  <line x1="14" y1="23" x2="12" y2="27" stroke="#2244aa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="18" y1="23" x2="20" y2="27" stroke="#2244aa" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Energy core glow -->
  <circle cx="16" cy="18" r="2" fill="#4488ff" opacity="0.5"/>
</svg>
