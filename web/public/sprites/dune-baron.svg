<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wrapped turban -->
  <ellipse cx="16" cy="8" rx="6" ry="5" fill="#d4a030"/>
  <path d="M10,7 Q16,2 22,7" fill="#DAA520"/>
  <path d="M10,9 Q16,6 22,9" fill="#B8860B"/>
  <path d="M22,8 Q25,7 24,11" fill="#DAA520"/>
  <!-- Head (face visible) -->
  <ellipse cx="16" cy="10" rx="4" ry="4" fill="#c8955a"/>
  <!-- Desert veil covering lower face -->
  <rect x="12" y="11" width="8" height="3" rx="1" fill="#8B6914"/>
  <!-- Eyes -->
  <circle cx="14" cy="10" r="0.8" fill="#333"/>
  <circle cx="18" cy="10" r="0.8" fill="#333"/>
  <!-- Robes body -->
  <path d="M10,14 Q9,22 10,30 L22,30 Q23,22 22,14 Q16,17 10,14 Z" fill="#C8A020"/>
  <!-- Robe pattern stripes -->
  <path d="M11,18 Q16,17 21,18" stroke="#8B6914" stroke-width="0.8" fill="none"/>
  <path d="M11,22 Q16,21 21,22" stroke="#8B6914" stroke-width="0.8" fill="none"/>
  <!-- Belt with jewels -->
  <rect x="10" y="19" width="12" height="2.5" fill="#8B6914"/>
  <circle cx="13" cy="20" r="1" fill="#FF4444"/>
  <circle cx="16" cy="20" r="1" fill="#4444FF"/>
  <circle cx="19" cy="20" r="1" fill="#44AA44"/>
  <!-- Scimitar right hand -->
  <path d="M22,13 Q26,15 28,12 Q27,18 22,19" stroke="#C0C0C0" stroke-width="1.5" fill="none"/>
  <rect x="21.5" y="12" width="2" height="7" rx="0.5" fill="#888"/>
  <rect x="21" y="10" width="3" height="4" rx="1" fill="#8B6914"/>
</svg>
