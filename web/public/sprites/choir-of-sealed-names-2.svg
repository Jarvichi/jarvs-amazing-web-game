<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three archivists in a row, stacked-ledger headdresses instead of hoods -->
  <circle cx="9" cy="12" r="3.4" fill="#A6A9C0"/>
  <rect x="6.6" y="6" width="4.8" height="2" rx="0.3" fill="#F2E9D8"/>
  <rect x="7" y="4.2" width="4" height="1.8" rx="0.3" fill="#E3D9CF"/>
  <path d="M6,15 L5,28 L13,28 L12,15 Q9,16.5 6,15 Z" fill="#A6A9C0"/>
  <circle cx="23" cy="12" r="3.4" fill="#A6A9C0"/>
  <rect x="20.6" y="6" width="4.8" height="2" rx="0.3" fill="#F2E9D8"/>
  <rect x="21" y="4.2" width="4" height="1.8" rx="0.3" fill="#E3D9CF"/>
  <path d="M20,15 L19,28 L27,28 L26,15 Q23,16.5 20,15 Z" fill="#A6A9C0"/>
  <!-- Front centre archivist, taller ledger-crown -->
  <circle cx="16" cy="10" r="4" fill="#C9CBDA"/>
  <rect x="13" y="3" width="6" height="2.4" rx="0.3" fill="#F2E9D8"/>
  <rect x="13.5" y="0.8" width="5" height="2.2" rx="0.3" fill="#E3D9CF"/>
  <ellipse cx="16" cy="11.5" rx="0.9" ry="1.3" fill="#2B2F3E"/>
  <path d="M12.5,14 L11,30 L21,30 L19.5,14 Q16,16 12.5,14 Z" fill="#C9CBDA"/>
  <rect x="13.5" y="18" width="5" height="1.1" fill="#7E8299"/>
  <!-- Sealed scroll-cases held aloft by each singer -->
  <rect x="7" y="9.4" width="2.8" height="1.6" rx="0.4" fill="#E8B94A" transform="rotate(-20 8.4 10.2)"/>
  <rect x="21.2" y="9.4" width="2.8" height="1.6" rx="0.4" fill="#E8B94A" transform="rotate(20 22.6 10.2)"/>
  <rect x="14.6" y="6.6" width="2.8" height="1.6" rx="0.4" fill="#E8B94A"/>
  <!-- Sealed-name glyphs rising -->
  <path d="M11,2.6 L11.9,3.6 L11,4.6 L10.1,3.6 Z" fill="#F2E9D8"/>
  <path d="M21,2.2 L21.9,3.2 L21,4.2 L20.1,3.2 Z" fill="#F2E9D8"/>
  <!-- Candle-gold glow at feet -->
  <ellipse cx="16" cy="29.5" rx="9" ry="1.8" fill="#E8B94A" opacity="0.25"/>
</svg>
