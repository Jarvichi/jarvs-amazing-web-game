<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Body -->
  <ellipse cx="16" cy="22" rx="8" ry="6" fill="#44aacc"/>
  <ellipse cx="16" cy="22" rx="6" ry="4" fill="#66ccee"/>
  <!-- Crystal scales -->
  <polygon points="10,20 12,17 14,20" fill="#33889b"/>
  <polygon points="14,19 16,16 18,19" fill="#33889b"/>
  <polygon points="18,20 20,17 22,20" fill="#33889b"/>
  <!-- Left neck -->
  <rect x="8" y="10" width="4" height="13" rx="2" fill="#44aacc" transform="rotate(-15 10 16)"/>
  <!-- Left head -->
  <ellipse cx="6" cy="8" rx="4" ry="3" fill="#66ccee"/>
  <rect x="3" y="9" width="6" height="2" rx="1" fill="#33889b"/>
  <circle cx="5" cy="6" r="1" fill="#00ffdd"/>
  <circle cx="8" cy="7" r="1" fill="#00ffdd"/>
  <!-- Right neck -->
  <rect x="20" y="10" width="4" height="13" rx="2" fill="#44aacc" transform="rotate(15 22 16)"/>
  <!-- Right head -->
  <ellipse cx="26" cy="8" rx="4" ry="3" fill="#66ccee"/>
  <rect x="23" y="9" width="6" height="2" rx="1" fill="#33889b"/>
  <circle cx="24" cy="6" r="1" fill="#00ffdd"/>
  <circle cx="27" cy="7" r="1" fill="#00ffdd"/>
  <!-- Centre neck -->
  <rect x="14" y="7" width="4" height="16" rx="2" fill="#55bbdd"/>
  <!-- Centre head -->
  <ellipse cx="16" cy="5" rx="5" ry="4" fill="#66ccee"/>
  <rect x="12" y="6" width="8" height="2" rx="1" fill="#33889b"/>
  <circle cx="14" cy="3" r="1.2" fill="#00ffdd"/>
  <circle cx="18" cy="3" r="1.2" fill="#00ffdd"/>
  <!-- Tail -->
  <ellipse cx="16" cy="28" rx="4" ry="3" fill="#33889b"/>
</svg>
