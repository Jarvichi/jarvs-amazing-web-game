<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tide Caller — static (water mage) -->
  <!-- Robe -->
  <path d="M12,12 L10,28 L22,28 L20,12 Z" fill="#3366aa" stroke="#224488" stroke-width="1"/>
  <path d="M13,12 L11,28 L21,28 L19,12 Z" fill="#4477bb" opacity="0.4"/>
  <!-- Hood/head -->
  <circle cx="16" cy="9" r="4" fill="#3366aa" stroke="#224488" stroke-width="0.8"/>
  <ellipse cx="16" cy="10" rx="2.5" ry="2" fill="#ffccaa" stroke="#cc8866" stroke-width="0.5"/>
  <!-- Water orb in hand -->
  <circle cx="21" cy="20" r="3.5" fill="#44aadd" stroke="#2288bb" stroke-width="0.8" opacity="0.9"/>
  <circle cx="20" cy="19" r="2" fill="#88ccee" opacity="0.6"/>
  <!-- Wave rings from orb -->
  <circle cx="21" cy="20" r="5" fill="none" stroke="#66bbee" stroke-width="0.5" opacity="0.5"/>
  <!-- Staff arm -->
  <rect x="19" y="12" width="2" height="10" rx="0.5" fill="#553311" stroke="#332211" stroke-width="0.7"/>
  <!-- Wave symbol on robe -->
  <path d="M13,18 Q14.5,15 16,18 Q17.5,21 19,18" fill="none" stroke="#88aaff" stroke-width="0.8" opacity="0.7"/>
</svg>
