  <circle cx="14" cy="9" r="1.5" fill="#cc00ff"/>
  <circle cx="18" cy="9" r="1.5" fill="#cc00ff"/>
  <!-- Daggers -->
  <line x1="23" y1="14" x2="28" y2="10" stroke="#aaaacc" stroke-width="1.5"/>
