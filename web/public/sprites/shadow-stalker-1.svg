  <line x1="9" y1="16" x2="4" y2="12" stroke="#aaaacc" stroke-width="1.5" opacity="0.5"/>
  <!-- Legs stride A (shadow tendrils) -->
  <path d="M12,26 Q10,28 9,31" stroke="#2a1a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M20,26 Q22,28 23,31" stroke="#2a1a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Shadow wisps -->
