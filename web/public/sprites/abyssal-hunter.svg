<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Abyssal Hunter — static (deep-sea flying predator) -->
  <!-- Elongated body -->
  <ellipse cx="16" cy="16" rx="10" ry="4" fill="#1a2244" stroke="#000022" stroke-width="1"/>
  <ellipse cx="15" cy="15" rx="7" ry="2.5" fill="#2a3366" opacity="0.6"/>
  <!-- Bioluminescent patches -->
  <circle cx="12" cy="16" r="1.2" fill="#44ffaa" opacity="0.8"/>
  <circle cx="16" cy="15" r="1" fill="#44ffaa" opacity="0.6"/>
  <circle cx="20" cy="16" r="1.2" fill="#44ffaa" opacity="0.8"/>
  <!-- Wings -->
  <path d="M16,14 Q10,8 8,12 Q12,13 16,14 Z" fill="#1a2244" stroke="#000022" stroke-width="0.8"/>
  <path d="M16,14 Q22,8 24,12 Q20,13 16,14 Z" fill="#1a2244" stroke="#000022" stroke-width="0.8"/>
  <!-- Wing glow trim -->
  <path d="M16,14 Q10,8 8,12" fill="none" stroke="#44ffaa" stroke-width="0.6" opacity="0.5"/>
  <path d="M16,14 Q22,8 24,12" fill="none" stroke="#44ffaa" stroke-width="0.6" opacity="0.5"/>
  <!-- Head / snout -->
  <ellipse cx="25" cy="16" rx="4" ry="2.5" fill="#1a2244" stroke="#000022" stroke-width="0.8"/>
  <!-- Eye: bioluminescent -->
  <circle cx="27" cy="15" r="1.5" fill="#44ffaa" stroke="#22cc88" stroke-width="0.5"/>
  <circle cx="27.3" cy="14.7" r="0.5" fill="#aaffdd"/>
  <!-- Tail fin -->
  <polygon points="5,16 2,13 2,19" fill="#1a2244" stroke="#000022" stroke-width="0.8"/>
</svg>
