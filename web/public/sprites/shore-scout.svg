<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Shore Scout — lean coastal ranger with spear -->
  <!-- Feathered hat -->
  <ellipse cx="16" cy="7" rx="6" ry="2" fill="#8B6914"/>
  <path d="M20,7 Q24,4 26,2" stroke="#228B22" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="2" r="1.5" fill="#228B22"/>
  <!-- Head -->
  <ellipse cx="16" cy="10" rx="4.5" ry="4.5" fill="#C89060"/>
  <ellipse cx="16" cy="10" rx="3.5" ry="3.5" fill="#DAA878"/>
  <!-- Eyes -->
  <circle cx="14.5" cy="9" r="0.9" fill="#333"/>
  <circle cx="17.5" cy="9" r="0.9" fill="#333"/>
  <!-- Smile -->
  <path d="M14.5,12 Q16,13 17.5,12" stroke="#333" stroke-width="0.7" fill="none"/>
  <!-- Neckerchief -->
  <path d="M12,13 Q16,15 20,13 L18,16 Q16,15 14,16 Z" fill="#20B2AA"/>
  <!-- Body — light scout coat -->
  <rect x="12" y="15" width="8" height="8" rx="1" fill="#8B6914"/>
  <rect x="13" y="16" width="6" height="6" rx="1" fill="#A07820"/>
  <!-- Vest straps -->
  <line x1="16" y1="15" x2="16" y2="23" stroke="#6B5010" stroke-width="0.8"/>
  <line x1="13" y1="17" x2="19" y2="17" stroke="#6B5010" stroke-width="0.8"/>
  <!-- Spear left hand -->
  <line x1="9" y1="5" x2="9" y2="28" stroke="#8B6914" stroke-width="1.5"/>
  <path d="M7,5 L9,9 L11,5" fill="#888" stroke="#666" stroke-width="0.5"/>
  <!-- Small buckler -->
  <circle cx="23" cy="18" r="3.5" fill="#5A7A9A" stroke="#4A6A8A" stroke-width="0.8"/>
  <circle cx="23" cy="18" r="1.5" fill="#6B8EAD"/>
  <!-- Belt -->
  <rect x="12" y="22" width="8" height="1.5" fill="#6B5010"/>
  <!-- Legs — breeches tucked into boots -->
  <rect x="12" y="23" width="4" height="5" rx="1" fill="#8B6914"/>
  <rect x="17" y="23" width="4" height="5" rx="1" fill="#8B6914"/>
  <!-- Boots -->
  <rect x="11" y="27" width="5" height="4" rx="1" fill="#5A3C10"/>
  <rect x="16" y="27" width="5" height="4" rx="1" fill="#5A3C10"/>
</svg>
