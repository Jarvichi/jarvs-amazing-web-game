<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- shadow -->
  <ellipse cx="16" cy="29" rx="5" ry="2" fill="rgba(0,0,0,0.25)"/>
  <!-- boots -->
  <rect x="11" y="25" width="4" height="3" rx="1" fill="#2a1010"/>
  <rect x="17" y="25" width="4" height="3" rx="1" fill="#2a1010"/>
  <!-- legs -->
  <rect x="12" y="20" width="3" height="6" rx="1" fill="#7a2a2a"/>
  <rect x="17" y="20" width="3" height="6" rx="1" fill="#7a2a2a"/>
  <!-- arena jacket -->
  <rect x="10" y="12" width="12" height="9" rx="2" fill="#8a2020"/>
  <!-- chest strap -->
  <rect x="10" y="17" width="12" height="2" rx="0" fill="#5a1010"/>
  <!-- belt buckle -->
  <rect x="14" y="17" width="4" height="2" rx="0" fill="#c87820"/>
  <!-- bronze shoulder armour -->
  <rect x="7" y="11" width="5" height="4" rx="2" fill="#c87820"/>
  <rect x="20" y="11" width="5" height="4" rx="2" fill="#c87820"/>
  <!-- gauntlet arms -->
  <rect x="7" y="15" width="4" height="6" rx="1" fill="#8a2020"/>
  <rect x="21" y="15" width="4" height="6" rx="1" fill="#8a2020"/>
  <!-- bronze gauntlet cuffs -->
  <rect x="7" y="19" width="4" height="2" rx="1" fill="#c87820"/>
  <rect x="21" y="19" width="4" height="2" rx="1" fill="#c87820"/>
  <!-- axe handle -->
  <rect x="24" y="11" width="2" height="10" rx="1" fill="#6b4020"/>
  <!-- axe head -->
  <rect x="21" y="10" width="5" height="4" rx="1" fill="#9a9aac"/>
  <!-- head -->
  <circle cx="16" cy="8" r="5" fill="#b88860"/>
  <!-- gladiator helmet -->
  <rect x="11" y="4" width="10" height="5" rx="2" fill="#c87820"/>
  <!-- helmet crest (red plume) -->
  <rect x="14" y="1" width="4" height="5" rx="1" fill="#cc2020"/>
  <!-- visor bar -->
  <rect x="12" y="7" width="8" height="2" rx="0" fill="#4a2010"/>
  <!-- glowing eyes through visor -->
  <rect x="13" y="7" width="2" height="1" fill="#ff8800"/>
  <rect x="17" y="7" width="2" height="1" fill="#ff8800"/>
</svg>
