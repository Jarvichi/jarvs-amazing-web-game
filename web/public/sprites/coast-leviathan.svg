<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Massive serpentine body -->
  <path d="M4,28 Q6,18 10,14 Q16,8 22,12 Q28,16 28,10" stroke="#006994" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M4,28 Q6,18 10,14 Q16,8 22,12 Q28,16 28,10" stroke="#1E90FF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Scale lines -->
  <path d="M8,20 Q10,18 12,20" stroke="#006994" stroke-width="0.8" fill="none"/>
  <path d="M12,16 Q14,14 16,16" stroke="#006994" stroke-width="0.8" fill="none"/>
  <path d="M18,13 Q20,11 22,13" stroke="#006994" stroke-width="0.8" fill="none"/>
  <!-- Head -->
  <ellipse cx="28" cy="9" rx="6" ry="4" fill="#006994"/>
  <ellipse cx="28" cy="9" rx="5" ry="3" fill="#1E90FF"/>
  <!-- Jaw -->
  <path d="M25,11 L32,12 L32,14 L25,13 Z" fill="#006994"/>
  <!-- Teeth -->
  <path d="M27,11 L27,13 M29,11 L29,13 M31,11 L31,13" stroke="#E0E8FF" stroke-width="0.8"/>
  <!-- Eyes -->
  <circle cx="29" cy="8" r="1.5" fill="#FFD700"/>
  <circle cx="29" cy="8" r="0.7" fill="#333"/>
  <!-- Fin crest on back -->
  <path d="M14,11 L13,7 L15,9 L16,5 L17,9 L19,7 L18,11" fill="#00CED1" opacity="0.8"/>
  <!-- Tail fin -->
  <path d="M4,28 Q1,26 0,30 Q3,31 5,29" fill="#1E90FF"/>
  <path d="M4,28 Q2,30 1,32" stroke="#1E90FF" stroke-width="2" fill="none"/>
</svg>
