<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sandy/dusty ground -->
  <ellipse cx="16" cy="28" rx="14" ry="4" fill="#7a6a2a"/>
  <ellipse cx="16" cy="27" rx="11" ry="3" fill="#6a5a1a"/>
  <!-- Rocky outcrop framing warren -->
  <path d="M4,24 Q2,18 5,12 Q8,8 11,13 Q9,18 10,24" fill="#5a5040"/>
  <path d="M28,24 Q30,18 27,12 Q24,8 21,13 Q23,18 22,24" fill="#5a5040"/>
  <!-- Rock highlight -->
  <path d="M5,14 Q6,11 8,13" stroke="#7a7060" stroke-width="1" fill="none"/>
  <path d="M27,14 Q26,11 24,13" stroke="#7a7060" stroke-width="1" fill="none"/>
  <!-- Main warren entrance (larger arch) -->
  <path d="M8,24 Q8,14 16,13 Q24,14 24,24 Z" fill="#1a1408"/>
  <!-- Inner darkness -->
  <path d="M10,24 Q10,16 16,15 Q22,16 22,24 Z" fill="#0a0a04"/>
  <!-- Multiple tunnel openings suggest a warren -->
  <ellipse cx="11" cy="24" rx="2.5" ry="1.5" fill="#0a0a04"/>
  <ellipse cx="21" cy="24" rx="2.5" ry="1.5" fill="#0a0a04"/>
  <!-- Glowing eyes — multiple lizards inside -->
  <ellipse cx="13" cy="20" rx="1" ry="0.7" fill="#ddff22" opacity="0.9"/>
  <ellipse cx="15.5" cy="20" rx="1" ry="0.7" fill="#ddff22" opacity="0.9"/>
  <ellipse cx="13" cy="20" rx="0.35" ry="0.6" fill="#001100"/>
  <ellipse cx="15.5" cy="20" rx="0.35" ry="0.6" fill="#001100"/>
  <ellipse cx="18" cy="18" rx="0.9" ry="0.6" fill="#bbdd22" opacity="0.7"/>
  <ellipse cx="20" cy="18" rx="0.9" ry="0.6" fill="#bbdd22" opacity="0.7"/>
  <!-- Scattered bones/debris on ground -->
  <line x1="7" y1="27" x2="10" y2="26" stroke="#ccc0a0" stroke-width="1"/>
  <line x1="22" y1="26" x2="25" y2="27" stroke="#ccc0a0" stroke-width="1"/>
  <!-- Claw marks in dirt -->
  <path d="M13,28 Q14,27 15,28" stroke="#8a7a3a" stroke-width="0.8" fill="none"/>
  <path d="M17,28 Q18,27 19,28" stroke="#8a7a3a" stroke-width="0.8" fill="none"/>
</svg>
