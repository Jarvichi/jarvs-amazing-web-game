<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wall-sconce bracket the archer sights from -->
  <rect x="1.5" y="9" width="3" height="17" rx="0.8" fill="#454E6B"/>
  <rect x="2.2" y="6" width="1.6" height="3.4" rx="0.6" fill="#F2E9D8"/>
  <circle cx="3" cy="5.6" r="1.2" fill="#FFE08A"/>
  <!-- Crouched body -->
  <path d="M9,16 Q13,13 18,15 L19,23 L9,23 Z" fill="#A6A9C0"/>
  <rect x="9.5" y="19" width="9" height="1.2" fill="#5E6A8C"/>
  <!-- Pointed hood, head forward -->
  <circle cx="15" cy="11.5" r="3.6" fill="#E3D9CF"/>
  <path d="M10.6,12 L14,4.5 L19.6,11 L19,12 Q15,9 11.2,13 Z" fill="#5E6A8C"/>
  <circle cx="17.2" cy="11.8" r="0.7" fill="#2B2F3E"/>
  <!-- Drawn bow, held out right -->
  <rect x="17" y="15" width="8" height="2.2" rx="1" fill="#A6A9C0"/>
  <path d="M26,9 Q31.5,16 26,23" stroke="#454E6B" stroke-width="1.6" fill="none"/>
  <path d="M26,9 L19.6,16 L26,23" stroke="#C9CBDA" stroke-width="0.7" fill="none"/>
  <rect x="19.6" y="15.6" width="8" height="0.8" fill="#E8B94A"/>
  <path d="M27.6,16 L30,16 L27.6,14.8 Z" fill="#F2E9D8"/>
  <!-- Wax-stick quiver at hip -->
  <rect x="7.5" y="16" width="3" height="7" rx="0.8" fill="#2B2F3E"/>
  <rect x="8.3" y="14" width="1.4" height="2.4" rx="0.5" fill="#F2E9D8"/>
  <rect x="11" y="23" width="3.6" height="8" rx="1" fill="#454E6B" transform="rotate(14 12.8 23)"/>
  <rect x="15.5" y="23" width="3.6" height="8" rx="1" fill="#454E6B" transform="rotate(-14 17.3 23)"/>
  <rect x="9.6" y="28.8" width="5.4" height="2.8" rx="1" fill="#3A3F55"/>
  <rect x="16.6" y="29.2" width="5.4" height="2.8" rx="1" fill="#3A3F55"/>
</svg>
