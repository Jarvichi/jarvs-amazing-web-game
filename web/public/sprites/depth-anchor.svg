  <!-- Staff -->
  <rect x="15" y="5" width="2" height="18" rx="0.5" fill="#336688" stroke="#224466" stroke-width="0.8"/>
  <!-- Crossbar -->
  <rect x="9" y="9" width="14" height="2.5" rx="1" fill="#336688" stroke="#224466" stroke-width="0.8"/>
