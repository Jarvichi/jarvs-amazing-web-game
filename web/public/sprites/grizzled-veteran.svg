<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Scarred head, stubble -->
  <ellipse cx="16" cy="9" rx="5.5" ry="5.5" fill="#9A7050"/>
  <!-- Battle scar -->
  <path d="M13,7 L15,11" stroke="#7A5030" stroke-width="0.8"/>
  <!-- Cropped grey hair -->
  <path d="M11,8 Q16,4 21,8" fill="#888"/>
  <!-- Bushy grey eyebrows -->
  <rect x="12" y="8" width="4" height="1" rx="0.5" fill="#777"/>
  <rect x="17" y="8" width="4" height="1" rx="0.5" fill="#777"/>
  <!-- Eyes — one squinting (battle-worn) -->
  <ellipse cx="14" cy="10" rx="1.2" ry="0.7" fill="#333"/>
  <circle cx="18" cy="10" r="0.9" fill="#333"/>
  <!-- Stubble/beard hint -->
  <path d="M12,12 Q16,15 20,12" stroke="#888" stroke-width="0.8" fill="none"/>
  <!-- Battered armour body -->
  <path d="M10,15 L10,22 L22,22 L22,15 Q16,18 10,15 Z" fill="#556677"/>
  <!-- Dents and scratches -->
  <path d="M14,16 L15,18" stroke="#334455" stroke-width="1"/>
  <path d="M18,15 L17,17" stroke="#334455" stroke-width="1"/>
  <!-- Belt -->
  <rect x="10" y="20" width="12" height="2" fill="#333"/>
  <!-- Sword left hand -->
  <rect x="7" y="12" width="2" height="13" rx="0.5" fill="#AAA"/>
  <rect x="5.5" y="14" width="5" height="1.5" rx="0.5" fill="#888"/>
  <rect x="7" y="11" width="2" height="3" rx="1" fill="#5C3A10"/>
  <!-- Round shield on back (simplified) -->
  <circle cx="23" cy="18" r="4" fill="#334455"/>
  <circle cx="23" cy="18" r="3" fill="#445566"/>
  <circle cx="23" cy="18" r="1" fill="#888"/>
  <!-- Legs -->
  <rect x="11" y="22" width="5" height="8" rx="1" fill="#445566"/>
  <rect x="17" y="22" width="5" height="8" rx="1" fill="#445566"/>
  <rect x="10" y="28" width="7" height="3" rx="1" fill="#333"/>
  <rect x="16" y="28" width="7" height="3" rx="1" fill="#333"/>
</svg>
