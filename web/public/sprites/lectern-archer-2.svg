<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Standing atop a reading lectern, not on bare ground -->
  <path d="M9,27 L11,20 L21,20 L23,27 Z" fill="#8A6F4D"/>
  <path d="M11,20 L21,20 L19.5,17.4 L12.5,17.4 Z" fill="#6E5A3E"/>
  <rect x="10" y="27" width="12" height="2.4" rx="0.6" fill="#454E6B"/>
  <!-- Hooded head -->
  <circle cx="16" cy="9" r="4.6" fill="#7E8299"/>
  <path d="M11.5,9 Q16,2.8 20.5,9 L20.5,10.8 Q16,7.8 11.5,10.8 Z" fill="#5E6A8C"/>
  <circle cx="16" cy="10" r="2.6" fill="#E3D9CF"/>
  <circle cx="15" cy="10" r="0.6" fill="#2B2F3E"/>
  <circle cx="17.3" cy="10" r="0.6" fill="#2B2F3E"/>
  <!-- Crouched perched body -->
  <path d="M12.5,13.5 L12.5,20 L19.5,20 L19.5,13.5 Q16,15.4 12.5,13.5 Z" fill="#A6A9C0"/>
  <rect x="12.5" y="16.8" width="7" height="1.1" fill="#5E6A8C"/>
  <!-- Rolled-parchment fletched arrows in a case slung on the lectern -->
  <rect x="19.5" y="12.5" width="3.2" height="7.5" rx="1" fill="#2B2F3E"/>
  <path d="M20.4,11 L21.1,12.5 L19.7,12.5 Z" fill="#F2E9D8"/>
  <path d="M22,11 L22.7,12.5 L21.3,12.5 Z" fill="#F2E9D8"/>
  <!-- Longbow -->
  <rect x="7.5" y="13.5" width="4" height="5.3" rx="1" fill="#A6A9C0"/>
  <path d="M6.5,7.6 Q2.5,16 6.5,24.4" stroke="#454E6B" stroke-width="1.4" fill="none"/>
  <line x1="6.5" y1="7.6" x2="6.5" y2="24.4" stroke="#C9CBDA" stroke-width="0.6"/>
</svg>
