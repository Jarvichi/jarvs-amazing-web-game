<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- shadow -->
  <ellipse cx="16" cy="29" rx="5" ry="2" fill="rgba(0,0,0,0.2)"/>
  <!-- coat -->
  <rect x="10" y="13" width="12" height="15" rx="2" fill="#4a2a6a"/>
  <!-- lapels -->
  <polygon points="16,13 13,15 16,19" fill="#7a4aaa"/>
  <polygon points="16,13 19,15 16,19" fill="#7a4aaa"/>
  <!-- arms -->
  <rect x="8"  y="14" width="3" height="8" rx="1" fill="#4a2a6a"/>
  <rect x="21" y="14" width="3" height="8" rx="1" fill="#4a2a6a"/>
  <!-- cards fanned in right hand -->
  <rect x="22" y="16" width="4" height="5" rx="0.5" fill="#fff" transform="rotate(-15 22 16)"/>
  <rect x="23" y="16" width="4" height="5" rx="0.5" fill="#f0c0f0" transform="rotate(0 23 16)"/>
  <rect x="24" y="16" width="4" height="5" rx="0.5" fill="#c0c0ff" transform="rotate(15 24 16)"/>
  <!-- head -->
  <circle cx="16" cy="9" r="5" fill="#c8a070"/>
  <!-- top hat -->
  <rect x="12" y="1" width="8" height="6" rx="1" fill="#2a1a3a"/>
  <rect x="10" y="6" width="12" height="2" rx="1" fill="#2a1a3a"/>
  <!-- hat band -->
  <rect x="12" y="6" width="8" height="1.5" fill="#aa44aa"/>
  <!-- eyes -->
  <rect x="13" y="8" width="2" height="2" rx="1" fill="#1a0a2a"/>
  <rect x="17" y="8" width="2" height="2" rx="1" fill="#1a0a2a"/>
  <!-- smile -->
  <path d="M13 11 Q16 13 19 11" fill="none" stroke="#8b5e3c" stroke-width="0.7"/>
</svg>
