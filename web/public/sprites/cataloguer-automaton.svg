  <circle cx="21.75" cy="12" r="0.4" fill="#E8B94A"/>
  <rect x="7.5" y="17" width="4.5" height="3" rx="0.4" fill="#3A3F55"/>
  <circle cx="9.75" cy="18.5" r="0.4" fill="#E8B94A"/>
