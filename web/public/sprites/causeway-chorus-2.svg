  <circle cx="16" cy="11" r="4" fill="#C9CBDA"/>
  <path d="M12,11 Q16,4.5 20,11 L20,13 Q16,10 12,13 Z" fill="#7E8299"/>
  <path d="M13.5,11 Q16,7 18.5,11 Z" fill="#454E6B"/>
  <ellipse cx="16" cy="12.3" rx="0.9" ry="1.3" fill="#3A3F55"/>
  <path d="M12.8,15 L11.5,30 L20.5,30 L19.2,15 Q16,16.8 12.8,15 Z" fill="#C9CBDA"/>
  <rect x="13.8" y="19" width="4.4" height="1" fill="#7E8299"/>
  <path d="M19.5,13.5 L21.5,15.5 L20,17 L18.3,15 Z" fill="#7E8299"/>
  <circle cx="21" cy="15.8" r="1.1" fill="#E8B94A"/>
