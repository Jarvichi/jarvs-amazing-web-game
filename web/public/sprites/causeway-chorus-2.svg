  <rect x="20.7" y="2" width="0.6" height="3" fill="#E8EAF4"/>
  <!-- Lantern glow at the gate -->
  <ellipse cx="16" cy="29.5" rx="9" ry="1.8" fill="#E8B94A" opacity="0.22"/>
