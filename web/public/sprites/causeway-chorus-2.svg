  <circle cx="4.5" cy="20" r="1.4" fill="none" stroke="#8A6F4D" stroke-width="0.9"/>
  <circle cx="27.5" cy="20" r="1.4" fill="none" stroke="#8A6F4D" stroke-width="0.9"/>
