<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- shadow -->
  <ellipse cx="16" cy="29" rx="5" ry="2" fill="rgba(0,0,0,0.2)"/>
  <!-- legs -->
  <rect x="12" y="21" width="3" height="7" rx="1" fill="#5a3a1a"/>
  <rect x="17" y="21" width="3" height="7" rx="1" fill="#5a3a1a"/>
  <!-- apron over shirt -->
  <rect x="10" y="13" width="12" height="10" rx="2" fill="#7a9a3a"/>
  <rect x="12" y="13" width="8" height="10" rx="1" fill="#e8d8a0"/>
  <!-- apron tie strings -->
  <line x1="12" y1="14" x2="9" y2="16" stroke="#c8b870" stroke-width="1"/>
  <line x1="20" y1="14" x2="23" y2="16" stroke="#c8b870" stroke-width="1"/>
  <!-- arms -->
  <rect x="8"  y="14" width="3" height="8" rx="1" fill="#c8a070"/>
  <rect x="21" y="14" width="3" height="8" rx="1" fill="#c8a070"/>
  <!-- potion bottle in right hand -->
  <rect x="22" y="17" width="3" height="4" rx="1" fill="#44aa44"/>
  <rect x="23" y="16" width="1.5" height="2" rx="0.5" fill="#888"/>
  <ellipse cx="23.5" cy="19" rx="1" ry="1" fill="#88ff88" opacity="0.6"/>
  <!-- head -->
  <circle cx="16" cy="9" r="5" fill="#d4a870"/>
  <!-- kerchief -->
  <path d="M11 6 Q16 2 21 6 L19 9 Q16 7 13 9 Z" fill="#e05030"/>
  <!-- eyes -->
  <rect x="13" y="8" width="2" height="2" rx="1" fill="#3a1a0a"/>
  <rect x="17" y="8" width="2" height="2" rx="1" fill="#3a1a0a"/>
  <!-- smile -->
  <path d="M13 11 Q16 13 19 11" fill="none" stroke="#8b5e3c" stroke-width="0.7"/>
