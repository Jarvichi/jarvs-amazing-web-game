<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ground -->
  <ellipse cx="16" cy="29.5" rx="13" ry="2" fill="#7E8299" opacity="0.5"/>
  <!-- Toppled shelving units lying at angles, not upright posts -->
  <rect x="2" y="22" width="13" height="4" rx="0.5" fill="#A6A9C0" transform="rotate(-14 8.5 24)"/>
  <rect x="17" y="21" width="13" height="4" rx="0.5" fill="#C9CBDA" transform="rotate(11 23.5 23)"/>
  <rect x="6" y="17" width="12" height="3.6" rx="0.5" fill="#9FA3BC" transform="rotate(-8 12 18.8)"/>
  <!-- Shelf compartment dividers on the fallen boards -->
  <line x1="5" y1="21.4" x2="6" y2="26.8" stroke="#7E8299" stroke-width="0.6" transform="rotate(-14 8.5 24)"/>
  <line x1="9" y1="21.4" x2="10" y2="26.8" stroke="#7E8299" stroke-width="0.6" transform="rotate(-14 8.5 24)"/>
  <line x1="21" y1="20.4" x2="22" y2="25.8" stroke="#7E8299" stroke-width="0.6" transform="rotate(11 23.5 23)"/>
  <line x1="25" y1="20.4" x2="26" y2="25.8" stroke="#7E8299" stroke-width="0.6" transform="rotate(11 23.5 23)"/>
  <!-- Scattered fallen ledgers -->
  <rect x="9" y="26" width="4" height="2.4" rx="0.4" fill="#8A6F4D" transform="rotate(18 11 27.2)"/>
  <rect x="17" y="26.5" width="4" height="2.4" rx="0.4" fill="#6E5A3E" transform="rotate(-12 19 27.7)"/>
  <rect x="13" y="27.6" width="4" height="2.4" rx="0.4" fill="#8A6F4D" transform="rotate(6 15 28.8)"/>
  <!-- Bound cord straining across the pile -->
  <path d="M2,20 Q16,26 30,19" stroke="#2B2F3E" stroke-width="1.4" fill="none"/>
  <!-- Mist drifting through -->
  <ellipse cx="10" cy="27.5" rx="6" ry="1.4" fill="#E8EAF4" opacity="0.45"/>
  <ellipse cx="22" cy="28" rx="5" ry="1.2" fill="#E8EAF4" opacity="0.4"/>
</svg>
