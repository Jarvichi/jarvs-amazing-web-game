<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pale, hollow-eyed head -->
  <ellipse cx="16" cy="8" rx="7" ry="6" fill="#CCBBAA"/>
  <ellipse cx="16" cy="8" rx="6" ry="5" fill="#DDEEDD" opacity="0.7"/>
  <!-- Deep hollow eyes (undead-like) -->
  <ellipse cx="12.5" cy="7.5" rx="2.5" ry="2" fill="#222" opacity="0.8"/>
  <ellipse cx="19.5" cy="7.5" rx="2.5" ry="2" fill="#222" opacity="0.8"/>
  <!-- Pale glow in eyes -->
  <circle cx="12.5" cy="7.5" r="1" fill="#99BBFF" opacity="0.8"/>
  <circle cx="19.5" cy="7.5" r="1" fill="#99BBFF" opacity="0.8"/>
  <!-- Gaping mouth line -->
  <path d="M13,11 L14,13 L16,12 L18,13 L19,11" stroke="#888" stroke-width="0.8" fill="none"/>
  <!-- Neck cracks -->
  <rect x="13" y="14" width="6" height="3" rx="1" fill="#BBAA99"/>
  <path d="M14,14 L14,17 M16,14 L16,17" stroke="#9A8880" stroke-width="0.5"/>
  <!-- Colossal body — pale bone-like -->
  <rect x="6" y="17" width="20" height="12" rx="2" fill="#CCBBAA"/>
  <rect x="7" y="18" width="18" height="10" fill="#DDEEDD" opacity="0.6"/>
  <!-- Pale cracks on torso -->
  <path d="M12,19 L13,23 M18,19 L17,23" stroke="#9A8880" stroke-width="0.8"/>
  <path d="M10,21 L22,21" stroke="#BBAA99" stroke-width="0.5"/>
  <!-- Shoulder slabs -->
  <rect x="2"  y="17" width="5" height="8" rx="1" fill="#BBAA99"/>
  <rect x="25" y="17" width="5" height="8" rx="1" fill="#BBAA99"/>
  <!-- Arms -->
  <rect x="1"  y="24" width="5" height="6" rx="1" fill="#CCBBAA"/>
  <rect x="26" y="24" width="5" height="6" rx="1" fill="#CCBBAA"/>
  <!-- Fists -->
  <rect x="1"  y="28" width="6" height="3" rx="2" fill="#BBAA99"/>
  <rect x="25" y="28" width="6" height="3" rx="2" fill="#BBAA99"/>
  <!-- Legs -->
  <rect x="8"  y="29" width="6" height="3" rx="1" fill="#BBAA99"/>
  <rect x="18" y="29" width="6" height="3" rx="1" fill="#BBAA99"/>
</svg>
