  <polygon points="26,23 24,20 28,21" fill="#888"/>
  <!-- Legs -->
  <rect x="11" y="22" width="5" height="8" rx="1" fill="#008B8B"/>
  <rect x="17" y="22" width="5" height="8" rx="1" fill="#008B8B"/>
  <rect x="10" y="28" width="7" height="3" rx="1" fill="#5C3A10"/>
  <rect x="16" y="28" width="7" height="3" rx="1" fill="#5C3A10"/>
</svg>
