<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bowed head, straining under the load -->
  <circle cx="14" cy="11" r="4.4" fill="#E3D9CF"/>
  <path d="M9.6,11 Q14,4.5 18.4,11 L18.4,12.6 Q14,9.6 9.6,12.6 Z" fill="#7E8299"/>
  <circle cx="12.8" cy="11.6" r="0.6" fill="#2B2F3E"/>
  <circle cx="15.2" cy="11.6" r="0.6" fill="#2B2F3E"/>
  <!-- Hunched, burdened body -->
  <path d="M9.5,15.5 L9.5,23 L18,23 L18,15.5 Q13.5,17.2 9.5,15.5 Z" fill="#7E8299"/>
  <rect x="9.5" y="18" width="8.5" height="1.1" fill="#5E6A8C"/>
  <!-- Towering stack of registers strapped to the back, taller than the bearer -->
  <rect x="15.5" y="4" width="10" height="4.2" rx="0.5" fill="#F2E9D8"/>
  <rect x="16" y="8.4" width="9.4" height="4.2" rx="0.5" fill="#E3D9CF"/>
  <rect x="16.5" y="12.8" width="8.8" height="4.2" rx="0.5" fill="#F2E9D8"/>
  <rect x="17" y="17.2" width="8" height="6" rx="0.5" fill="#E3D9CF"/>
  <path d="M15,5 Q11,12 15,22" stroke="#2B2F3E" stroke-width="1.2" fill="none"/>
  <circle cx="16" cy="10" r="0.7" fill="#E8B94A"/>
  <circle cx="16.5" cy="15" r="0.7" fill="#E8B94A"/>
  <!-- Small sealing hammer, not a mace -->
  <rect x="5.5" y="16" width="1.4" height="7" rx="0.5" fill="#8A6F4D"/>
  <rect x="4" y="13.6" width="4.4" height="2.8" rx="0.6" fill="#454E6B"/>
  <!-- Legs (neutral, bent under the weight) -->
  <rect x="10" y="23" width="3.4" height="6" rx="1" fill="#454E6B"/>
  <rect x="14.4" y="23" width="3.4" height="7" rx="1" fill="#454E6B"/>
  <rect x="9" y="28" width="5.4" height="2.8" rx="1" fill="#3A3F55"/>
  <rect x="14" y="28.8" width="5.4" height="2.8" rx="1" fill="#3A3F55"/>
</svg>
