  <circle cx="16" cy="17" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="22" cy="20" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="6" cy="18" r="0.7" fill="#cceeff" opacity="0.7"/>
  <circle cx="26" cy="18" r="0.7" fill="#cceeff" opacity="0.7"/>
</svg>
