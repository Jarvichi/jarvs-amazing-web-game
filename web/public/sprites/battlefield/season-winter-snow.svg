  <circle cx="25" cy="30"  r="1.2" fill="white" opacity="0.55"/>
  <circle cx="45" cy="55"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="18" cy="80"  r="1.2" fill="white" opacity="0.48"/>
  <circle cx="65" cy="40"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="78" cy="70"  r="1.2" fill="white" opacity="0.48"/>
  <circle cx="38" cy="105" r="1"   fill="white" opacity="0.42"/>
  <circle cx="85" cy="100" r="1.1" fill="white" opacity="0.42"/>
  <circle cx="12" cy="130" r="1"   fill="white" opacity="0.36"/>
