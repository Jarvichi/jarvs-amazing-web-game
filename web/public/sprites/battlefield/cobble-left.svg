<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 220" preserveAspectRatio="none">
  <!-- Cobblestone grid left margin -->
  <rect x="0" y="0" width="22" height="220" fill="#4a4a50"/>
  <defs>
    <pattern id="cobL" x="1" y="2" width="11" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="9" height="12" fill="#545460" opacity="0.7" rx="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="22" height="220" fill="url(#cobL)"/>
  <line x1="22" y1="0" x2="22" y2="220" stroke="#3a3a42" stroke-width="0.5" opacity="0.5"/>
</svg>
