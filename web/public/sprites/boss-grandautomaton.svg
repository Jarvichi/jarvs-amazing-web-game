<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Grand Automaton: copper/brass mechanical, glowing core, gears -->
  <!-- Body (wide mechanical) -->
  <rect x="8" y="12" width="16" height="14" rx="2" fill="#8c5a20"/>
  <!-- Gear details -->
  <rect x="10" y="14" width="5" height="5" rx="2" fill="#c8781a"/>
  <rect x="17" y="14" width="5" height="5" rx="2" fill="#c8781a"/>
  <!-- Central core -->
  <rect x="13" y="16" width="6" height="6" rx="3" fill="#ffcc00"/>
  <rect x="14" y="17" width="4" height="4" rx="2" fill="#ffee88"/>
  <!-- Shoulder pistons -->
  <rect x="4" y="11" width="6" height="4" rx="1" fill="#6a4010"/>
  <rect x="22" y="11" width="6" height="4" rx="1" fill="#6a4010"/>
  <!-- Head (box-like) -->
  <rect x="10" y="3" width="12" height="10" rx="2" fill="#6a4010"/>
  <!-- Optical sensors -->
  <rect x="11" y="6" width="4" height="3" rx="1" fill="#ff8800"/>
  <rect x="17" y="6" width="4" height="3" rx="1" fill="#ff8800"/>
  <!-- Grill mouth -->
  <rect x="12" y="11" width="8" height="2" fill="#4a2a05"/>
  <rect x="13" y="11" width="2" height="2" fill="#8c5a20"/>
  <rect x="16" y="11" width="2" height="2" fill="#8c5a20"/>
  <rect x="19" y="11" width="2" height="2" fill="#8c5a20"/>
  <!-- Legs (mechanical) -->
  <rect x="10" y="26" width="4" height="4" rx="1" fill="#6a4010"/>
  <rect x="18" y="26" width="4" height="4" rx="1" fill="#6a4010"/>
</svg>