  <rect x="18" y="24" width="3.5" height="5.5" rx="1" fill="#454E6B"/>
  <rect x="9" y="29" width="5.5" height="2.6" rx="1" fill="#3A3F55"/>
  <rect x="18" y="27.5" width="5" height="2.6" rx="1" fill="#3A3F55"/>
</svg>
