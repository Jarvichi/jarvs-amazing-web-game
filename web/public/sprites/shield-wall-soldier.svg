<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Shield Wall Soldier — heavy armoured soldier with tower shield -->
  <!-- Helm -->
  <path d="M11,9 Q11,4 16,4 Q21,4 21,9" fill="#888" stroke="#666" stroke-width="0.8"/>
  <!-- Helm visor bar -->
  <rect x="11" y="8" width="10" height="2" rx="0.5" fill="#666"/>
  <!-- Head -->
  <ellipse cx="16" cy="11" rx="5" ry="4" fill="#999"/>
  <!-- Eye slits -->
  <rect x="12" y="10" width="3" height="1" rx="0.5" fill="#333"/>
  <rect x="17" y="10" width="3" height="1" rx="0.5" fill="#333"/>
  <!-- Gorget -->
  <path d="M11,14 Q16,16 21,14 L21,15 Q16,17 11,15 Z" fill="#777"/>
  <!-- Body — plate armour -->
  <rect x="12" y="15" width="9" height="9" rx="1" fill="#888"/>
  <rect x="13" y="16" width="7" height="7" rx="1" fill="#999"/>
  <!-- Breastplate detail -->
  <path d="M13,18 Q16.5,17 20,18" stroke="#777" stroke-width="0.7" fill="none"/>
  <path d="M13,20 Q16.5,19 20,20" stroke="#777" stroke-width="0.7" fill="none"/>
  <!-- Tower shield on left arm -->
  <rect x="2" y="11" width="7" height="14" rx="1" fill="#5A7A9A"/>
  <rect x="3" y="12" width="5" height="12" rx="1" fill="#6B8EAD"/>
  <!-- Shield emblem -->
  <path d="M5,14 L5,20 L7,22 L7,14 Z" fill="#4A6A8A" opacity="0.6"/>
  <circle cx="5.5" cy="18" r="1" fill="#B8D0E8"/>
  <!-- Sword right hand -->
  <line x1="22" y1="8" x2="22" y2="22" stroke="#CCC" stroke-width="2"/>
  <rect x="20" y="14" width="4" height="1.5" rx="0.5" fill="#888"/>
  <ellipse cx="22" cy="8" rx="1" ry="2" fill="#B8860B"/>
  <!-- Belt -->
  <rect x="12" y="23" width="9" height="2" fill="#666"/>
  <!-- Legs — greaves -->
  <rect x="12" y="25" width="4" height="7" rx="1" fill="#888"/>
  <rect x="17" y="25" width="4" height="7" rx="1" fill="#888"/>
  <!-- Sabatons -->
  <rect x="11" y="30" width="6" height="2" rx="1" fill="#777"/>
  <rect x="16" y="30" width="6" height="2" rx="1" fill="#777"/>
</svg>
