<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Walk frame 3: stride B — opposite of frame 1 -->
  <rect x="12" y="13" width="8" height="9" rx="2" fill="#5a7a2a"/>
  <circle cx="16" cy="9" r="5" fill="#3a6a18"/>
