  <circle cx="14" cy="9" r="1.2" fill="#88ff44"/>
  <circle cx="18" cy="9" r="1.2" fill="#88ff44"/>
  <!-- Right arm back, left arm forward -->
  <line x1="20" y1="14" x2="25" y2="19" stroke="#5a7a2a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="14" x2="7" y2="16" stroke="#5a7a2a" stroke-width="2.5" stroke-linecap="round"/>
