  <rect x="4" y="17" width="2" height="3" rx="1" fill="#B8860B"/>
  <!-- Legs -->
  <rect x="12" y="22" width="4" height="8" rx="1" fill="#666"/>
  <rect x="17" y="22" width="4" height="8" rx="1" fill="#666"/>
  <rect x="11" y="28" width="6" height="3" rx="1" fill="#B8860B"/>
  <rect x="16" y="28" width="6" height="3" rx="1" fill="#B8860B"/>
