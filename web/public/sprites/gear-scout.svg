<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Round goggle head -->
  <circle cx="16" cy="9" r="6" fill="#888"/>
  <circle cx="16" cy="9" r="5" fill="#999"/>
  <!-- Goggles -->
  <circle cx="13.5" cy="9" r="2.5" fill="#333"/>
  <circle cx="18.5" cy="9" r="2.5" fill="#333"/>
  <rect x="15.8" y="8" width="0.8" height="2" fill="#555"/>
  <circle cx="13.5" cy="9" r="1.5" fill="#FF8800" opacity="0.7"/>
  <circle cx="18.5" cy="9" r="1.5" fill="#FF8800" opacity="0.7"/>
  <!-- Goggle strap -->
  <rect x="10" y="8" width="3" height="1.5" rx="0.5" fill="#555"/>
  <rect x="19" y="8" width="3" height="1.5" rx="0.5" fill="#555"/>
  <!-- Slim body -->
  <path d="M12,15 L12,22 L20,22 L20,15 Q16,17 12,15 Z" fill="#777"/>
