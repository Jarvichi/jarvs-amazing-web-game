  <!-- Long iron key-staff -->
  <rect x="22.6" y="4" width="1.4" height="19" rx="0.6" fill="#7E8299"/>
  <rect x="21.4" y="3" width="3.8" height="2.2" rx="0.5" fill="#9FA3BC"/>
  <path d="M21.4,23 L21.4,25 L23.3,25 L23.3,23 M24.6,23 L24.6,26 L23.3,26" stroke="#7E8299" stroke-width="1.1" fill="none"/>
  <!-- Legs (neutral) -->
  <rect x="11.5" y="23" width="3.5" height="7" rx="1" fill="#454E6B"/>
  <rect x="16" y="23" width="3.5" height="7" rx="1" fill="#454E6B"/>
  <rect x="10.5" y="28" width="5.5" height="3" rx="1" fill="#3A3F55"/>
  <rect x="15.5" y="28" width="5.5" height="3" rx="1" fill="#3A3F55"/>
