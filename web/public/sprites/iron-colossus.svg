<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Massive angular iron head -->
  <rect x="8" y="3" width="16" height="11" rx="1" fill="#333"/>
  <rect x="9" y="4" width="14" height="9" rx="1" fill="#444"/>
  <!-- Eye slits — red glow -->
  <rect x="10" y="7" width="5" height="2" rx="0.5" fill="#CC0000"/>
  <rect x="17" y="7" width="5" height="2" rx="0.5" fill="#CC0000"/>
  <!-- Rivet details -->
  <circle cx="10" cy="5" r="0.8" fill="#222"/>
  <circle cx="22" cy="5" r="0.8" fill="#222"/>
  <circle cx="10" cy="12" r="0.8" fill="#222"/>
  <circle cx="22" cy="12" r="0.8" fill="#222"/>
  <!-- Iron neck -->
  <rect x="12" y="14" width="8" height="3" fill="#333"/>
  <!-- Huge blocky torso -->
  <rect x="5" y="17" width="22" height="13" rx="1" fill="#333"/>
  <rect x="6" y="18" width="20" height="11" fill="#3D3D3D"/>
  <!-- Iron plates on chest -->
  <rect x="8"  y="19" width="7" height="5" rx="0.5" fill="#444"/>
  <rect x="17" y="19" width="7" height="5" rx="0.5" fill="#444"/>
  <!-- Central iron emblem -->
  <rect x="13" y="24" width="6" height="4" rx="0.5" fill="#555"/>
  <rect x="14" y="25" width="4" height="2" fill="#CC0000" opacity="0.6"/>
  <!-- Shoulder blocks -->
  <rect x="1"  y="17" width="5" height="8" rx="1" fill="#2A2A2A"/>
  <rect x="26" y="17" width="5" height="8" rx="1" fill="#2A2A2A"/>
  <!-- Piston arms -->
  <rect x="0"  y="24" width="5" height="7" rx="1" fill="#333"/>
  <rect x="27" y="24" width="5" height="7" rx="1" fill="#333"/>
  <!-- Iron fists -->
  <rect x="0"  y="29" width="6" height="3" rx="1" fill="#222"/>
  <rect x="26" y="29" width="6" height="3" rx="1" fill="#222"/>
  <!-- Legs -->
  <rect x="7"  y="30" width="7" height="2" rx="1" fill="#2A2A2A"/>
  <rect x="18" y="30" width="7" height="2" rx="1" fill="#2A2A2A"/>
</svg>
