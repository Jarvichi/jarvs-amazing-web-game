<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Walk frame 1: massive bone titan, stride A -->
  <!-- Ribcage/torso -->
  <rect x="7" y="11" width="18" height="12" rx="2" fill="#d4c8a8"/>
  <!-- Rib lines -->
  <line x1="9" y1="13" x2="23" y2="13" stroke="#a09880" stroke-width="1"/>
  <line x1="9" y1="16" x2="23" y2="16" stroke="#a09880" stroke-width="1"/>
  <line x1="9" y1="19" x2="23" y2="19" stroke="#a09880" stroke-width="1"/>
  <!-- Spine crack down centre -->
  <line x1="16" y1="11" x2="16" y2="23" stroke="#a09880" stroke-width="0.8" stroke-dasharray="2,1"/>
  <!-- Skull head -->
  <ellipse cx="16" cy="7" rx="7" ry="6" fill="#e8e0c8"/>
  <!-- Eye sockets — dark hollow -->
  <ellipse cx="12.5" cy="6.5" rx="2.5" ry="2.5" fill="#1a1a1a"/>
  <ellipse cx="19.5" cy="6.5" rx="2.5" ry="2.5" fill="#1a1a1a"/>
  <!-- Glowing eye fire -->
  <circle cx="12.5" cy="6.5" r="1.2" fill="#ff4400" opacity="0.8"/>
  <circle cx="19.5" cy="6.5" r="1.2" fill="#ff4400" opacity="0.8"/>
  <!-- Teeth -->
  <path d="M12,10 L13,11 L14,10 L15,11 L16,10 L17,11 L18,10 L19,11 L20,10" stroke="#c8c0a0" stroke-width="0.8" fill="none"/>
  <!-- Left arm (back, massive bone club) -->
  <rect x="1" y="13" width="7" height="5" rx="2" fill="#d4c8a8"/>
  <!-- Right arm (forward, fist) -->
  <rect x="24" y="10" width="7" height="5" rx="2" fill="#d4c8a8"/>
  <rect x="28" y="9" width="4" height="5" rx="1" fill="#e8e0c8"/>
  <!-- Legs stride A -->
  <rect x="8" y="22" width="6" height="9" rx="2" fill="#c8bca0"/>
  <rect x="18" y="23" width="6" height="8" rx="2" fill="#c8bca0"/>
  <!-- Foot bones -->
  <ellipse cx="11" cy="31" rx="4" ry="1.5" fill="#b8b0a0"/>
  <ellipse cx="21" cy="31" rx="4" ry="1.5" fill="#b8b0a0"/>
</svg>
