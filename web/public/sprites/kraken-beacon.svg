<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Kraken Beacon — spawn structure -->
  <!-- Base platform -->
  <rect x="7" y="24" width="18" height="5" rx="1" fill="#334466" stroke="#223355" stroke-width="1"/>
  <!-- Beacon tower -->
  <rect x="13" y="10" width="6" height="15" rx="1" fill="#445577" stroke="#334466" stroke-width="1"/>
  <!-- Tentacle protrusions from base -->
  <path d="M7,27 Q4,24 5,21 Q8,24 7,27 Z" fill="#334466" stroke="#223355" stroke-width="0.7"/>
  <path d="M25,27 Q28,24 27,21 Q24,24 25,27 Z" fill="#334466" stroke="#223355" stroke-width="0.7"/>
  <path d="M10,26 Q8,22 9,19 Q12,23 10,26 Z" fill="#445577" stroke="#334466" stroke-width="0.6"/>
  <path d="M22,26 Q24,22 23,19 Q20,23 22,26 Z" fill="#445577" stroke="#334466" stroke-width="0.6"/>
  <!-- Beacon lamp at top -->
  <ellipse cx="16" cy="9" rx="4" ry="3" fill="#ff6633" stroke="#cc3311" stroke-width="0.8"/>
  <ellipse cx="16" cy="8" rx="3" ry="2" fill="#ffaa66" opacity="0.8"/>
  <!-- Glow beams -->
  <line x1="16" y1="3" x2="16" y2="7" stroke="#ff9944" stroke-width="1.5" opacity="0.6"/>
  <line x1="10" y1="5" x2="14" y2="8" stroke="#ff9944" stroke-width="1" opacity="0.4"/>
  <line x1="22" y1="5" x2="18" y2="8" stroke="#ff9944" stroke-width="1" opacity="0.4"/>
  <!-- Runes on tower -->
  <circle cx="16" cy="14" r="1.5" fill="#6688aa" opacity="0.7"/>
  <circle cx="16" cy="19" r="1.5" fill="#6688aa" opacity="0.7"/>
</svg>
