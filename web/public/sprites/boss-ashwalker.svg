<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ashwalker: ashen grey robes, ember eyes, skeletal -->
  <!-- Robes -->
  <rect x="10" y="14" width="12" height="14" rx="2" fill="#4a4a4a"/>
  <!-- Hood -->
  <rect x="11" y="5" width="10" height="10" rx="3" fill="#3a3a3a"/>
  <!-- Eyes (ember) -->
  <rect x="13" y="9" width="2" height="2" fill="#ff6600"/>
  <rect x="17" y="9" width="2" height="2" fill="#ff6600"/>
  <!-- Robe trim -->
  <rect x="10" y="14" width="12" height="2" fill="#333333"/>
  <!-- Ash hands -->
  <rect x="6" y="17" width="4" height="2" rx="1" fill="#5a5a5a"/>
  <rect x="22" y="17" width="4" height="2" rx="1" fill="#5a5a5a"/>
  <!-- Staff -->
  <rect x="25" y="10" width="2" height="18" rx="1" fill="#666666"/>
  <rect x="23" y="10" width="6" height="3" rx="1" fill="#ff6600"/>
  <!-- Ash particles -->
  <rect x="8" y="22" width="2" height="2" rx="1" fill="#666666" opacity="0.6"/>
  <rect x="22" y="25" width="2" height="2" rx="1" fill="#666666" opacity="0.6"/>
</svg>