<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ground -->
  <ellipse cx="16" cy="29.5" rx="9" ry="2" fill="#7E8299" opacity="0.5"/>
  <!-- Stack-of-books pedestal instead of a bare post -->
  <rect x="9" y="24" width="14" height="4" rx="0.6" fill="#8A6F4D"/>
  <rect x="10" y="20.4" width="12" height="4" rx="0.6" fill="#6E5A3E"/>
  <rect x="11" y="17" width="10" height="3.8" rx="0.6" fill="#8A6F4D"/>
  <!-- Slim brass arm rising from the books -->
  <rect x="15.2" y="10" width="1.6" height="7.4" rx="0.7" fill="#454E6B"/>
  <path d="M11,10.4 L16,9 L21,10.4" stroke="#7E8299" stroke-width="1.4" fill="none"/>
  <!-- Lamp head glow -->
  <circle cx="16" cy="8" r="6.5" fill="#FFB347" opacity="0.18"/>
  <path d="M12,10.5 L20,10.5 L18,6 L14,6 Z" fill="#E8B94A"/>
  <ellipse cx="16" cy="6" rx="2.6" ry="1" fill="#FFE08A"/>
  <!-- Book spine texture -->
  <line x1="12" y1="25" x2="12" y2="27.6" stroke="#B9903F" stroke-width="0.5"/>
  <line x1="16" y1="25" x2="16" y2="27.6" stroke="#B9903F" stroke-width="0.5"/>
  <line x1="20" y1="25" x2="20" y2="27.6" stroke="#B9903F" stroke-width="0.5"/>
</svg>
