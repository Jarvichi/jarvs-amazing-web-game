<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Root Queen — tall woody humanoid with branch crown -->
  <!-- Branch crown -->
  <path d="M12,5 Q10,2 9,1 M14,4 Q13,1 12,0 M16,3 Q16,0 16,0 M18,4 Q19,1 20,0 M20,5 Q22,2 23,1" stroke="#5C3A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="9" cy="2" r="1.5" fill="#228B22"/>
  <circle cx="12" cy="1" r="1.5" fill="#228B22"/>
  <circle cx="16" cy="0" r="1.5" fill="#228B22"/>
  <circle cx="20" cy="1" r="1.5" fill="#228B22"/>
  <circle cx="23" cy="2" r="1.5" fill="#228B22"/>
  <!-- Head -->
  <ellipse cx="16" cy="9" rx="5" ry="5" fill="#7A4A28"/>
  <ellipse cx="16" cy="9" rx="4" ry="4" fill="#9A6A3A"/>
  <!-- Eyes — glowing green -->
  <circle cx="14" cy="8" r="1.2" fill="#90EE90"/>
  <circle cx="14" cy="8" r="0.6" fill="#006400"/>
  <circle cx="18" cy="8" r="1.2" fill="#90EE90"/>
  <circle cx="18" cy="8" r="0.6" fill="#006400"/>
  <!-- Bark texture lines on face -->
  <path d="M14,11 Q16,12 18,11" stroke="#5C3A1A" stroke-width="0.8" fill="none"/>
  <!-- Body — trunk-like -->
  <rect x="12" y="14" width="8" height="10" rx="1" fill="#5C3A1A"/>
  <rect x="13" y="14" width="6" height="10" rx="1" fill="#7A4A28"/>
  <!-- Bark lines on body -->
  <path d="M13,16 Q16,17 19,16" stroke="#5C3A1A" stroke-width="0.7" fill="none"/>
  <path d="M13,19 Q16,20 19,19" stroke="#5C3A1A" stroke-width="0.7" fill="none"/>
  <path d="M13,22 Q16,23 19,22" stroke="#5C3A1A" stroke-width="0.7" fill="none"/>
  <!-- Root arm left -->
  <path d="M12,16 Q7,15 5,17 Q7,18 6,20" stroke="#5C3A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="5" cy="20" r="1.5" fill="#228B22"/>
  <!-- Root arm right -->
  <path d="M20,16 Q25,15 27,17 Q25,18 26,20" stroke="#5C3A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="27" cy="20" r="1.5" fill="#228B22"/>
  <!-- Legs -->
  <rect x="12" y="24" width="4" height="7" rx="1" fill="#5C3A1A"/>
  <rect x="17" y="24" width="4" height="7" rx="1" fill="#5C3A1A"/>
  <!-- Root feet -->
  <path d="M12,30 Q10,32 9,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M16,31 Q16,32 15,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M17,31 Q19,32 20,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M21,30 Q23,32 24,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
