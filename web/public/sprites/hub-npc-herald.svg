<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- shadow -->
  <ellipse cx="16" cy="29" rx="5" ry="2" fill="rgba(0,0,0,0.25)"/>
  <!-- boots -->
  <rect x="11" y="25" width="4" height="3" rx="1" fill="#3a2010"/>
  <rect x="17" y="25" width="4" height="3" rx="1" fill="#3a2010"/>
  <!-- legs -->
  <rect x="12" y="20" width="3" height="6" rx="1" fill="#2a3a8a"/>
  <rect x="17" y="20" width="3" height="6" rx="1" fill="#2a3a8a"/>
  <!-- tabard body -->
  <rect x="10" y="12" width="12" height="9" rx="2" fill="#1a3a9a"/>
  <!-- gold cross emblem -->
  <rect x="15" y="13" width="2" height="7" rx="0" fill="#d4a020"/>
  <rect x="12" y="16" width="8" height="2" rx="0" fill="#d4a020"/>
  <!-- gold shoulder pads -->
  <rect x="8" y="12" width="4" height="3" rx="1" fill="#c8a020"/>
  <rect x="20" y="12" width="4" height="3" rx="1" fill="#c8a020"/>
  <!-- arms -->
  <rect x="8" y="15" width="3" height="7" rx="1" fill="#1a3a9a"/>
  <rect x="21" y="15" width="3" height="7" rx="1" fill="#1a3a9a"/>
  <!-- scroll in right hand -->
  <rect x="22" y="19" width="3" height="5" rx="1" fill="#f0e0b0"/>
  <rect x="22" y="19" width="3" height="1" rx="0" fill="#c8a050"/>
  <rect x="22" y="23" width="3" height="1" rx="0" fill="#c8a050"/>
