  <rect x="12" y="3" width="8" height="5" rx="2" fill="#1a3a9a"/>
  <rect x="10" y="6" width="12" height="2" rx="1" fill="#c8a020"/>
  <!-- hat feather -->
  <rect x="19" y="1" width="2" height="5" rx="1" fill="#f0f8ff"/>
  <!-- eyes -->
  <rect x="13" y="8" width="2" height="2" rx="1" fill="#1a0a00"/>
  <rect x="17" y="8" width="2" height="2" rx="1" fill="#1a0a00"/>
