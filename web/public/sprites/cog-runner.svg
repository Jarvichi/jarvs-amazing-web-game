<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Round brass head / helm -->
  <circle cx="16" cy="8" r="6" fill="#888"/>
  <circle cx="16" cy="8" r="5" fill="#999"/>
  <!-- Gear-tooth helm rim -->
  <path d="M10,8 L9,6 L11,7 L10,5 L13,7 L12,4 L16,6 L20,4 L19,7 L22,5 L21,7 L23,6 L22,8" stroke="#B8860B" stroke-width="1" fill="none"/>
  <!-- Eye -->
  <circle cx="16" cy="8" r="2.5" fill="#222"/>
  <circle cx="16" cy="8" r="1.5" fill="#FF8800"/>
  <circle cx="16" cy="8" r="0.6" fill="#FFD700"/>
  <!-- Compact body -->
  <rect x="12" y="14" width="8" height="8" rx="2" fill="#777"/>
  <rect x="13" y="15" width="6" height="6" fill="#888"/>
  <!-- Spinning gear on back -->
  <circle cx="22" cy="16" r="3" fill="#B8860B"/>
  <circle cx="22" cy="16" r="2" fill="#DAA520"/>
  <circle cx="22" cy="16" r="0.7" fill="#888"/>
  <!-- Exhaust pipe -->
  <rect x="9" y="15" width="3" height="6" rx="1" fill="#666"/>
  <ellipse cx="10.5" cy="14" rx="2" ry="1" fill="#444"/>
  <!-- Legs running low — stride A shown in static -->
  <rect x="11" y="22" width="5" height="8" rx="1" fill="#666"/>
  <rect x="17" y="22" width="5" height="8" rx="1" fill="#666"/>
  <rect x="10" y="28" width="7" height="3" rx="1" fill="#B8860B"/>
  <rect x="16" y="28" width="7" height="3" rx="1" fill="#B8860B"/>
</svg>
