  <!-- Legs (neutral) -->
  <rect x="12.5" y="22" width="3.2" height="7" rx="1" fill="#454E6B"/>
  <rect x="16.3" y="22" width="3.2" height="7" rx="1" fill="#454E6B"/>
  <rect x="11.5" y="27.4" width="5.2" height="2.8" rx="1" fill="#3A3F55"/>
  <rect x="16" y="27.4" width="5.2" height="2.8" rx="1" fill="#3A3F55"/>
</svg>
