<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bare-faced scholar's cap, no helm -->
  <circle cx="16" cy="9" r="4.6" fill="#E3D9CF"/>
  <path d="M11.5,7.5 L20.5,7.5 L16,4.5 Z" fill="#7E8299"/>
  <circle cx="14.6" cy="9.2" r="0.6" fill="#2B2F3E"/>
  <circle cx="17.4" cy="9.2" r="0.6" fill="#2B2F3E"/>
  <!-- Light leather jerkin, not plate -->
  <path d="M12,13.5 L11.5,22 L20.5,22 L20,13.5 Q16,15.4 12,13.5 Z" fill="#7E8299"/>
  <rect x="12.3" y="16.5" width="7.4" height="1" fill="#5E6A8C"/>
  <!-- Single ledger clipped to a belt loop, not a full shield -->
