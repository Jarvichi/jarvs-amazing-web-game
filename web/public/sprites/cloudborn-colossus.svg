<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cloud wisps around head -->
  <ellipse cx="10" cy="7" rx="4" ry="2.5" fill="#E8F4FF" opacity="0.7"/>
  <ellipse cx="22" cy="7" rx="4" ry="2.5" fill="#E8F4FF" opacity="0.7"/>
  <ellipse cx="16" cy="5" rx="5" ry="2.5" fill="#E8F4FF" opacity="0.8"/>
  <!-- Large head -->
  <ellipse cx="16" cy="9" rx="7" ry="6" fill="#B0C4DE"/>
  <ellipse cx="16" cy="9" rx="6" ry="5" fill="#C5D8F0"/>
  <!-- Eyes glowing blue -->
  <circle cx="13" cy="8" r="1.8" fill="#4A90D9"/>
  <circle cx="19" cy="8" r="1.8" fill="#4A90D9"/>
  <circle cx="13" cy="8" r="0.9" fill="#87CEEB"/>
  <circle cx="19" cy="8" r="0.9" fill="#87CEEB"/>
  <!-- Mouth grim line -->
  <path d="M13,12 L16,11 L19,12" stroke="#778899" stroke-width="0.8" fill="none"/>
  <!-- Thick neck -->
  <rect x="13" y="15" width="6" height="3" rx="1" fill="#B0C4DE"/>
  <!-- Huge body -->
  <rect x="6" y="18" width="20" height="11" rx="3" fill="#778899"/>
  <rect x="7" y="19" width="18" height="9" fill="#8899AA"/>
  <!-- Cloud pattern on chest -->
  <ellipse cx="12" cy="22" rx="3" ry="2" fill="#B0C4DE" opacity="0.6"/>
  <ellipse cx="20" cy="22" rx="3" ry="2" fill="#B0C4DE" opacity="0.6"/>
  <ellipse cx="16" cy="21" rx="3" ry="2" fill="#C5D8F0" opacity="0.5"/>
  <!-- Shoulder plates -->
  <rect x="2"  y="18" width="5" height="8" rx="2" fill="#4682B4"/>
  <rect x="25" y="18" width="5" height="8" rx="2" fill="#4682B4"/>
  <!-- Arms -->
  <rect x="2"  y="25" width="5" height="6" rx="1" fill="#778899"/>
  <rect x="25" y="25" width="5" height="6" rx="1" fill="#778899"/>
  <!-- Fists -->
  <rect x="1"  y="29" width="6" height="3" rx="2" fill="#556B82"/>
  <rect x="25" y="29" width="6" height="3" rx="2" fill="#556B82"/>
  <!-- Legs -->
  <rect x="8"  y="29" width="6" height="3" rx="1" fill="#778899"/>
  <rect x="18" y="29" width="6" height="3" rx="1" fill="#778899"/>
</svg>
