<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Electric crown / sparking hair -->
  <path d="M12,8 Q14,3 16,5 Q18,3 20,8" fill="#FFD700"/>
  <path d="M13,8 L12,5 L14,7 L13,4 L15,6 L16,3 L17,6 L19,4 L18,7 L20,5 L19,8" stroke="#FFFF00" stroke-width="0.8" fill="none"/>
  <!-- Head -->
  <ellipse cx="16" cy="10" rx="5" ry="5" fill="#c8a060"/>
  <!-- Glowing yellow eyes -->
  <circle cx="14" cy="9.5" r="1" fill="#FFD700"/>
  <circle cx="18" cy="9.5" r="1" fill="#FFD700"/>
  <circle cx="14" cy="9.5" r="0.4" fill="#333"/>
  <circle cx="18" cy="9.5" r="0.4" fill="#333"/>
  <!-- Electric-blue body armour -->
  <path d="M11,15 L11,22 L21,22 L21,15 Q16,18 11,15 Z" fill="#1A3A6A"/>
  <!-- Lightning bolt on chest -->
  <path d="M17,15 L14,19 L16,19 L13,22 L18,17 L16,17 Z" fill="#FFD700"/>
  <!-- Belt -->
  <rect x="11" y="20" width="10" height="2" fill="#0A1A4A"/>
  <!-- Charged bow -->
  <path d="M5,8 Q1,15 5,22" stroke="#3A6AFF" stroke-width="2.5" fill="none"/>
  <line x1="5" y1="8" x2="5" y2="22" stroke="#FFD700" stroke-width="0.8"/>
  <!-- Lightning arrow -->
  <line x1="5" y1="15" x2="13" y2="15" stroke="#FFD700" stroke-width="2"/>
  <path d="M12,15 L10,13 L13,14 L11,12 L14,15 L11,15 L13,17 Z" fill="#FFFF00"/>
  <!-- Quiver with electric glow -->
  <rect x="21" y="13" width="3" height="8" rx="1" fill="#1A3A6A"/>
  <line x1="22" y1="12" x2="22" y2="14" stroke="#FFD700" stroke-width="1"/>
  <line x1="23.5" y1="12" x2="23.5" y2="14" stroke="#FFD700" stroke-width="1"/>
  <!-- Legs -->
  <rect x="11" y="22" width="5" height="8" rx="1" fill="#0A1A4A"/>
  <rect x="17" y="22" width="5" height="8" rx="1" fill="#0A1A4A"/>
  <rect x="10" y="28" width="7" height="3" rx="1" fill="#1A3A6A"/>
  <rect x="16" y="28" width="7" height="3" rx="1" fill="#1A3A6A"/>
</svg>
