<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Arcane Conduit — static building -->
  <!-- Base platform -->
  <rect x="8" y="24" width="16" height="4" rx="1" fill="#5577aa" stroke="#334466" stroke-width="1"/>
  <!-- Tower body -->
  <rect x="11" y="12" width="10" height="13" rx="1" fill="#6688bb" stroke="#334466" stroke-width="1"/>
  <!-- Crystal top cap -->
  <polygon points="16,4 21,12 11,12" fill="#99ccff" stroke="#5599cc" stroke-width="1"/>
  <!-- Inner crystal glow -->
  <polygon points="16,7 19,12 13,12" fill="#cce8ff" opacity="0.8"/>
  <!-- Barrel / emitter -->
  <rect x="20" y="15" width="6" height="3" rx="1" fill="#88aadd" stroke="#334466" stroke-width="0.8"/>
  <!-- Energy gem on barrel tip -->
  <polygon points="26,15 29,16.5 26,18" fill="#aaddff" stroke="#5599cc" stroke-width="0.6"/>
  <!-- Rune lines on tower -->
  <line x1="13" y1="16" x2="19" y2="16" stroke="#aad4ff" stroke-width="0.6" opacity="0.7"/>
  <line x1="13" y1="19" x2="19" y2="19" stroke="#aad4ff" stroke-width="0.6" opacity="0.7"/>
  <line x1="13" y1="22" x2="19" y2="22" stroke="#aad4ff" stroke-width="0.6" opacity="0.7"/>
</svg>
