<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Low-slung root creature — head at front -->
  <!-- Body (elongated like a crawler) -->
  <ellipse cx="18" cy="20" rx="10" ry="6" fill="#5C3A1A"/>
  <ellipse cx="18" cy="19" rx="8" ry="5" fill="#7A4A28"/>
  <!-- Root tendrils on top -->
  <path d="M13,15 Q11,10 9,8 Q10,10 11,9" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M16,14 Q15,9 14,6" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M20,14 Q21,8 23,6 Q21,9 22,8" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Green leaf tips -->
  <circle cx="9" cy="8" r="2" fill="#228B22"/>
  <circle cx="14" cy="6" r="2" fill="#228B22"/>
  <circle cx="23" cy="6" r="2" fill="#228B22"/>
  <!-- Head end (right) -->
  <ellipse cx="27" cy="19" rx="4" ry="4" fill="#5C3A1A"/>
  <ellipse cx="27" cy="19" rx="3.5" ry="3" fill="#7A4A28"/>
  <!-- Mouth/mandibles -->
  <path d="M28,20 L31,18 M28,22 L31,22" stroke="#3A2010" stroke-width="1.2"/>
  <!-- Eyes -->
  <circle cx="26" cy="17" r="1.2" fill="#90EE90"/>
  <circle cx="26" cy="17" r="0.6" fill="#333"/>
  <!-- Root legs under body -->
  <path d="M12,24 L10,29" stroke="#5C3A1A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M16,25 L15,30" stroke="#5C3A1A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20,25 L20,30" stroke="#5C3A1A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24,24 L25,29" stroke="#5C3A1A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M8,21 Q4,19 3,16" stroke="#5C3A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
