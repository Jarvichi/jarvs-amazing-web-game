<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ground -->
  <ellipse cx="16" cy="29.5" rx="11" ry="2" fill="#7E8299" opacity="0.5"/>
  <!-- Alcove shelving with a carved watcher face, not a freestanding statue -->
  <rect x="3" y="10" width="26" height="19" rx="1" fill="#9FA3BC"/>
  <path d="M3,10 L16,4 L29,10 Z" fill="#454E6B"/>
  <!-- Shelf compartments either side of the central face -->
  <rect x="5" y="13" width="6" height="4" fill="#7E8299"/>
  <rect x="5" y="18.5" width="6" height="4" fill="#454E6B"/>
  <rect x="5" y="24" width="6" height="3.6" fill="#7E8299"/>
  <rect x="21" y="13" width="6" height="4" fill="#454E6B"/>
  <rect x="21" y="18.5" width="6" height="4" fill="#7E8299"/>
  <rect x="21" y="24" width="6" height="3.6" fill="#454E6B"/>
  <!-- Vellum spines on the shelves -->
  <line x1="6.5" y1="13" x2="6.5" y2="17" stroke="#F2E9D8" stroke-width="0.5"/>
  <line x1="8" y1="13" x2="8" y2="17" stroke="#F2E9D8" stroke-width="0.5"/>
  <line x1="9.5" y1="13" x2="9.5" y2="17" stroke="#F2E9D8" stroke-width="0.5"/>
  <line x1="22.5" y1="24" x2="22.5" y2="27.6" stroke="#F2E9D8" stroke-width="0.5"/>
  <line x1="24" y1="24" x2="24" y2="27.6" stroke="#F2E9D8" stroke-width="0.5"/>
  <line x1="25.5" y1="24" x2="25.5" y2="27.6" stroke="#F2E9D8" stroke-width="0.5"/>
  <!-- Carved stone watcher face set into the central pillar -->
  <rect x="12.5" y="11" width="7" height="18" rx="1" fill="#C9CBDA"/>
  <circle cx="16" cy="16" r="3" fill="#A6A9C0"/>
  <path d="M14.2,15.6 Q16,14.6 17.8,15.6" stroke="#454E6B" stroke-width="0.6" fill="none"/>
  <circle cx="14.8" cy="16" r="0.5" fill="#3A3F55"/>
  <circle cx="17.2" cy="16" r="0.5" fill="#3A3F55"/>
  <!-- Carved rune tallies, faintly glowing -->
  <rect x="14" y="20" width="4" height="1.1" rx="0.5" fill="#FFB347" opacity="0.85"/>
  <rect x="14" y="23.5" width="4" height="1.1" rx="0.5" fill="#FFB347" opacity="0.7"/>
  <!-- Rune glow -->
  <ellipse cx="16" cy="19" rx="4" ry="8" fill="#FFB347" opacity="0.12"/>
  <!-- Mist -->
  <ellipse cx="16" cy="28.6" rx="9" ry="1.4" fill="#E8EAF4" opacity="0.4"/>
</svg>
