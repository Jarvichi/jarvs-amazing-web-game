<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Company courier on foot, leaning into a sprint -->
  <!-- Satchel swinging behind -->
  <rect x="6" y="12" width="6.5" height="6" rx="1.2" fill="#5E6A8C"/>
  <path d="M6,12 H12.5 L11.5,14.6 H7 Z" fill="#454E6B"/>
  <circle cx="9.2" cy="15.4" r="0.8" fill="#E8B94A"/>
  <!-- Torso, pitched forward -->
  <rect x="11" y="9.5" width="7.5" height="9.5" rx="2.2" fill="#454E6B" transform="rotate(14 14.7 14.2)"/>
  <rect x="12" y="15" width="6.5" height="1.4" fill="#E8B94A" transform="rotate(14 15 15.7)"/>
  <!-- Head with peaked messenger cap -->
  <circle cx="17.2" cy="7" r="3.3" fill="#E3D9CF"/>
  <path d="M13.6,6.6 Q17.4,2 21.2,6.2 L24.2,7 L21,7.6 Q17.4,5 13.6,7.8 Z" fill="#2B2F3E"/>
  <circle cx="18.6" cy="7.4" r="0.6" fill="#2B2F3E"/>
  <!-- Arm thrust forward holding a bell-lantern -->
  <rect x="18" y="11.4" width="7.5" height="2.2" rx="1.1" fill="#454E6B" transform="rotate(8 18 12.5)"/>
  <circle cx="27" cy="16" r="4.2" fill="#FFB347" opacity="0.18"/>
  <rect x="25.2" y="13.6" width="3.6" height="5" rx="1.4" fill="#E8B94A"/>
  <rect x="26.2" y="12.4" width="1.6" height="1.4" fill="#2B2F3E"/>
  <circle cx="27" cy="16.2" r="0.9" fill="#FFE08A"/>
  <!-- Legs mid-stride -->
  <rect x="12.5" y="19" width="3.2" height="8.5" rx="1.2" fill="#2B2F3E" transform="rotate(-10 14 19)"/>
  <rect x="16.5" y="19" width="3.2" height="7" rx="1.2" fill="#3A3F55" transform="rotate(26 18 19)"/>
  <rect x="9.5" y="26.4" width="5.4" height="2.6" rx="1" fill="#2B2F3E"/>
  <rect x="19.6" y="24.6" width="5" height="2.6" rx="1" fill="#3A3F55"/>
</svg>
