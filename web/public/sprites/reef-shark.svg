<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Reef Shark — static -->
  <!-- Body torpedo shape -->
  <ellipse cx="16" cy="17" rx="12" ry="5" fill="#558899" stroke="#336677" stroke-width="1"/>
  <ellipse cx="14" cy="15" rx="9" ry="3" fill="#6699aa" opacity="0.5"/>
  <!-- Dorsal fin -->
  <polygon points="16,12 14,17 18,17" fill="#447788" stroke="#335566" stroke-width="0.8"/>
  <!-- Tail fin -->
  <polygon points="4,17 2,13 2,21" fill="#447788" stroke="#335566" stroke-width="0.8"/>
  <!-- Pectoral fins -->
  <polygon points="14,18 11,22 16,20" fill="#558899" stroke="#336677" stroke-width="0.7"/>
  <polygon points="18,18 21,22 16,20" fill="#558899" stroke="#336677" stroke-width="0.7"/>
  <!-- Eye -->
  <circle cx="24" cy="16" r="1.5" fill="#111" stroke="#aacccc" stroke-width="0.5"/>
  <circle cx="24.3" cy="15.7" r="0.5" fill="#fff" opacity="0.6"/>
  <!-- Mouth line -->
  <path d="M26,17 Q27,18 26,19" fill="none" stroke="#335566" stroke-width="0.8"/>
  <!-- Belly lighter tone -->
  <ellipse cx="16" cy="19" rx="10" ry="2" fill="#aacccc" opacity="0.3"/>
</svg>
