<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ground -->
  <ellipse cx="16" cy="29.5" rx="10" ry="2" fill="#7E8299" opacity="0.5"/>
  <!-- Crossbar the effigy is lashed to, arms spread wide -->
  <rect x="4" y="14" width="24" height="1.8" rx="0.6" fill="#8A6F4D"/>
  <rect x="15" y="10" width="2" height="19" rx="0.6" fill="#8A6F4D"/>
  <!-- Straw-stuffed sleeves along the crossbar -->
  <path d="M4,13 L11,14 L11,16.5 L4,16.5 Z" fill="#D9C27E"/>
  <path d="M21,14 L28,13 L28,16.5 L21,16.5 Z" fill="#D9C27E"/>
  <line x1="6" y1="14.2" x2="5" y2="12" stroke="#B9903F" stroke-width="0.5"/>
  <line x1="8.5" y1="14.2" x2="8" y2="12" stroke="#B9903F" stroke-width="0.5"/>
  <line x1="23.5" y1="14.2" x2="24" y2="12" stroke="#B9903F" stroke-width="0.5"/>
  <line x1="26" y1="14.2" x2="27" y2="12" stroke="#B9903F" stroke-width="0.5"/>
  <!-- Sackcloth head -->
  <circle cx="16" cy="8" r="3.6" fill="#E8DCA8"/>
  <path d="M12.4,8 Q16,3 19.6,8 L19.6,9.5 Q16,6.5 12.4,9.5 Z" fill="#8A6F4D"/>
  <path d="M14,7.5 L14.8,8.8 M17.2,8.8 L18,7.5" stroke="#3A3F55" stroke-width="0.6"/>
  <path d="M14.5,9.6 Q16,10.4 17.5,9.6" stroke="#3A3F55" stroke-width="0.5" fill="none"/>
  <!-- Straw-stuffed body hanging from the post -->
  <path d="M12.5,16.5 L12,26 Q16,27.6 20,26 L19.5,16.5 Z" fill="#D9C27E"/>
  <!-- Carved gleaning tallies, faintly glowing -->
  <rect x="14.2" y="20" width="3.6" height="1.1" rx="0.5" fill="#FFB347" opacity="0.8"/>
  <rect x="14" y="23" width="4" height="1.1" rx="0.5" fill="#FFB347" opacity="0.7"/>
  <!-- Rune glow -->
  <ellipse cx="16" cy="19" rx="6" ry="9" fill="#FFB347" opacity="0.1"/>
  <!-- Mist -->
  <ellipse cx="16" cy="28.6" rx="8" ry="1.4" fill="#E8EAF4" opacity="0.45"/>
</svg>
