<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Base -->
  <rect x="9" y="26" width="14" height="5" rx="1" fill="#445577"/>
  <!-- Tower body -->
  <rect x="11" y="14" width="10" height="13" rx="1" fill="#4466aa"/>
  <rect x="11" y="14" width="10" height="4" rx="1" fill="#6688cc"/>
  <!-- Mana channel lines on tower -->
  <line x1="14" y1="18" x2="14" y2="26" stroke="#00aaff" stroke-width="0.8" opacity="0.8"/>
  <line x1="18" y1="18" x2="18" y2="26" stroke="#00aaff" stroke-width="0.8" opacity="0.8"/>
  <!-- Battlements -->
  <rect x="10" y="11" width="4" height="4" rx="0.5" fill="#4466aa"/>
  <rect x="18" y="11" width="4" height="4" rx="0.5" fill="#4466aa"/>
  <rect x="14" y="10" width="4" height="5" rx="0.5" fill="#6688cc"/>
  <!-- Crystal mana orb on top -->
  <circle cx="16" cy="7" r="5" fill="#0066cc" opacity="0.5"/>
  <circle cx="16" cy="7" r="3.5" fill="#2299ff"/>
  <circle cx="16" cy="7" r="2" fill="#66ccff"/>
  <circle cx="15" cy="6" r="1" fill="#aaddff" opacity="0.8"/>
  <!-- Glow rays -->
  <line x1="16" y1="2" x2="16" y2="4" stroke="#66ccff" stroke-width="1" opacity="0.6"/>
  <line x1="21" y1="7" x2="19" y2="7" stroke="#66ccff" stroke-width="1" opacity="0.6"/>
  <line x1="11" y1="7" x2="13" y2="7" stroke="#66ccff" stroke-width="1" opacity="0.6"/>
</svg>
