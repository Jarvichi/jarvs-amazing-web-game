<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Walk frame 1: robed mana drainer, stride A -->
  <!-- Robe -->
  <path d="M11,14 Q9,20 10,28 L22,28 Q23,20 21,14 Z" fill="#1a2a4a"/>
  <!-- Body -->
  <rect x="12" y="13" width="8" height="9" rx="1" fill="#223366"/>
  <!-- Head -->
  <circle cx="16" cy="10" r="4.5" fill="#aac0e0"/>
  <!-- Mana crystal in skull (visible through forehead) -->
  <polygon points="16,7 17.5,10 16,12.5 14.5,10" fill="#44aaff" opacity="0.8"/>
  <!-- Eyes — glowing blue -->
  <circle cx="14" cy="10" r="1.3" fill="#00aaff"/>
  <circle cx="18" cy="10" r="1.3" fill="#00aaff"/>
  <!-- Siphon tube in right hand -->
  <line x1="20" y1="15" x2="26" y2="12" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="12" r="2.5" fill="#00ccff" opacity="0.7"/>
  <circle cx="26" cy="12" r="1.2" fill="#ffffff" opacity="0.8"/>
  <!-- Left arm back -->
  <line x1="12" y1="15" x2="7" y2="18" stroke="#223366" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs stride A -->
  <line x1="13" y1="28" x2="11" y2="32" stroke="#1a2a4a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="19" y1="28" x2="21" y2="32" stroke="#1a2a4a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mana drain particles -->
  <circle cx="23" cy="10" r="0.8" fill="#44ddff" opacity="0.7"/>
  <circle cx="21" cy="8" r="0.6" fill="#44ddff" opacity="0.5"/>
</svg>
