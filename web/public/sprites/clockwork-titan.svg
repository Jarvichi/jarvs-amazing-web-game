<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Large angular head -->
  <rect x="9" y="3" width="14" height="10" rx="2" fill="#555"/>
  <rect x="10" y="4" width="12" height="8" rx="1" fill="#777"/>
  <!-- Eye visor -->
  <rect x="10" y="7" width="12" height="3" rx="1" fill="#222"/>
  <rect x="11" y="7.5" width="10" height="2" fill="#FFD700" opacity="0.9"/>
  <!-- Antenna -->
  <line x1="16" y1="3" x2="16" y2="0" stroke="#B8860B" stroke-width="1.5"/>
  <circle cx="16" cy="0" r="1" fill="#FFD700"/>
  <!-- Thick neck -->
  <rect x="13" y="13" width="6" height="3" fill="#555"/>
  <!-- Massive body -->
  <rect x="7" y="16" width="18" height="11" rx="2" fill="#555"/>
  <rect x="8" y="17" width="16" height="9" fill="#666"/>
  <!-- Chest gear -->
  <circle cx="16" cy="21" r="4" fill="#444"/>
  <circle cx="16" cy="21" r="3" fill="#B8860B"/>
  <circle cx="16" cy="21" r="1.5" fill="#DAA520"/>
  <circle cx="16" cy="21" r="0.6" fill="#222"/>
  <!-- Shoulder guards -->
  <rect x="3" y="16" width="5" height="7" rx="2" fill="#B8860B"/>
  <rect x="24" y="16" width="5" height="7" rx="2" fill="#B8860B"/>
  <!-- Thick arms with fists -->
  <rect x="2" y="22" width="5" height="7" rx="1" fill="#555"/>
  <rect x="25" y="22" width="5" height="7" rx="1" fill="#555"/>
  <rect x="1" y="27" width="6" height="4" rx="2" fill="#444"/>
  <rect x="25" y="27" width="6" height="4" rx="2" fill="#444"/>
  <!-- Belt -->
  <rect x="7" y="27" width="18" height="2" fill="#B8860B"/>
  <!-- Legs -->
  <rect x="9" y="29" width="6" height="3" rx="1" fill="#555"/>
  <rect x="17" y="29" width="6" height="3" rx="1" fill="#555"/>
</svg>
