  <!-- Legs stride A -->
  <rect x="11" y="23" width="4" height="8" rx="1" fill="#2C1654" transform="rotate(-4 13 27)"/>
  <rect x="17" y="23" width="4" height="8" rx="1" fill="#2C1654" transform="rotate(4 19 27)"/>
