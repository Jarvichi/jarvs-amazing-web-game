<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Siege Tower: tall wooden battle tower on wheels -->
  <!-- Wheels -->
  <circle cx="8" cy="29" r="3" fill="#5a3a10" stroke="#333" stroke-width="1.2"/>
  <circle cx="24" cy="29" r="3" fill="#5a3a10" stroke="#333" stroke-width="1.2"/>
  <line x1="8" y1="26" x2="8" y2="32" stroke="#333" stroke-width="1"/>
  <line x1="5" y1="29" x2="11" y2="29" stroke="#333" stroke-width="1"/>
  <line x1="24" y1="26" x2="24" y2="32" stroke="#333" stroke-width="1"/>
  <line x1="21" y1="29" x2="27" y2="29" stroke="#333" stroke-width="1"/>
  <!-- Main tower body -->
  <rect x="9" y="8" width="14" height="20" fill="#8B5a20"/>
  <!-- Wooden planks -->
  <line x1="9" y1="12" x2="23" y2="12" stroke="#6a4010" stroke-width="1"/>
  <line x1="9" y1="16" x2="23" y2="16" stroke="#6a4010" stroke-width="1"/>
  <line x1="9" y1="20" x2="23" y2="20" stroke="#6a4010" stroke-width="1"/>
  <line x1="9" y1="24" x2="23" y2="24" stroke="#6a4010" stroke-width="1"/>
  <!-- Battlements on top -->
  <rect x="9" y="4" width="3" height="4" fill="#8B5a20"/>
  <rect x="15" y="4" width="3" height="4" fill="#8B5a20"/>
  <rect x="21" y="4" width="3" height="4" fill="#8B5a20"/>
  <rect x="9" y="6" width="14" height="2" fill="#9a6a2a"/>
  <!-- Archer window -->
  <rect x="14" y="14" width="4" height="5" rx="1" fill="#3a2010"/>
  <!-- Reinforcing iron bolts -->
  <circle cx="11" cy="10" r="0.8" fill="#666"/>
  <circle cx="21" cy="10" r="0.8" fill="#666"/>
  <circle cx="11" cy="22" r="0.8" fill="#666"/>
  <circle cx="21" cy="22" r="0.8" fill="#666"/>
</svg>
