<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Graveblight Tower: tall dark necromantic spire -->
  <!-- Base foundation -->
  <rect x="8" y="26" width="16" height="5" rx="1" fill="#2a2a2a"/>
  <!-- Tower body -->
  <rect x="10" y="10" width="12" height="17" rx="1" fill="#1a1a2a"/>
  <!-- Bone inlays on tower -->
  <line x1="16" y1="11" x2="16" y2="26" stroke="#3a3a4a" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Skull decorations on wall -->
  <ellipse cx="16" cy="15" rx="2.5" ry="2" fill="#c8c0a0"/>
  <ellipse cx="14.5" cy="14.5" rx="1" ry="1" fill="#1a1a1a"/>
  <ellipse cx="17.5" cy="14.5" rx="1" ry="1" fill="#1a1a1a"/>
  <path d="M14.5,16 L15.5,17 L16,16.5 L16.5,17 L17.5,16" stroke="#888" stroke-width="0.6" fill="none"/>
  <!-- Upper spire -->
  <polygon points="16,2 11,10 21,10" fill="#2a2a3a"/>
  <line x1="16" y1="2" x2="16" y2="10" stroke="#4a4a5a" stroke-width="0.5"/>
  <!-- Soul vents on tower sides -->
  <rect x="10" y="18" width="3" height="4" rx="0.5" fill="#0a0a0a"/>
  <rect x="19" y="18" width="3" height="4" rx="0.5" fill="#0a0a0a"/>
  <!-- Soul flame in windows -->
  <ellipse cx="11.5" cy="20" rx="1" ry="1.5" fill="#8800cc" opacity="0.7"/>
  <ellipse cx="20.5" cy="20" rx="1" ry="1.5" fill="#8800cc" opacity="0.7"/>
  <!-- Dark aura at base -->
  <ellipse cx="16" cy="30" rx="12" ry="2" fill="#1a001a" opacity="0.4"/>
</svg>
