<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tide Sprite — static (small flying water spirit) -->
  <!-- Body: teardrop shape -->
  <ellipse cx="16" cy="16" rx="5" ry="6" fill="#44aadd" stroke="#2277aa" stroke-width="1"/>
  <ellipse cx="16" cy="14" rx="3" ry="3.5" fill="#88ccee" opacity="0.7"/>
  <!-- Eyes -->
  <circle cx="14" cy="14" r="1.5" fill="#003355"/>
  <circle cx="18" cy="14" r="1.5" fill="#003355"/>
  <circle cx="14.4" cy="13.6" r="0.5" fill="#fff" opacity="0.8"/>
  <circle cx="18.4" cy="13.6" r="0.5" fill="#fff" opacity="0.8"/>
  <!-- Water wisps / wings -->
  <path d="M11,14 Q8,10 10,8 Q13,12 11,14 Z" fill="#66bbdd" opacity="0.7" stroke="#2277aa" stroke-width="0.5"/>
  <path d="M21,14 Q24,10 22,8 Q19,12 21,14 Z" fill="#66bbdd" opacity="0.7" stroke="#2277aa" stroke-width="0.5"/>
  <!-- Water droplet tail -->
  <polygon points="16,22 14,26 18,26" fill="#44aadd" stroke="#2277aa" stroke-width="0.8"/>
</svg>
