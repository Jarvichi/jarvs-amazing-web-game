<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bare head, no hood -->
  <circle cx="16" cy="10" r="4.4" fill="#E3D9CF"/>
  <circle cx="15" cy="10.4" r="0.6" fill="#2B2F3E"/>
  <circle cx="17.3" cy="10.4" r="0.6" fill="#2B2F3E"/>
  <!-- Ledger balanced flat on top of the head -->
  <rect x="11.5" y="4.4" width="9" height="1.8" rx="0.3" fill="#F2E9D8"/>
  <rect x="12" y="2.8" width="8" height="1.6" rx="0.3" fill="#E3D9CF"/>
  <!-- Slim compact body -->
  <path d="M12.5,14.4 L12,22 L20,22 L19.5,14.4 Q16,16.2 12.5,14.4 Z" fill="#A6A9C0"/>
  <rect x="13" y="17.4" width="6" height="1.1" fill="#454E6B"/>
  <!-- Loose scrolls juggled either side, mid-toss -->
  <rect x="6" y="11" width="4.2" height="1.7" rx="0.6" fill="#F2E9D8" transform="rotate(-30 8.1 11.9)"/>
  <rect x="21.8" y="8.6" width="4.2" height="1.7" rx="0.6" fill="#E3D9CF" transform="rotate(25 23.9 9.5)"/>
  <rect x="8.5" y="19" width="4.2" height="1.7" rx="0.6" fill="#F2E9D8" transform="rotate(20 10.6 19.9)"/>
  <!-- Legs (neutral, quick stance) -->
  <rect x="12.3" y="22" width="3.2" height="6.8" rx="1" fill="#2B2F3E"/>
  <rect x="16.5" y="22" width="3.2" height="6.8" rx="1" fill="#2B2F3E"/>
  <rect x="11.3" y="27.2" width="5.2" height="2.8" rx="1" fill="#3A3F55"/>
  <rect x="16" y="27.2" width="5.2" height="2.8" rx="1" fill="#3A3F55"/>
</svg>
