<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Root Walker — bipedal plant creature, smaller than root queen -->
  <!-- Twig antennae -->
  <path d="M14,5 Q12,2 11,1" stroke="#5C3A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M18,5 Q20,2 21,1" stroke="#5C3A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="11" cy="1" r="1.5" fill="#228B22"/>
  <circle cx="21" cy="1" r="1.5" fill="#228B22"/>
  <!-- Head -->
  <ellipse cx="16" cy="9" rx="4.5" ry="4.5" fill="#5C3A1A"/>
  <ellipse cx="16" cy="9" rx="3.5" ry="3.5" fill="#7A4A28"/>
  <circle cx="14.5" cy="8" r="1" fill="#90EE90"/>
  <circle cx="14.5" cy="8" r="0.5" fill="#333"/>
  <circle cx="17.5" cy="8" r="1" fill="#90EE90"/>
  <circle cx="17.5" cy="8" r="0.5" fill="#333"/>
  <!-- Mouth -->
  <path d="M14,11 Q16,12 18,11" stroke="#3A2010" stroke-width="0.8" fill="none"/>
  <!-- Body -->
  <rect x="12" y="14" width="8" height="9" rx="2" fill="#5C3A1A"/>
  <rect x="13" y="15" width="6" height="7" rx="1" fill="#7A4A28"/>
  <!-- Vine wrap -->
  <path d="M12,16 Q16,17 20,16" stroke="#228B22" stroke-width="0.8" fill="none"/>
  <path d="M12,19 Q16,20 20,19" stroke="#228B22" stroke-width="0.8" fill="none"/>
  <!-- Twig arms -->
  <path d="M12,16 Q8,14 6,16" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M20,16 Q24,14 26,16" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="12" y="23" width="4" height="8" rx="1" fill="#5C3A1A"/>
  <rect x="17" y="23" width="4" height="8" rx="1" fill="#5C3A1A"/>
  <!-- Root feet -->
  <path d="M12,30 Q10,32 9,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M16,31 Q16,32 15,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M17,31 Q19,32 20,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M21,30 Q23,32 24,32" stroke="#5C3A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
