<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Hood/head -->
  <ellipse cx="16" cy="5" rx="5" ry="5" fill="#445577"/>
  <ellipse cx="16" cy="4" rx="4" ry="3" fill="#667799"/>
  <!-- Eyes -->
  <rect x="13" y="5" width="2" height="1.5" rx="0.5" fill="#88ddff"/>
  <rect x="17" y="5" width="2" height="1.5" rx="0.5" fill="#88ddff"/>
  <!-- Collar -->
  <rect x="13" y="10" width="6" height="3" rx="1" fill="#334466"/>
  <!-- Body -->
  <rect x="11" y="13" width="10" height="11" rx="1" fill="#445577"/>
  <rect x="11" y="13" width="10" height="4" rx="1" fill="#667799"/>
  <!-- Belt -->
  <rect x="11" y="22" width="10" height="2" fill="#223355"/>
  <!-- Left arm -->
  <rect x="7" y="13" width="4" height="9" rx="1" fill="#445577"/>
  <!-- Right arm holding sword -->
  <rect x="21" y="11" width="4" height="9" rx="1" fill="#445577"/>
  <!-- Sword blade (glowing) -->
  <rect x="23" y="2" width="2" height="12" rx="1" fill="#aaddff"/>
  <rect x="23.5" y="2" width="1" height="12" rx="0.5" fill="#ffffff" opacity="0.7"/>
  <!-- Crossguard -->
  <rect x="20" y="12" width="8" height="2" rx="1" fill="#88aacc"/>
  <!-- Legs -->
  <rect x="12" y="24" width="4" height="8" rx="1" fill="#334466"/>
  <rect x="17" y="24" width="4" height="8" rx="1" fill="#334466"/>
</svg>
