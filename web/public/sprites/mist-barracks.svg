<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ground fog pooling around the barrow -->
  <ellipse cx="16" cy="29.5" rx="13" ry="2" fill="#7E8299" opacity="0.4"/>
  <!-- Sunken earthen barrow, half-swallowed by the marsh -->
  <path d="M3,27 Q3,16 16,13 Q29,16 29,27 Z" fill="#6B7290"/>
  <path d="M3,27 Q3,16 16,13 Q29,16 29,27" fill="none" stroke="#4A5170" stroke-width="0.8"/>
  <!-- Turf/moss cap along the ridge -->
  <path d="M6,17 Q16,10.5 26,17 L24.5,18.5 Q16,13 7.5,18.5 Z" fill="#5B6E5E"/>
  <!-- Low lintel entrance, unlit -->
  <path d="M11.5,27 L11.5,20 Q16,17.5 20.5,20 L20.5,27 Z" fill="#2C2F40"/>
  <path d="M11.5,20 Q16,17.5 20.5,20" fill="none" stroke="#454E6B" stroke-width="1"/>
  <!-- Standing stone markers either side of the door -->
  <rect x="8" y="21" width="2" height="7" rx="0.6" fill="#5E6A8C"/>
  <rect x="22" y="21" width="2" height="7" rx="0.6" fill="#5E6A8C"/>
  <!-- Tattered muster banner, hung limp -->
  <rect x="15.4" y="12" width="1.2" height="6" fill="#454E6B"/>
  <path d="M16.6,12.5 L21,13.5 L18.5,15.5 L21,17 L16.6,17.5 Z" fill="#8A8FA8" opacity="0.85"/>
  <!-- Mist pouring from the doorway and low ground -->
  <ellipse cx="16" cy="27.5" rx="7" ry="1.6" fill="#E8EAF4" opacity="0.6"/>
  <ellipse cx="9" cy="26.5" rx="4" ry="1.2" fill="#E8EAF4" opacity="0.4"/>
  <ellipse cx="23" cy="26.8" rx="4" ry="1.2" fill="#E8EAF4" opacity="0.4"/>
  <ellipse cx="16" cy="21" rx="3" ry="2.4" fill="#E8EAF4" opacity="0.3"/>
</svg>
