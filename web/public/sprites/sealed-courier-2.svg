<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bounding horse, all four legs gathered beneath -->
  <path d="M5,20 L7,14 Q9,11.5 13,12.5 L21,12.5 Q25,12.5 26,15 L27,19 L25,20 Z" fill="#C9CBDA"/>
  <path d="M24,13 L29,9.5 L30,11.5 L27,15 Z" fill="#C9CBDA"/>
  <circle cx="27.8" cy="11.5" r="0.7" fill="#3A3F55"/>
  <path d="M22,11.5 Q24,9 27,9.6 L25,12.4 Z" fill="#E8EAF4" opacity="0.8"/>
  <!-- Rider crouched low over the neck -->
  <rect x="13" y="6.5" width="6" height="7" rx="2" fill="#454E6B"/>
  <circle cx="16" cy="5" r="3" fill="#E3D9CF"/>
  <path d="M12.9,5 Q16,1 19.1,5 L19.1,6.2 Q16,4 12.9,6.2 Z" fill="#2B2F3E"/>
  <!-- Saddlebags of sealed scroll-tubes, not a slung pole -->
  <path d="M17,13.5 L23,14.2 L22.4,19.5 L16.4,18.8 Z" fill="#8A6F4D"/>
  <circle cx="18.3" cy="15" r="1.1" fill="#F2E9D8"/>
  <circle cx="20.6" cy="15.4" r="1.1" fill="#F2E9D8"/>
  <circle cx="19.4" cy="17.6" r="1.1" fill="#F2E9D8"/>
  <!-- Starburst wax-seal pennant on a short staff -->
  <rect x="19.3" y="3" width="1" height="6" rx="0.4" fill="#454E6B"/>
  <path d="M19.8,2 L21,3.6 L19.8,5.2 L18.6,3.6 Z" fill="#E8B94A"/>
  <!-- Horse legs, all gathered for the bound -->
  <rect x="8" y="19" width="2.2" height="8" rx="1" fill="#A6A9C0" transform="rotate(24 9.1 23)"/>
  <rect x="12" y="20" width="2.2" height="7" rx="1" fill="#A6A9C0" transform="rotate(16 13.1 23.5)"/>
  <rect x="18" y="20" width="2.2" height="7" rx="1" fill="#A6A9C0" transform="rotate(-16 19.1 23.5)"/>
  <rect x="22" y="19" width="2.2" height="8" rx="1" fill="#A6A9C0" transform="rotate(-24 23.1 23)"/>
  <!-- Tail streaming -->
  <path d="M5.5,15 Q1.5,15.5 2,19.5 Q4.5,17.5 6.5,17.5 Z" fill="#E8EAF4" opacity="0.8"/>
</svg>
