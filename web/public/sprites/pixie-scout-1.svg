<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Walk frame 1: wings back-down -->
  <!-- Wings -->
  <ellipse cx="10" cy="14" rx="6" ry="3" fill="#aaeeff" opacity="0.7" transform="rotate(20,10,14)"/>
  <ellipse cx="22" cy="14" rx="6" ry="3" fill="#aaeeff" opacity="0.7" transform="rotate(-20,22,14)"/>
  <!-- Tiny body -->
  <ellipse cx="16" cy="17" rx="3" ry="4" fill="#ff88cc"/>
  <!-- Head -->
  <circle cx="16" cy="11" r="4" fill="#ffccaa"/>
  <!-- Pointed ears -->
  <polygon points="12,9 10,6 14,8" fill="#ffccaa"/>
  <polygon points="20,9 22,6 18,8" fill="#ffccaa"/>
  <!-- Eyes — bright mischievous -->
  <circle cx="14.5" cy="10.5" r="1.2" fill="#22aaff"/>
  <circle cx="17.5" cy="10.5" r="1.2" fill="#22aaff"/>
  <!-- Tiny smile -->
  <path d="M14,13 Q16,14.5 18,13" stroke="#994466" stroke-width="0.8" fill="none"/>
  <!-- Arms reaching forward -->
  <line x1="13" y1="17" x2="9" y2="19" stroke="#ff88cc" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="17" x2="23" y2="15" stroke="#ff88cc" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Sparkle dagger -->
  <line x1="22" y1="13" x2="26" y2="11" stroke="#ffee44" stroke-width="1.5"/>
  <circle cx="26" cy="11" r="1" fill="#ffee44"/>
  <!-- Tiny legs dangling -->
  <line x1="14" y1="21" x2="12" y2="25" stroke="#ff88cc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="21" x2="20" y2="25" stroke="#ff88cc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
