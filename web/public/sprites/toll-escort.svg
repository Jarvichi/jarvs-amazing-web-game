  <!-- Poleaxe, held upright instead of a shield+sword pair -->
  <rect x="23.2" y="4" width="1.6" height="24" rx="0.8" fill="#8A6F4D"/>
  <path d="M24.8,4 L29,6 L27.5,9.5 L24.8,8.5 Z" fill="#C9CBDA"/>
  <path d="M24.8,8.5 L22,9.5 L22.8,11 L24.8,10.4 Z" fill="#7E8299"/>
  <!-- Legs (neutral) -->
  <rect x="12.5" y="23.5" width="3.6" height="6.5" rx="1" fill="#454E6B"/>
  <rect x="16.5" y="23.5" width="3.6" height="6.5" rx="1" fill="#454E6B"/>
  <rect x="11.5" y="28.3" width="5.6" height="2.6" rx="1" fill="#3A3F55"/>
  <rect x="16" y="28.3" width="5.6" height="2.6" rx="1" fill="#3A3F55"/>
</svg>
