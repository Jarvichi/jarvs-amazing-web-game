<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Open-faced warden's sallet, lantern-crested -->
  <circle cx="16" cy="9" r="5" fill="#9FA3BC"/>
  <path d="M11.5,9 Q16,3 20.5,9 L20.5,10.5 L11.5,10.5 Z" fill="#7E8299"/>
  <rect x="15.2" y="2" width="1.6" height="2.6" rx="0.5" fill="#5E6A8C"/>
  <path d="M14.8,1.4 L17.2,1.4 L16.6,3.4 L15.4,3.4 Z" fill="#FFB347" opacity="0.85"/>
  <circle cx="14.2" cy="9.5" r="0.6" fill="#3A3F55"/>
  <circle cx="17.8" cy="9.5" r="0.6" fill="#3A3F55"/>
  <!-- Lean plate body, road-worn -->
  <path d="M11,13.5 L11,23.5 L21,23.5 L21,13.5 Q16,15.7 11,13.5 Z" fill="#9FA3BC"/>
  <rect x="11" y="16.5" width="10" height="1.1" fill="#7E8299"/>
  <circle cx="16" cy="18.5" r="1.4" fill="#FFB347" opacity="0.85"/>
  <!-- Ledger satchel slung on the back, no shield -->
