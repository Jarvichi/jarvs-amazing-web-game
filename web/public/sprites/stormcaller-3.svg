  <circle cx="14.5" cy="7" r="1.2" fill="#74B9FF"/>
  <circle cx="17.5" cy="7" r="1.2" fill="#74B9FF"/>
  <circle cx="14.5" cy="7" r="0.6" fill="#0984E3"/>
  <circle cx="17.5" cy="7" r="0.6" fill="#0984E3"/>
