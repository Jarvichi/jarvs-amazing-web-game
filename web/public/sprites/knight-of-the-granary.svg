<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wide-brimmed harvest helm, no plume -->
  <circle cx="16" cy="9" r="5.5" fill="#9FA3BC"/>
  <ellipse cx="16" cy="9.5" rx="7.5" ry="1.8" fill="#8A6F4D"/>
  <rect x="12" y="8.5" width="8" height="2" fill="#3A3F55"/>
  <circle cx="14" cy="9.5" r="0.7" fill="#FFB347"/>
  <circle cx="18" cy="9.5" r="0.7" fill="#FFB347"/>
  <!-- Broad plate body -->
  <path d="M10,14 L10,24 L22,24 L22,14 Q16,16.5 10,14 Z" fill="#9FA3BC"/>
  <rect x="10" y="17" width="12" height="1.3" fill="#7E8299"/>
  <rect x="10" y="20.5" width="12" height="1.3" fill="#7E8299"/>
  <!-- Granary-sheaf sigil -->
  <circle cx="16" cy="18.8" r="2.1" fill="#D9C27E"/>
  <circle cx="16" cy="18.8" r="1.1" fill="#E8DCA8"/>
  <!-- Woven wicker basket-shield, not a tower shield -->
  <ellipse cx="7" cy="18" rx="3.3" ry="5.2" fill="#D9C27E"/>
  <path d="M4.5,14.5 Q7,15.5 9.5,14.5 M4,17.5 Q7,18.5 10,17.5 M4,20.5 Q7,21.5 10,20.5 M4.5,23 Q7,23.8 9.5,23" stroke="#B9903F" stroke-width="0.6" fill="none"/>
  <!-- Pitchfork instead of a greatsword -->
  <rect x="23.2" y="8" width="1.6" height="19" rx="0.6" fill="#8A6F4D"/>
  <path d="M22.4,4 L22.4,8.5 M24,4 L24,8.5 M25.6,4 L25.6,8.5" stroke="#C9CBDA" stroke-width="1"/>
  <rect x="21.8" y="8" width="4.4" height="1.4" rx="0.5" fill="#7E8299"/>
  <!-- Legs (neutral) -->
  <rect x="11.5" y="24" width="4" height="6.5" rx="1" fill="#6E7F45"/>
  <rect x="16.5" y="24" width="4" height="6.5" rx="1" fill="#6E7F45"/>
  <rect x="10.5" y="28.5" width="6" height="2.8" rx="1" fill="#4E5A32"/>
  <rect x="15.5" y="28.5" width="6" height="2.8" rx="1" fill="#4E5A32"/>
</svg>
