<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Walk frame 1: stride A — huge armored plant golem -->
  <!-- Stone body covered in moss -->
  <rect x="8" y="12" width="16" height="12" rx="3" fill="#4a5a3a"/>
  <!-- Moss patches -->
  <ellipse cx="10" cy="14" rx="3" ry="2" fill="#5a8a30" transform="rotate(-10,10,14)"/>
  <ellipse cx="20" cy="13" rx="3" ry="2" fill="#5a8a30" transform="rotate(15,20,13)"/>
  <ellipse cx="15" cy="21" rx="4" ry="2" fill="#4a7a28"/>
  <!-- Head — stone block with crack -->
  <rect x="10" y="4" width="12" height="9" rx="2" fill="#5a6a4a"/>
  <path d="M15,5 Q16,8 15,12" stroke="#3a4a2a" stroke-width="0.8" fill="none"/>
  <!-- Eyes — glowing ancient -->
  <circle cx="13" cy="8" r="2" fill="#88ff44"/>
  <circle cx="19" cy="8" r="2" fill="#88ff44"/>
  <circle cx="13" cy="8" r="1" fill="#224410"/>
  <circle cx="19" cy="8" r="1" fill="#224410"/>
  <!-- Mouth — stone crack -->
  <path d="M12,11 L14,12 L16,11 L18,12 L20,11" stroke="#2a3a1a" stroke-width="1.2" fill="none"/>
  <!-- Left arm back (massive) -->
  <rect x="2" y="14" width="7" height="5" rx="2" fill="#4a5a3a" transform="rotate(15,2,14)"/>
  <!-- Right arm forward (fist raised) -->
  <rect x="23" y="11" width="7" height="5" rx="2" fill="#4a5a3a" transform="rotate(-20,23,11)"/>
  <!-- Fist -->
  <rect x="27" y="10" width="4" height="4" rx="1" fill="#5a6a4a"/>
  <!-- Legs stride A -->
  <rect x="9" y="23" width="6" height="8" rx="2" fill="#3a4a2a"/>
  <rect x="17" y="24" width="6" height="7" rx="2" fill="#3a4a2a"/>
  <!-- Moss on legs -->
  <ellipse cx="12" cy="25" rx="2.5" ry="1.5" fill="#5a8a30"/>
</svg>
