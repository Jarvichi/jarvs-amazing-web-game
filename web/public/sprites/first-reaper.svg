<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Weathered hood, first of the harvesters -->
  <circle cx="16" cy="9" r="5.5" fill="#9FA3BC"/>
  <path d="M10.5,9 Q16,1.5 21.5,9 L21.5,11.5 Q16,8 10.5,11.5 Z" fill="#5E6A8C"/>
  <circle cx="16" cy="10" r="3" fill="#E3D9CF"/>
  <circle cx="15" cy="10" r="0.7" fill="#3A3F55"/>
  <circle cx="17.5" cy="10" r="0.7" fill="#3A3F55"/>
  <!-- Long weathered cloak -->
  <path d="M10,14 L9,24 L23,24 L22,14 Q16,17 10,14 Z" fill="#9FA3BC"/>
  <path d="M10,14 L9,24 L13,24 L13.5,15.5 Z" fill="#7E8299"/>
  <rect x="11" y="18" width="10" height="1.3" fill="#5E6A8C"/>
  <!-- First sheaf, worn at the belt -->
  <circle cx="16.5" cy="20.6" r="2" fill="#D9C27E"/>
  <circle cx="16.5" cy="20.6" r="1" fill="#E8DCA8"/>
  <!-- Grand sickle arm -->
  <rect x="23" y="14" width="3.5" height="6.5" rx="1" fill="#9FA3BC"/>
  <rect x="24.6" y="6" width="1.6" height="14" rx="0.8" fill="#8A6F4D"/>
  <path d="M25.4,2 Q30.5,4.5 28.5,10.5 Q26.2,7.5 25.4,2 Z" fill="#C9CBDA"/>
  <!-- Off hand holding grain -->
  <rect x="6" y="14" width="3.5" height="6" rx="1" fill="#9FA3BC"/>
  <ellipse cx="6.5" cy="12" rx="2.4" ry="1.4" fill="#D9C27E"/>
  <!-- Legs (neutral) -->
  <rect x="11.5" y="24" width="4" height="6.5" rx="1" fill="#454E6B"/>
  <rect x="16.5" y="24" width="4" height="6.5" rx="1" fill="#454E6B"/>
  <rect x="10.5" y="28.5" width="6" height="2.8" rx="1" fill="#3A3F55"/>
  <rect x="15.5" y="28.5" width="6" height="2.8" rx="1" fill="#3A3F55"/>
</svg>
