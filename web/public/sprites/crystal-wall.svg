<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Main wall body -->
  <rect x="4" y="10" width="24" height="20" rx="1" fill="#5588aa"/>
  <!-- Crystal facets -->
  <rect x="4" y="10" width="24" height="6" rx="1" fill="#77aacc"/>
  <!-- Crystal shard spires on top -->
  <polygon points="7,10 9,3 11,10" fill="#66aacc"/>
  <polygon points="12,10 14,1 16,10" fill="#88ccee"/>
  <polygon points="17,10 19,4 21,10" fill="#66aacc"/>
  <polygon points="22,10 24,2 26,10" fill="#88ccee"/>
  <!-- Facet lines on wall -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#3366aa" stroke-width="0.8"/>
  <line x1="4" y1="22" x2="28" y2="22" stroke="#3366aa" stroke-width="0.8"/>
  <line x1="12" y1="10" x2="12" y2="30" stroke="#3366aa" stroke-width="0.8"/>
  <line x1="20" y1="10" x2="20" y2="30" stroke="#3366aa" stroke-width="0.8"/>
  <!-- Glow highlight on crystal tips -->
  <line x1="9" y1="3" x2="9" y2="5" stroke="#aaddff" stroke-width="1" opacity="0.8"/>
  <line x1="14" y1="1" x2="14" y2="3" stroke="#aaddff" stroke-width="1" opacity="0.8"/>
  <line x1="19" y1="4" x2="19" y2="6" stroke="#aaddff" stroke-width="1" opacity="0.8"/>
  <line x1="24" y1="2" x2="24" y2="4" stroke="#aaddff" stroke-width="1" opacity="0.8"/>
</svg>
