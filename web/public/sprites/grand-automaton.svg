<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tall domed head -->
  <ellipse cx="16" cy="7" rx="7" ry="6" fill="#666"/>
  <ellipse cx="16" cy="7" rx="6" ry="5" fill="#777"/>
  <!-- Tri-lens sensor -->
  <circle cx="12" cy="7" r="2" fill="#222"/>
  <circle cx="16" cy="6" r="2" fill="#222"/>
  <circle cx="20" cy="7" r="2" fill="#222"/>
  <circle cx="12" cy="7" r="1" fill="#00AAFF" opacity="0.9"/>
  <circle cx="16" cy="6" r="1" fill="#FF4400" opacity="0.9"/>
  <circle cx="20" cy="7" r="1" fill="#00AA00" opacity="0.9"/>
  <!-- Thick neck -->
  <rect x="13" y="13" width="6" height="3" fill="#666"/>
  <!-- Grand body — broad chest -->
  <rect x="7" y="16" width="18" height="12" rx="2" fill="#666"/>
  <rect x="8" y="17" width="16" height="10" fill="#777"/>
  <!-- Central power core -->
  <rect x="12" y="18" width="8" height="6" rx="1" fill="#444"/>
  <circle cx="16" cy="21" r="3" fill="#555"/>
  <circle cx="16" cy="21" r="2" fill="#00AAFF" opacity="0.6"/>
  <circle cx="16" cy="21" r="1" fill="#FFFFFF" opacity="0.8"/>
  <!-- Shoulder pylons -->
  <rect x="3"  y="16" width="5" height="9" rx="2" fill="#555"/>
  <rect x="24" y="16" width="5" height="9" rx="2" fill="#555"/>
  <rect x="3"  y="16" width="5" height="3" rx="2" fill="#888"/>
  <rect x="24" y="16" width="5" height="3" rx="2" fill="#888"/>
  <!-- Forearms -->
  <rect x="2"  y="24" width="5" height="6" rx="1" fill="#666"/>
  <rect x="25" y="24" width="5" height="6" rx="1" fill="#666"/>
  <!-- Claw hands -->
  <path d="M2,29 L0,32 M4,30 L3,32 M6,29 L7,32" stroke="#888" stroke-width="1.2"/>
  <path d="M26,29 L25,32 M28,30 L28,32 M30,29 L31,32" stroke="#888" stroke-width="1.2"/>
  <!-- Legs -->
  <rect x="9"  y="28" width="5" height="4" rx="1" fill="#555"/>
  <rect x="18" y="28" width="5" height="4" rx="1" fill="#555"/>
</svg>
