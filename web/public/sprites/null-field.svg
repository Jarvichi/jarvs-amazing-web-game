<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Null Field: arcane disruption generator -->
  <!-- Central pylon -->
  <rect x="13" y="14" width="6" height="15" rx="1" fill="#334466"/>
  <polygon points="16,6 12,14 20,14" fill="#445588"/>
  <!-- Tip crystal -->
  <polygon points="16,3 14,6 18,6" fill="#88aaee"/>
  <!-- Orbiting crystal rings -->
  <ellipse cx="16" cy="18" rx="11" ry="4" fill="none" stroke="#4466aa" stroke-width="1.5" opacity="0.7" transform="rotate(-20,16,18)"/>
  <ellipse cx="16" cy="18" rx="11" ry="4" fill="none" stroke="#6688cc" stroke-width="1" opacity="0.5" transform="rotate(20,16,18)"/>
  <!-- Energy nodes on rings -->
  <circle cx="5" cy="17" r="1.5" fill="#88aaff"/>
  <circle cx="27" cy="19" r="1.5" fill="#88aaff"/>
  <circle cx="16" cy="13" r="1.5" fill="#88aaff"/>
  <!-- Mana acceleration glow (larger) -->
  <circle cx="16" cy="18" r="8" fill="none" stroke="#2244aa" stroke-width="0.8" opacity="0.3"/>
  <!-- Base plate -->
  <rect x="10" y="27" width="12" height="3" rx="1" fill="#223355"/>
  <!-- Power rune -->
  <text x="13" y="22" font-size="5" fill="#88aaff" font-family="monospace">∞</text>
</svg>
