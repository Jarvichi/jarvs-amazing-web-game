<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Crab Shielder — static (large defensive crab acting as wall) -->
  <!-- Big shell body -->
  <ellipse cx="16" cy="18" rx="11" ry="8" fill="#cc5533" stroke="#882211" stroke-width="1.2"/>
  <ellipse cx="16" cy="16" rx="8" ry="5" fill="#dd7755" opacity="0.5"/>
  <!-- Shell segments -->
  <path d="M8,16 Q10,12 16,11 Q22,12 24,16" fill="none" stroke="#aa3311" stroke-width="0.8"/>
  <path d="M7,19 Q10,15 16,14 Q22,15 25,19" fill="none" stroke="#aa3311" stroke-width="0.6"/>
  <!-- Shield claws raised -->
  <path d="M6,17 L2,14 L1,18 L4,20 Z" fill="#bb4422" stroke="#882211" stroke-width="1"/>
  <path d="M26,17 L30,14 L31,18 L28,20 Z" fill="#bb4422" stroke="#882211" stroke-width="1"/>
  <!-- Eye stalks -->
  <line x1="13" y1="11" x2="11" y2="8" stroke="#882211" stroke-width="1.2"/>
  <line x1="19" y1="11" x2="21" y2="8" stroke="#882211" stroke-width="1.2"/>
  <circle cx="11" cy="8" r="2" fill="#333" stroke="#aa3311" stroke-width="0.7"/>
  <circle cx="21" cy="8" r="2" fill="#333" stroke="#aa3311" stroke-width="0.7"/>
  <circle cx="11.4" cy="7.6" r="0.7" fill="#fff" opacity="0.7"/>
  <circle cx="21.4" cy="7.6" r="0.7" fill="#fff" opacity="0.7"/>
  <!-- Legs -->
  <line x1="11" y1="24" x2="8" y2="28" stroke="#882211" stroke-width="1"/>
  <line x1="16" y1="25" x2="14" y2="29" stroke="#882211" stroke-width="1"/>
  <line x1="21" y1="24" x2="24" y2="28" stroke="#882211" stroke-width="1"/>
</svg>
