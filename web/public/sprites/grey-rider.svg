<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Low-slung packhorse, side view, standing -->
  <path d="M4,22 L6,16 Q8,13.5 12,14.5 L20,14.5 Q24,14.5 25.5,17 L26.5,21 L24.5,22 Z" fill="#9FA3BC"/>
  <!-- Horse head, lowered as if scenting the road -->
  <path d="M23,16 L28,15 L28.6,17 L25,19 Z" fill="#9FA3BC"/>
  <circle cx="27" cy="16.4" r="0.6" fill="#3A3F55"/>
  <!-- Solid grey mane, no mist -->
  <path d="M21,13.5 Q23,11.5 25.5,12.5 L23.5,15 Z" fill="#5E6A8C"/>
  <!-- Hooded scout torso, leaning low -->
  <path d="M12,8 L18,7 L18.5,15 L12.5,15 Z" fill="#454E6B"/>
  <path d="M11,8.5 Q14,3.5 17.5,6 L17,8 Q13.5,6.5 11.5,9.5 Z" fill="#3A3F55"/>
  <circle cx="14.2" cy="8.2" r="0.6" fill="#C9CBDA"/>
  <!-- Coiled signal rope slung at the hip -->
  <circle cx="19.5" cy="12.5" r="2" fill="none" stroke="#8A6F4D" stroke-width="1.1"/>
  <!-- Saddlebags of tally-sticks along the flank -->
  <rect x="13" y="17" width="4.5" height="3.6" rx="0.8" fill="#8A6F4D"/>
  <line x1="13.6" y1="17.6" x2="13.6" y2="20" stroke="#C9CBDA" stroke-width="0.5"/>
  <line x1="14.8" y1="17.6" x2="14.8" y2="20" stroke="#C9CBDA" stroke-width="0.5"/>
  <line x1="16" y1="17.6" x2="16" y2="20" stroke="#C9CBDA" stroke-width="0.5"/>
  <!-- Streaming cloak trailing behind -->
  <path d="M11.5,9 Q6,10 5,15 Q9,13 12,12.5 Z" fill="#5E6A8C" opacity="0.9"/>
  <!-- Horse legs (standing) -->
  <rect x="6.5" y="21" width="2.2" height="8.5" rx="1" fill="#7E8299"/>
  <rect x="11" y="21.5" width="2.2" height="8" rx="1" fill="#7E8299"/>
  <rect x="18" y="21.5" width="2.2" height="8" rx="1" fill="#7E8299"/>
  <rect x="22.5" y="21" width="2.2" height="8.5" rx="1" fill="#7E8299"/>
  <!-- Tail -->
  <path d="M4.5,16.5 Q2,18.5 3,22 Q4.5,20 5.5,19.5 Z" fill="#5E6A8C"/>
</svg>
