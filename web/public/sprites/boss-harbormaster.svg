<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Harbormaster: dark navy naval uniform, captain hat, telescope -->
  <!-- Coat -->
  <rect x="9" y="13" width="14" height="13" rx="1" fill="#1a2a4a"/>
  <!-- Gold trim -->
  <rect x="9" y="13" width="14" height="2" fill="#c8a028"/>
  <rect x="9" y="22" width="14" height="2" fill="#c8a028"/>
  <!-- Buttons -->
  <rect x="15" y="15" width="2" height="2" fill="#c8a028"/>
  <rect x="15" y="18" width="2" height="2" fill="#c8a028"/>
  <!-- Captain hat -->
  <rect x="9" y="3" width="14" height="4" rx="1" fill="#0a1a3a"/>
  <rect x="11" y="5" width="10" height="7" rx="2" fill="#1a2a4a"/>
  <!-- Hat badge -->
  <rect x="14" y="4" width="4" height="2" rx="1" fill="#c8a028"/>
  <!-- Eyes -->
  <rect x="13" y="8" width="2" height="2" fill="#aabbcc"/>
  <rect x="17" y="8" width="2" height="2" fill="#aabbcc"/>
  <!-- Telescope -->
  <rect x="22" y="14" width="9" height="3" rx="1" fill="#8a9ba8"/>
  <rect x="28" y="13" width="3" height="5" rx="1" fill="#6d7f8c"/>
  <!-- Legs -->
  <rect x="11" y="26" width="4" height="4" rx="1" fill="#1a2a4a"/>
  <rect x="17" y="26" width="4" height="4" rx="1" fill="#1a2a4a"/>
</svg>