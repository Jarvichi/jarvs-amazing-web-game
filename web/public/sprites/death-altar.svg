<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Death Altar: dark stone sacrificial table with skull -->
  <!-- Base steps -->
  <rect x="4" y="26" width="24" height="4" rx="1" fill="#3a3a3a"/>
  <rect x="6" y="22" width="20" height="4" rx="1" fill="#444"/>
  <!-- Altar slab -->
  <rect x="7" y="16" width="18" height="6" rx="1" fill="#2a2a2a"/>
  <!-- Dark stains on slab -->
  <ellipse cx="13" cy="19" rx="2" ry="1.2" fill="#1a0a0a" opacity="0.8"/>
  <ellipse cx="20" cy="19" rx="2" ry="1.2" fill="#1a0a0a" opacity="0.8"/>
  <!-- Dark candles -->
  <rect x="9" y="10" width="2" height="7" rx="0.5" fill="#333"/>
  <circle cx="10" cy="9.5" r="0.8" fill="#ff8800"/>
  <rect x="21" y="10" width="2" height="7" rx="0.5" fill="#333"/>
  <circle cx="22" cy="9.5" r="0.8" fill="#ff8800"/>
  <!-- Skull centrepiece on altar -->
  <ellipse cx="16" cy="14" rx="4.5" ry="4" fill="#d4cca8"/>
  <!-- Skull eye sockets -->
  <ellipse cx="14" cy="13.5" rx="1.8" ry="1.8" fill="#1a1a1a"/>
  <ellipse cx="18" cy="13.5" rx="1.8" ry="1.8" fill="#1a1a1a"/>
  <!-- Soul fire in sockets -->
  <circle cx="14" cy="13.5" r="0.9" fill="#aa00ff" opacity="0.8"/>
  <circle cx="18" cy="13.5" r="0.9" fill="#aa00ff" opacity="0.8"/>
  <!-- Skull nose -->
  <path d="M15,16 L16,17 L17,16" stroke="#888" stroke-width="0.8" fill="none"/>
  <!-- Dark aura -->
  <ellipse cx="16" cy="20" rx="12" ry="2" fill="#2a002a" opacity="0.3"/>
</svg>
