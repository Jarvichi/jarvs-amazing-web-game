<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Moat: water-filled trench with stone edges -->
  <!-- Stone edges -->
  <rect x="1" y="10" width="30" height="4" rx="1" fill="#777"/>
  <rect x="1" y="20" width="30" height="4" rx="1" fill="#777"/>
  <!-- Water body -->
  <rect x="1" y="14" width="30" height="6" fill="#1a4a8a"/>
  <!-- Water ripples -->
  <path d="M3,16 Q6,15 9,16 Q12,17 15,16 Q18,15 21,16 Q24,17 27,16" stroke="#2a6acc" stroke-width="0.8" fill="none"/>
  <path d="M3,18 Q6,19 9,18 Q12,17 15,18 Q18,19 21,18 Q24,17 27,18" stroke="#3a7add" stroke-width="0.8" fill="none"/>
  <!-- Stone texture on edges -->
  <rect x="2" y="11" width="8" height="2" rx="0" fill="#666" opacity="0.4"/>
  <rect x="12" y="11" width="8" height="2" rx="0" fill="#666" opacity="0.4"/>
  <rect x="22" y="11" width="8" height="2" rx="0" fill="#666" opacity="0.4"/>
  <!-- Lily pad detail -->
  <ellipse cx="8" cy="17" rx="2" ry="1.2" fill="#2a6a28" opacity="0.7"/>
  <ellipse cx="22" cy="17" rx="2" ry="1.2" fill="#2a6a28" opacity="0.7"/>
  <!-- Ground -->
  <rect x="1" y="24" width="30" height="8" rx="0" fill="#5a4a30" opacity="0.2"/>
</svg>
