<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mushroom Circle: ring of mushrooms -->
  <!-- Ground ring -->
  <ellipse cx="16" cy="26" rx="12" ry="3" fill="#3a5a20" opacity="0.5"/>
  <!-- Mushrooms arranged in circle -->
  <!-- Left mushroom -->
  <rect x="5" y="20" width="3" height="7" rx="1" fill="#c8a070"/>
  <ellipse cx="6.5" cy="19" rx="4" ry="2.5" fill="#c04020"/>
  <circle cx="5.5" cy="18" r="0.8" fill="#e8d8c0"/>
  <circle cx="7.5" cy="17.5" r="0.7" fill="#e8d8c0"/>
  <!-- Right mushroom -->
  <rect x="24" y="20" width="3" height="7" rx="1" fill="#c8a070"/>
  <ellipse cx="25.5" cy="19" rx="4" ry="2.5" fill="#c04020"/>
  <circle cx="24.5" cy="18" r="0.8" fill="#e8d8c0"/>
  <circle cx="26.5" cy="17.5" r="0.7" fill="#e8d8c0"/>
  <!-- Centre tall mushroom -->
  <rect x="14" y="14" width="4" height="13" rx="1" fill="#d4b080"/>
  <ellipse cx="16" cy="13" rx="6" ry="3.5" fill="#dd5533"/>
  <circle cx="13.5" cy="12" r="1.2" fill="#e8d8c0"/>
  <circle cx="17" cy="11" r="1.5" fill="#e8d8c0"/>
  <circle cx="19" cy="12.5" r="0.9" fill="#e8d8c0"/>
  <!-- Healing glow -->
  <ellipse cx="16" cy="24" rx="10" ry="2" fill="#88ff44" opacity="0.15"/>
</svg>
