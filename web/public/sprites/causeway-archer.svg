<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mist wisp -->
  <ellipse cx="16" cy="28" rx="9" ry="2" fill="#E8EAF4" opacity="0.3"/>
  <!-- Stone mile marker she shoots from behind -->
  <rect x="3" y="18" width="5" height="11" rx="1" fill="#8A8FA8"/>
  <rect x="3.8" y="20" width="3.4" height="1.4" fill="#5E6A8C"/>
  <path d="M3,18 L5.5,15.5 L8,18 Z" fill="#7E8299"/>
  <!-- Crouched hooded body, low behind the marker -->
  <circle cx="17" cy="14" r="4.4" fill="#5E6A8C"/>
  <path d="M12.6,14 Q17,8 21.4,14 L21.4,15.8 Q17,13.2 12.6,15.8 Z" fill="#454E6B"/>
  <circle cx="17" cy="15" r="2.4" fill="#E3D9CF"/>
  <circle cx="16" cy="15" r="0.6" fill="#3A3F55"/>
  <circle cx="18.3" cy="15" r="0.6" fill="#3A3F55"/>
  <!-- Crouched torso -->
  <path d="M13.5,18 L13.5,25 L20.5,25 L20.5,18 Q17,19.6 13.5,18 Z" fill="#7E8299"/>
  <rect x="13.5" y="21" width="7" height="1.1" fill="#454E6B"/>
  <!-- Quiver of road-markers' worth of arrows -->
  <rect x="20" y="17" width="3" height="7" rx="1" fill="#8A6F4D"/>
  <path d="M20.8,15.6 L21.4,17 L20.2,17 Z" fill="#C9CBDA"/>
  <path d="M22.2,15.6 L22.8,17 L21.6,17 Z" fill="#C9CBDA"/>
  <!-- Low longbow braced over the marker -->
  <rect x="8.5" y="18" width="3.5" height="4.8" rx="1" fill="#7E8299"/>
  <path d="M7.5,13 Q4,20 7.5,27" stroke="#8A6F4D" stroke-width="1.3" fill="none"/>
  <line x1="7.5" y1="13" x2="7.5" y2="27" stroke="#E8EAF4" stroke-width="0.6"/>
  <!-- Crouched legs, tucked low -->
  <rect x="13.5" y="25" width="3.4" height="4" rx="1" fill="#454E6B"/>
  <rect x="17.5" y="25" width="3.4" height="4" rx="1" fill="#454E6B"/>
  <rect x="12.6" y="28.4" width="5.4" height="2.6" rx="1" fill="#3A3F55"/>
  <rect x="17" y="28.4" width="5.4" height="2.6" rx="1" fill="#3A3F55"/>
</svg>
