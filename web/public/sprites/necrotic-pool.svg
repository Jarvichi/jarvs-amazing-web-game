<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Necrotic Pool: glowing dark liquid pool -->
  <!-- Stone basin rim -->
  <ellipse cx="16" cy="20" rx="13" ry="7" fill="#2a2a2a"/>
  <ellipse cx="16" cy="19" rx="12" ry="6" fill="#1a2a0a"/>
  <!-- Liquid surface -->
  <ellipse cx="16" cy="19" rx="10" ry="5" fill="#0a1a08"/>
  <!-- Toxic ripple -->
  <ellipse cx="16" cy="19" rx="7" ry="3.5" fill="none" stroke="#2a6a10" stroke-width="1" opacity="0.7"/>
  <ellipse cx="16" cy="19" rx="4" ry="2" fill="none" stroke="#3a8a18" stroke-width="0.8" opacity="0.5"/>
  <!-- Glowing patches on surface -->
  <ellipse cx="13" cy="18" rx="2" ry="1" fill="#44cc22" opacity="0.3"/>
  <ellipse cx="19" cy="20" rx="2.5" ry="1" fill="#44cc22" opacity="0.3"/>
  <!-- Skull reflection in pool -->
  <ellipse cx="16" cy="19" rx="2" ry="1.5" fill="#aaa888" opacity="0.2"/>
  <!-- Bone floating on surface -->
  <ellipse cx="10" cy="19" rx="2" ry="0.8" fill="#c8c0a0" transform="rotate(-20,10,19)" opacity="0.7"/>
  <!-- Toxic vapour rising -->
  <path d="M12,16 Q11,13 12,11" stroke="#2a6a10" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M20,15 Q21,12 20,10" stroke="#2a6a10" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
