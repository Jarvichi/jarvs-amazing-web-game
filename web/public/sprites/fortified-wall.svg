<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fortified Wall: heavy iron-reinforced stone wall -->
  <!-- Main wall body -->
  <rect x="2" y="12" width="28" height="16" fill="#666"/>
  <!-- Iron reinforcing bands -->
  <rect x="2" y="14" width="28" height="2" fill="#444"/>
  <rect x="2" y="20" width="28" height="2" fill="#444"/>
  <rect x="2" y="26" width="28" height="2" fill="#444"/>
  <!-- Battlements -->
  <rect x="2" y="6" width="5" height="6" fill="#666"/>
  <rect x="10" y="6" width="5" height="6" fill="#666"/>
  <rect x="18" y="6" width="5" height="6" fill="#666"/>
  <rect x="26" y="6" width="4" height="6" fill="#666"/>
  <rect x="2" y="10" width="28" height="2" fill="#555"/>
  <!-- Iron bolts/rivets on reinforcing bands -->
  <circle cx="5" cy="15" r="1" fill="#888"/>
  <circle cx="16" cy="15" r="1" fill="#888"/>
  <circle cx="27" cy="15" r="1" fill="#888"/>
  <circle cx="5" cy="21" r="1" fill="#888"/>
  <circle cx="16" cy="21" r="1" fill="#888"/>
  <circle cx="27" cy="21" r="1" fill="#888"/>
  <!-- Stone texture -->
  <rect x="2" y="17" width="10" height="3" rx="0" fill="#5a5a5a" opacity="0.3"/>
  <rect x="14" y="17" width="10" height="3" rx="0" fill="#5a5a5a" opacity="0.3"/>
  <rect x="7" y="22" width="10" height="3" rx="0" fill="#5a5a5a" opacity="0.3"/>
  <rect x="19" y="22" width="10" height="3" rx="0" fill="#5a5a5a" opacity="0.3"/>
</svg>
