<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Causeway road running under the gate -->
  <rect x="0" y="26" width="32" height="4" fill="#5E6A8C"/>
  <rect x="0" y="27.4" width="32" height="0.6" fill="#9FA3BC" opacity="0.6"/>
  <!-- Twin gatehouse towers flanking the road -->
  <rect x="2" y="10" width="7" height="18" rx="0.8" fill="#9FA3BC"/>
  <rect x="23" y="10" width="7" height="18" rx="0.8" fill="#9FA3BC"/>
  <path d="M1.5,10 L5.5,5 L9.5,10 Z" fill="#454E6B"/>
  <path d="M22.5,10 L26.5,5 L30.5,10 Z" fill="#454E6B"/>
  <!-- Arch connecting the towers over the road -->
  <path d="M9,15 Q16,10 23,15 L23,19 Q16,15 9,19 Z" fill="#7E8299"/>
  <!-- Toll boom barrier across the road, half-raised -->
  <rect x="10.5" y="22.5" width="11" height="1.4" rx="0.7" fill="#E8B94A" transform="rotate(-18 16 23.2)"/>
  <circle cx="10.5" cy="24.5" r="1.2" fill="#3A3F55"/>
  <!-- Toll booth window with the ledger lamp lit -->
  <rect x="3.5" y="18" width="4" height="3.4" rx="0.5" fill="#FFB347" opacity="0.85"/>
  <rect x="24.5" y="18" width="4" height="3.4" rx="0.5" fill="#FFB347" opacity="0.85"/>
  <!-- Toll banner over the arch -->
  <rect x="15.4" y="6" width="1.2" height="5" fill="#5E6A8C"/>
  <path d="M14,6.5 L18,6.5 L16,8.8 Z" fill="#E8B94A"/>
  <!-- Mist pooling under the arch -->
  <ellipse cx="16" cy="20.5" rx="5" ry="1.6" fill="#E8EAF4" opacity="0.45"/>
</svg>
