<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Prism Warden — walk frame 1 (left leg forward) -->
  <polygon points="16,4 20,8 16,11 12,8" fill="#b0d8ff" stroke="#6699cc" stroke-width="1"/>
  <rect x="12" y="11" width="8" height="9" rx="1" fill="#88bbee" stroke="#4477aa" stroke-width="1"/>
  <polygon points="12,11 9,9 9,16 12,16" fill="#a0ccee" stroke="#5588bb" stroke-width="0.8"/>
  <polygon points="20,11 23,9 23,16 20,16" fill="#a0ccee" stroke="#5588bb" stroke-width="0.8"/>
  <!-- Left leg forward -->
  <rect x="12" y="20" width="3" height="7" rx="1" fill="#7aaddd" stroke="#4477aa" stroke-width="0.8" transform="rotate(-15,13.5,20)"/>
  <!-- Right leg back -->
  <rect x="17" y="20" width="3" height="7" rx="1" fill="#7aaddd" stroke="#4477aa" stroke-width="0.8" transform="rotate(15,18.5,20)"/>
  <rect x="8" y="13" width="4" height="5" rx="1" fill="#cce8ff" stroke="#5599cc" stroke-width="1"/>
  <rect x="20" y="12" width="3" height="8" rx="1" fill="#99ccee" stroke="#4477aa" stroke-width="0.8"/>
  <rect x="21" y="8" width="2" height="5" rx="0.5" fill="#ddeeff" stroke="#6699cc" stroke-width="0.8"/>
  <rect x="14" y="6" width="4" height="2" rx="0.5" fill="#eef8ff" opacity="0.9"/>
</svg>
