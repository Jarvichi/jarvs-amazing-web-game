<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tidal Sovereign: ocean-blue scales, fin crown, trident -->
  <!-- Body -->
  <rect x="10" y="13" width="12" height="12" rx="1" fill="#0d4a6b"/>
  <!-- Scale texture -->
  <rect x="11" y="15" width="4" height="3" rx="1" fill="#0a3a54" opacity="0.7"/>
  <rect x="17" y="15" width="4" height="3" rx="1" fill="#0a3a54" opacity="0.7"/>
  <rect x="11" y="20" width="4" height="3" rx="1" fill="#0a3a54" opacity="0.7"/>
  <rect x="17" y="20" width="4" height="3" rx="1" fill="#0a3a54" opacity="0.7"/>
  <!-- Fin crown -->
  <rect x="11" y="5" width="10" height="9" rx="2" fill="#0a3a54"/>
  <rect x="12" y="2" width="3" height="6" rx="1" fill="#1a6fa0"/>
  <rect x="17" y="2" width="3" height="6" rx="1" fill="#1a6fa0"/>
  <rect x="15" y="1" width="2" height="5" rx="1" fill="#2a8fbf"/>
  <!-- Eyes -->
  <rect x="13" y="9" width="2" height="2" fill="#00cfff"/>
  <rect x="17" y="9" width="2" height="2" fill="#00cfff"/>
  <!-- Trident -->
  <rect x="25" y="10" width="2" height="18" rx="1" fill="#1a6fa0"/>
  <rect x="23" y="10" width="2" height="5" rx="1" fill="#2a8fbf"/>
  <rect x="27" y="10" width="2" height="5" rx="1" fill="#2a8fbf"/>
  <rect x="25" y="8" width="2" height="5" rx="1" fill="#2a8fbf"/>
</svg>