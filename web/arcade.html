<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>JAWG Arcade</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #c2c3c7;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #frame {
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
      padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { margin: 0; width: min(480px, 100%); }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #logo { width: min(480px, 100%); aspect-ratio: 160 / 64; }
    #cabinets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      width: min(1100px, 100%);
    }
    /* Phones in portrait: one cabinet per row. */
    @media (max-width: 640px) and (orientation: portrait) {
      #cabinets { grid-template-columns: minmax(0, 480px); justify-content: center; }
    }
    .cabinet {
      display: block;
      border: 3px solid #1d2b53;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      outline: none;
      transition: border-color 0.1s, transform 0.1s;
    }
    .cabinet canvas { width: 100%; aspect-ratio: 160 / 100; }
    .cabinet:hover, .cabinet:focus-visible { border-color: #ffec27; }
    .cabinet:active { transform: translateY(2px); border-color: #ffa300; }
    #help {
      font: bold 11px ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 1px;
      color: #5f574f;
      text-align: center;
    }
    #help a { color: #83769c; }
    #help a:active { color: #c2c3c7; }
    /* CRT: scanlines plus a soft vignette, toggled with C. */
    #frame.crt::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.22) 2px 3px),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.45) 100%);
    }
  </style>
</head>
<body>
  <main id="frame">
    <h1><canvas id="logo" width="160" height="64" aria-label="JAWG Arcade"></canvas></h1>
    <nav id="cabinets" aria-label="Games"></nav>
    <p id="help">TAP A CABINET TO PLAY &middot; ARROWS + ENTER &middot; C CRT<br /><br /><a href="/">BACK TO JARV'S AMAZING WEB GAME</a></p>
  </main>
  <script type="module" src="/src/arcade/index.ts"></script>
</body>
</html>
