name: Balance Test

# Simulates every battle/elite/boss node with a greedy and a passive player
# (100 runs each) to catch unwinnable/unlosable/trivial nodes. A full sweep
# is too slow for every push, so this only runs when the data it checks
# actually changes. Report-only for now (#2268) — the baseline is not known
# to be clean yet, so a balance regression annotates the run rather than
# failing it. Flip `continue-on-error` off once the baseline is clean and a
# real regression should block merges.

on:
  push:
    branches-ignore:
      - main
    paths:
      - web/src/data/cards.json
      - web/src/data/acts/**
      - web/scripts/balance-test.ts
      - .github/workflows/balance-test.yml

# Checkout and a local simulation are all this needs — it writes its report
# to the job summary, not back to the repo or the API.
permissions:
  contents: read

# This sweep is minutes long, so a burst of pushes to one branch would
# otherwise stack several of them. Only the newest is worth running — the
# result is a property of the head commit, not of the ones it replaced.
concurrency:
  group: balance-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balance-test:
    runs-on: ubuntu-latest
    # Measured on two threads: the full 32-node sweep is ~95s at BALANCE_RUNS=10
    # and ~300s at 30, so cost is linear in depth and the script's default of
    # 100 would be ~16 min locally and longer on a shared runner. This cap
    # leaves ample headroom over the depth set below while still stopping a
    # pathological run from sitting against GitHub's 6-hour default on every
    # cards/acts change.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: web

      - name: Run balance test
        id: balance
        working-directory: web
        continue-on-error: true
        env:
          # Shallower than the local default of 100 so the sweep fits the
          # timeout above, but deep enough for the verdict to mean something.
          # The floor check is a 10% win rate, so at depth 10 a node needed a
          # single win and its pass/fail turned on one stochastic shuffle —
          # consecutive depth-10 sweeps reported 0/32 then 1/32 off exactly
          # that (#2282). At 30 a node needs 3 wins, for ~5 min locally.
          # The script prints the depth it ran at.
          BALANCE_RUNS: 30
        run: npm run balance-test | tee balance-test-output.txt

      - name: Publish results to job summary
        if: always()
        working-directory: web
        run: |
          {
            echo "## Balance test results"
            if [ "${{ steps.balance.outcome }}" = "failure" ]; then
              echo ""
              echo "⚠️ One or more nodes failed balance criteria. This workflow reports only and does not block merges — see #2268."
            fi
            echo ""
            echo '```'
            # The live progress display draws with ANSI cursor/erase codes;
            # strip those so the summary is plain text. The final results
            # table is printed with plain console.log (no escape codes).
            sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' balance-test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
